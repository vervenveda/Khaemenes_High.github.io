</head><body><main class='main' style='max-width:1000px;margin:auto'><header class="hero"><div class="eyebrow">Khaemenes High · Grade 12 Research Laboratory</div><h1>Diplomacy &amp; Negotiation Planner</h1><div class="heroActions noPrint"><a class="button secondary" href="index.html">Research Tools</a><a class="button ghost" href="../index.html">Course Home</a><button onclick="window.print()">Print</button></div></header><section class="card"><p>Name: ______________________________ Date: ______________ Week/Assessment: __________________</p><label><strong>Assigned actor and authority</strong><textarea rows='5'></textarea></label><label><strong>Interests and public position</strong><textarea rows='5'></textarea></label><label><strong>Private priorities and constraints</strong><textarea rows='5'></textarea></label><label><strong>Reservation point</strong><textarea rows='5'></textarea></label><label><strong>Leverage and coalition options</strong><textarea rows='5'></textarea></label><label><strong>Other actors’ likely interests</strong><textarea rows='5'></textarea></label><label><strong>Opening proposal</strong><textarea rows='5'></textarea></label><label><strong>Possible trades and issue linkages</strong><textarea rows='5'></textarea></label><label><strong>Verification and enforcement</strong><textarea rows='5'></textarea></label><label><strong>Escalation risks</strong><textarea rows='5'></textarea></label><label><strong>Draft agreement</strong><textarea rows='5'></textarea></label><label><strong>After-action reflection</strong><textarea rows='5'></textarea></label><div class="actions noPrint"><button id="save">Save Local Draft</button><button id="clear" class="danger">Clear</button></div><p id="msg"></p></section><footer class='footer'>Khaemenes High · Grade 12 Research Laboratory · Jennifer Kay Pearl · 2026</footer></main><script>
const K='khae12_tool_'+location.pathname.split('/').pop(), fields=[...document.querySelectorAll('textarea,input[type="text"]')];
try{const d=JSON.parse(localStorage.getItem(K)||'{}');fields.forEach((x,i)=>x.value=d[i]||'')}catch(e){}
document.getElementById('save').onclick=()=>{const d={};fields.forEach((x,i)=>d[i]=x.value);localStorage.setItem(K,JSON.stringify(d));document.getElementById('msg').textContent='Draft saved in this browser.'};
document.getElementById('clear').onclick=()=>{if(confirm('Clear this local draft?')){localStorage.removeItem(K);fields.forEach(x=>x.value='');document.getElementById('msg').textContent='Draft cleared.'}};
</script><script src="https://vervenveda.com/Khaemenes_High.github.io/assets/vnv-beta-link.js" defer data-khaemenes-student-toolbar="v1.8"></script>
