<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Academy Civic Replay Lab · Khaemenes</title><style>*{box-sizing:border-box}body{margin:0;background:#f8f1df;color:#30271d;font:400 18px/1.55 Georgia,serif}main{max-width:860px;margin:auto;padding:20px}h1,h2{text-align:center;font-weight:400}h1{font-size:clamp(24px,6vw,33px)}button,select{font:inherit;color:inherit;background:#fffdf8;border:1px solid #90785a;border-radius:7px;padding:10px;min-height:44px}button{cursor:pointer}button:focus-visible,select:focus-visible{outline:3px solid #866b31}section{background:#fffdf7;border:1px solid #ad9474;border-radius:7px;padding:16px;margin:12px 0}label{display:inline-grid;gap:3px;margin:4px}.answers{display:grid;gap:8px}.answers button{text-align:left;overflow-wrap:anywhere}.muted{color:#5d5145}#feedback{min-height:24px}footer{text-align:center;margin-top:20px}@media(max-width:300px){main{padding:8px}section{padding:9px}label{display:grid}}@media print{.controls,#next{display:none}}</style></head><body><main><header><h1>Khaemenes Academy</h1><h2>Civic Replay Lab</h2><p class="muted">Optional Arcade-inspired practice. This activity never awards grades, changes quiz results, saves learner identities or bypasses mastery requirements.</p></header><section class="controls"><label>Grade<select id="grade"><option value="9">9</option><option value="10">10</option><option value="11">11</option><option value="12">12</option></select></label><label>Week<select id="week"></select></label><button id="load">Load weekly practice</button><button id="replay" disabled>Fresh replay</button></section><section aria-live="polite"><p id="status">Select a grade and week, then load practice.</p><p id="progress"></p><h2 id="prompt"></h2><div id="answers" class="answers"></div><p id="feedback" role="status"></p><button id="next" disabled>Next question</button></section><footer><a href="../index.html">Return to Social Studies</a><p>Jennifer Kay Pearl</p></footer></main><script>
(()=>{'use strict';const $=id=>document.getElementById(id);for(let i=1;i<=36;i++)$('week').add(new Option('Week '+i,String(i)));let questions=[],deck=[],pointer=0,current=null,correct=0,shown=0,lastStart=-1;const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};function start(){if(!questions.length)return;deck=shuffle(questions.map((_,i)=>i));if(deck.length>1&&deck[0]===lastStart){const j=1+Math.floor(Math.random()*(deck.length-1));[deck[0],deck[j]]=[deck[j],deck[0]]}lastStart=deck[0];pointer=0;correct=shown=0;$('replay').disabled=false;next()}function next(){if(pointer>=deck.length){$('prompt').textContent='Round complete';$('progress').textContent=correct+' correct of '+shown;$('answers').replaceChildren();$('feedback').textContent='Choose Fresh replay for a different sequence.';$('next').disabled=true;return}current=questions[deck[pointer++]];shown++;$('prompt').textContent=current.prompt||current.question;let options=current.choices||current.options;let randomized=shuffle(options.map((v,i)=>({text:v,sourceIndex:i})));$('answers').replaceChildren();$('feedback').textContent='';$('next').disabled=true;$('progress').textContent='Question '+shown+' of '+deck.length+' · '+correct+' correct';for(const option of randomized){const b=document.createElement('button');b.type='button';b.textContent=option.text;b.onclick=()=>{const ok=option.sourceIndex===current.answer;if(ok)correct++;$('feedback').textContent=(ok?'Correct. ':'Review this one. ')+(current.explanation||'');$('progress').textContent='Question '+shown+' of '+deck.length+' · '+correct+' correct';for(const control of $('answers').querySelectorAll('button'))control.disabled=true;$('next').disabled=false};$('answers').append(b)}}$('next').onclick=next;$('replay').onclick=start;$('load').onclick=async()=>{const g=Number($('grade').value),w=String($('week').value).padStart(2,'0');const relative=(g<=10?'../grade-'+String(g).padStart(2,'0')+'/week-'+w:'../grade-'+String(g).padStart(2,'0')+'/weeks/week-'+w)+'/quiz.json';$('status').textContent='Loading the Academy weekly bank…';$('answers').replaceChildren();$('next').disabled=$('replay').disabled=true;questions=[];try{const response=await fetch(relative,{cache:'no-store'});if(!response.ok)throw new Error('Bank unavailable ('+response.status+')');const data=await response.json();if(!Array.isArray(data.questions)||!data.questions.length||!data.questions.every(q=>{const c=q.choices||q.options;return typeof(q.prompt||q.question)==='string'&&Array.isArray(c)&&c.length>=2&&Number.isInteger(q.answer)&&q.answer>=0&&q.answer<c.length}))throw new Error('Bank has invalid questions or answer keys');const unique=new Map();for(const q of data.questions){const key=(q.prompt||q.question).trim().replace(/\\s+/g,' ').toLowerCase();if(!unique.has(key))unique.set(key,q)}questions=[...unique.values()];$('status').textContent='Loaded '+questions.length+' distinct questions from Grade '+g+', Week '+Number(w)+(questions.length<data.questions.length?' ('+(data.questions.length-questions.length)+' repeated prompts skipped).':'.')+' Practice only; no scored records are changed.';start()}catch(e){$('status').textContent='Unable to load practice: '+e.message+'. Check the bank or network connection.';$('prompt').textContent='';$('progress').textContent='';$('feedback').textContent=''}}})();
</script></body></html>
