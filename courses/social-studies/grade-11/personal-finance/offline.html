<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Offline · Personal Financial Literacy &amp; Money Management Honors</title><link rel="stylesheet" href="styles.css"><style id="khaemenes-typography-standard">
/* Khaemenes High presentation typography · 55 / 33 / 24 / 14 px.
   All public pages receive this local, embedded policy for offline use.
   Only presentation changes. Existing grids, gates, learner records, assessments and STOS are preserved.
   Font names are optional installed system fonts; no downloads or third-party font services. */
html:root:root body {
  font-family: "Brandon Grotesque", "Avenir Next", Avenir, "Segoe UI", Arial, sans-serif !important;
  font-size: 14px !important;
  font-weight: 400 !important;
  line-height: 1.65 !important;
  -webkit-text-size-adjust: 100%;
  overflow-wrap: break-word;
}
html:root:root body :is(button, input, select, textarea) {
  font-family: "Brandon Grotesque", "Avenir Next", Avenir, "Segoe UI", Arial, sans-serif !important;
}
html:root:root body :is(h1, h2, h3, h4, h5, h6, .page-title, .hero-title, .brand-title, .display-title, .site-title) {
  font-family: Cinzel, "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif !important;
  font-weight: 400 !important;
  overflow-wrap: anywhere;
}
html:root:root body :is(.eyebrow, .kicker, .dialog-eyebrow, .dialog-kicker, .worksheet-kicker) {
  font-family: Cinzel, "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif !important;
  font-size: 55px !important;
  font-weight: 400 !important;
  line-height: 1.15 !important;
  letter-spacing: .02em !important;
  white-space: normal !important;
  overflow-wrap: anywhere;
}
html:root:root body h1 {
  font-size: 33px !important;
  line-height: 1.2 !important;
  white-space: normal !important;
  overflow-wrap: anywhere;
}
html:root:root body h2,
html:root:root body :is(.subtitle, .hero-subtitle, .hero-sub, .academy-comment),
html:root:root body .hero .comment {
  font-size: 24px !important;
  line-height: 1.35 !important;
  white-space: normal !important;
  overflow-wrap: anywhere;
}
/* Do not replace responsive grids or fixed elements; prevent oversized titles from
   demanding horizontal scrolling on narrow phone and tablet displays. */
html:root:root body :is(.hero, .header, .page-header, .section-head, .lesson-header) {
  min-width: 0;
}
@media print {
  html:root:root body { font-size: 14px !important; }
}
</style>
