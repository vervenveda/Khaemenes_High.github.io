<!doctype html><html><head><title>Consumer Financial Decision Planner</title><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../assets/unit.css"><style>.sheet{max-width:8.1in;margin:auto;padding:24px;text-align:left}.student{display:grid;grid-template-columns:2fr 1fr 1fr;gap:14px}.line{border-bottom:1px solid #555;height:22px}.problem{break-inside:avoid;margin:16px 0}.work{height:78px;border:1px solid #aaa;background:repeating-linear-gradient(0deg,transparent,transparent 22px,#ddd 23px)}.actions{margin:16px 0}@page{size:letter;margin:.45in}@media print{.actions{display:none!important}body{background:#fff!important;color:#000!important}.sheet{max-width:none;padding:0}}</style></head><body><main class="sheet"><h1>Consumer Financial Decision Investigation</h1><div class="student"><div>Name<div class="line"></div></div><div>Date<div class="line"></div></div><div>Class<div class="line"></div></div></div><h2>Decision / Question</h2><div class="work"></div><h2>Options, Rates, Fees & Time</h2><div class="work" style="height:180px"></div><h2>Percent Models & Calculations</h2><div class="work" style="height:230px"></div><h2>Total Outcomes & Comparison</h2><div class="work" style="height:190px"></div><h2>Assumptions, Risks & Limitations</h2><div class="work" style="height:150px"></div><h2>Recommendation & Reasonableness Check</h2><div class="work" style="height:170px"></div></main></body></html>
