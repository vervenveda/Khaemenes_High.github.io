omain":"Meaning","prompt":"Which is equivalent to 72%?","options":["0.072","0.72","7.2","72"],"answer":1,"explanation":"72%=0.72.","lesson":"l01","skill":"meaning","dimension":"representation-interpretation"},{"id":"U05-M02","domain":"Conversion","prompt":"3/8 equals:","options":["3.8%","30%","38%","37.5%"],"answer":3,"explanation":"3÷8=0.375.","lesson":"l01","skill":"conversion","dimension":"procedural-fluency"},{"id":"U05-M03","domain":"Benchmark","prompt":"About 61% of 198 is:","options":["about 120","about 20","about 60","about 200"],"answer":0,"explanation":"60% of 200 is 120.","lesson":"l01","skill":"benchmark","dimension":"procedural-fluency"},{"id":"U05-M04","domain":"Percent of quantity","prompt":"14% of 650 is:","options":["65","78","91","104"],"answer":2,"explanation":"0.14×650=91.","lesson":"l02","skill":"percent-of-quantity","dimension":"procedural-fluency"},{"id":"U05-M05","domain":"Percent of quantity","prompt":"0.80% of 4,000 is:","options":["3","300","30","3,000"],"answer":2,"explanation":"0.0075×4000=30.","lesson":"l02","skill":"percent-of-quantity","dimension":"procedural-fluency"},{"id":"U05-M06","domain":"Find percent","prompt":"84 is what percent of 240?","options":["35%","28%","40%","84%"],"answer":0,"explanation":"84÷240=0.35.","lesson":"l02","skill":"find-percent","dimension":"procedural-fluency"},{"id":"U05-M07","domain":"Find whole","prompt":"45 is 18% of:","options":["81","225","810","250"],"answer":3,"explanation":"45÷0.18=250.","lesson":"l03","skill":"find-whole","dimension":"procedural-fluency"},{"id":"U05-M08","domain":"Percent increase","prompt":"A count grows from 320 to 368. Increase?","options":["18%","15%","48%","85%"],"answer":1,"explanation":"48÷320=15%.","lesson":"l03","skill":"percent-increase","dimension":"procedural-fluency"},{"id":"U05-M09","domain":"Percent decrease","prompt":"A value drops from 750 to 630. Decrease?","options":["16%","12%","19%","120%"],"answer":0,"explanation":"120÷750=16%.","lesson":"l03","skill":"percent-decrease","dimension":"procedural-fluency"},{"id":"U05-M10","domain":"Multiplier","prompt":"A 12.5% increase uses:","options":["0.125","0.875","1.125","1.25"],"answer":2,"explanation":"1+0.125=1.125.","lesson":"l04","skill":"multiplier","dimension":"multi-step-application"},{"id":"U05-M11","domain":"Reverse percent","prompt":"A value after a 30% decrease is 140. Original?","options":["98","200","170","182"],"answer":1,"explanation":"140÷0.70=200.","lesson":"l04","skill":"reverse-percent","dimension":"multi-step-application"},{"id":"U05-M12","domain":"Discount","prompt":"A $260 item is 35% off. Sale price?","options":["$91","$225","$351","$169"],"answer":3,"explanation":"260×0.65=169.","lesson":"l04","skill":"discount","dimension":"procedural-fluency"},{"id":"U05-M13","domain":"Tax","prompt":"A $125 purchase with 8% tax totals:","options":["$10","$125.08","$1,000","$135"],"answer":3,"explanation":"Tax is 10; total 135.","lesson":"l05","skill":"tax","dimension":"multi-step-application"},{"id":"U05-M14","domain":"Tip","prompt":"A 16% tip on $62.50 is:","options":["$8","$10","$16","$72.50"],"answer":1,"explanation":"0.16×62.5=10.","lesson":"l05","skill":"tip","dimension":"procedural-fluency"},{"id":"U05-M15","domain":"Commission","prompt":"4.5% commission on $32,000 is:","options":["$144","$720","$1,440","$14,400"],"answer":2,"explanation":"0.045×32000=1440.","lesson":"l05","skill":"commission","dimension":"procedural-fluency"},{"id":"U05-M16","domain":"Markup","prompt":"$72 cost with 30% markup sells for:","options":["$93.60","$21.60","$50.40","$102"],"answer":0,"explanation":"72×1.30=93.60.","lesson":"l06","skill":"markup","dimension":"multi-step-application"},{"id":"U05-M17","domain":"Profit percent","prompt":"Cost $120, sell $150. Profit percent on cost?","options":["20%","25%","30%","80%"],"answer":1,"explanation":"Profit 30 divided by 120 is 25%.","lesson":"l06","skill":"profit-percent","dimension":"multi-step-application"},{"id":"U05-M18","domain":"Loss percent","prompt":"Cost $200, sell $170. Loss percent on cost?","options":["15%","17.6%","30%","85%"],"answer":0,"explanation":"Loss 30 divided by 200 is 15%.","lesson":"l06","skill":"loss-percent","dimension":"multi-step-application"},{"id":"U05-M19","domain":"Simple interest","prompt":"$2,400 at 5% for 3 years earns:","options":["$120","$240","$2,760","$360"],"answer":3,"explanation":"2400×0.05×3=360.","lesson":"l07","skill":"simple-interest","dimension":"multi-step-application"},{"id":"U05-M20","domain":"Time conversion","prompt":"15 months equals:","options":["0.15 year","1.5 years","1.25 years","15 years"],"answer":2,"explanation":"15÷12=1.25.","lesson":"l07","skill":"time-conversion","dimension":"procedural-fluency"},{"id":"U05-M21","domain":"Fees and rates","prompt":"Which costs less on $1,500 for two years?","options":["4% simple interest with no fee","Equal","3% simple interest plus $25 fee","Cannot tell"],"answer":2,"explanation":"Option A 90+25=115; Option B 120.","lesson":"l07","skill":"fees-and-rates","dimension":"multi-step-application"},{"id":"U05-M22","domain":"Percentage points","prompt":"A rate rises from 47% to 53%. Difference:","options":["6% relative increase","47 points","100 points","6 percentage points"],"answer":3,"explanation":"53−47=6.","lesson":"l08","skill":"percentage-points","dimension":"multi-step-application"},{"id":"U05-M23","domain":"Repeated change","prompt":"$1,000 rises 12% then falls 12%. Final:","options":["$985.60","$880","$1,000","$1,014.40"],"answer":0,"explanation":"1000×1.12×0.88=985.60.","lesson":"l08","skill":"repeated-change","dimension":"procedural-fluency"},{"id":"U05-M24","domain":"Decision quality","prompt":"A transparent financial comparison should disclose:","options":["only the largest percent","rates, fees, time, totals, and assumptions","only the monthly payment","only the brand name"],"answer":1,"explanation":"A defensible decision uses full terms and assumptions.","lesson":"l08","skill":"decision-quality","dimension":"transfer-reasoning"},{"id":"U05-M25","domain":"Percent reasoning","prompt":"A $240 item is discounted 25% and then taxed 8% on the sale price. What is the final cost?","options":["$194.40","$198.00","$201.60","$180.00"],"answer":0,"explanation":"240×0.75=180, then 180×1.08=194.40.","lesson":"l08","skill":"successive-percent-change","dimension":"multi-step-application"}],"reasoning_prompts":["Which percent or financial strategy helped you most?","Where did you check the base, multiplier, time, or total cost?"],"assessment_note":"25-question cumulative mastery check; exactly 20 correct is required to meet the 80% mastery standard.","assessment_version":"3.0","blueprint_version":"prealgebra-unit-mastery-v3","question_count":25,"pass_count":20};</script><script src="../assets/assessment-engine.js"></script>
