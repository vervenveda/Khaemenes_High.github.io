ula","dimension":"procedural-fluency"},{"id":"U08-M19","domain":"Formula","prompt":"Solve y=mx+b for m.","options":["(y+b)/x","x/(y−b)","yx−b","(y−b)/x"],"answer":3,"explanation":"Subtract b and divide by x.","lesson":"l07","skill":"formula","dimension":"procedural-fluency"},{"id":"U08-M20","domain":"Context","prompt":"A plan costs $16 plus $9 per month and totals $97. Months:","options":["7","11","9","13"],"answer":2,"explanation":"9m=81.","lesson":"l07","skill":"context","dimension":"transfer-reasoning"},{"id":"U08-M21","domain":"Geometry","prompt":"Perimeter 70, width 14. Length:","options":["7","14","21","28"],"answer":2,"explanation":"2l+28=70.","lesson":"l07","skill":"geometry","dimension":"procedural-fluency"},{"id":"U08-M22","domain":"Error analysis","prompt":"Correct expansion of −3(2x−5):","options":["−6x−15","6x−15","6x+15","−6x+15"],"answer":3,"explanation":"Distribute −3 to both terms.","lesson":"l08","skill":"error-analysis","dimension":"error-analysis"},{"id":"U08-M23","domain":"Constraint","prompt":"A formula contains 1/(x−4). Required:","options":["x≠4","x≠0","x>4","x=4"],"answer":0,"explanation":"Denominator cannot be zero.","lesson":"l08","skill":"constraint","dimension":"procedural-fluency"},{"id":"U08-M24","domain":"Decision quality","prompt":"A trustworthy equation model should include:","options":["only a solution","definitions, units, assumptions, constraints, and a check","only a graph","no interpretation"],"answer":1,"explanation":"Transparent reasoning includes conditions and verification.","lesson":"l08","skill":"decision-quality","dimension":"transfer-reasoning"},{"id":"U08-M25","domain":"Literal equations","prompt":"Solve A=bh for h.","options":["h=A−b","h=A/b","h=b/A","h=Ab"],"answer":1,"explanation":"Divide both sides by b, assuming b≠0.","lesson":"l08","skill":"literal-equation","dimension":"procedural-fluency"}],"reasoning_prompts":["Which equation-solving or formula strategy helped you most?","Where did you verify equality, substit
