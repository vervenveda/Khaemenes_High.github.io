</head><body data-high-assessment-shell="true"><a class="skip" href="#main">Skip to main content</a><main id="main"><section class="hero"><div class="wrap"><p class="eyebrow">Cumulative Assessment · 25 Questions</p><h1>Unit 9 Mastery Check</h1><p class="lead">A cumulative check across all seven lessons. Results remain in this browser.</p><div class="actions"><a class="btn" href="../#lessons">Review Lessons</a><button class="btn" id="printPage" type="button">Print</button></div></div></section><section><div class="wrap assessment-layout"><article class="card assessment-main"><form class="question-list" id="questionList"></form><div class="reasoning" id="reasoningSection"></div></article><aside class="card assessment-side"><p class="eyebrow">Progress</p><div class="dot-grid" id="dotGrid"></div><p class="notice" id="resultMessage">Answer every scored question before submitting.</p><div class="side-actions"><button class="btn primary" id="submitButton" type="button">Submit & Review</button><button class="btn" id="saveDraft" type="button">Save Draft</button><button class="btn" id="resetButton" type="button">Reset</button><button class="btn" id="exportButton" type="button">Export Result</button></div></aside></div></section><section id="results" hidden><div class="wrap"><article class="card assessment-main"><p class="eyebrow">Result</p><div class="result-score" id="resultScore"></div><h2 id="resultTitle"></h2><p class="notice" id="resultSummary"></p><div class="grid domain-grid" id="domainGrid"></div></article></div></section></main><footer class="footer"><div class="wrap footer-inner"><span>Pre-Algebra Unit 9</span><span>Results stay in this browser</span></div></footer><script>window.ASSESSMENT_CONFIG={"title":"Unit 9 Mastery Check","subtitle":"A cumulative check across all seven lessons. Results remain in this browser.","storage_key":"khaemenes-prealgebra-u09-mastery-v1","pathway":"Cumulative Assessment","threshold":80,"show_hints":false,"questions":[{"id":"U09-M01","domain":"Meaning","prompt":"Which means “x is at least −3”?","options":["x<−3","x≥−3","x≤−3","x>−3"],"answer":1,"explanation":"At least is inclusive greater than.","lesson":"l01","skill":"meaning","dimension":"representation-interpretation"},{"id":"U09-M02","domain":"Meaning","prompt":"Which means “no more than 40”?","options":["x<40","x>40","x≥40","x≤40"],"answer":3,"explanation":"No more than means at most.","lesson":"l01","skill":"meaning","dimension":"representation-interpretation"},{"id":"U09-M03","domain":"Graph","prompt":"x<5 uses:","options":["open at 5, left","closed at 5, right","closed at 5, left","open at 5, right"],"answer":0,"explanation":"Strict and less-than.","lesson":"l01","skill":"graph","dimension":"representation-interpretation"},{"id":"U09-M04","domain":"Graph","prompt":"Closed at −2, shaded right is:","options":["x>−2","x<−2","x≥−2","x≤−2"],"answer":2,"explanation":"Closed includes the boundary.","lesson":"l01","skill":"graph","dimension":"representation-interpretation"},{"id":"U09-M05","domain":"Addition","prompt":"Solve x−18≤−7.","options":["x≥11","x≤−25","x≤11","x≥−25"],"answer":2,"explanation":"Add 18.","lesson":"l02","skill":"addition","dimension":"procedural-fluency"},{"id":"U09-M06","domain":"Positive division","prompt":"Solve 9x>63.","options":["x>7","x<7","x>54","x<72"],"answer":0,"explanation":"Divide by positive 9.","lesson":"l02","skill":"positive-division","dimension":"procedural-fluency"},{"id":"U09-M07","domain":"Reversal","prompt":"Solve −4x≥28.","options":["x≥−7","x≥7","x≤7","x≤−7"],"answer":3,"explanation":"Divide by −4 and reverse.","lesson":"l02","skill":"reversal","dimension":"procedural-fluency"},{"id":"U09-M08","domain":"Negative denominator","prompt":"Solve x/−6<2.","options":["x<−12","x>−12","x<12","x>12"],"answer":1,"explanation":"Multiply by −6 and reverse.","lesson":"l03","skill":"negative-denominator","dimension":"procedural-fluency"},{"id":"U09-M09","domain":"Two-step","prompt":"Solve 5x+4<29.","options":["x<5","x>5","x<6.6","x>6.6"],"answer":0,"explanation":"5x<25.","lesson":"l03","skill":"two-step","dimension":"procedural-fluency"},{"id":"U09-M10","domain":"Distribution","prompt":"Solve 3(x+1)≤18.","options":["x≥5","x≤6","x≤5","x≥6"],"answer":2,"explanation":"x+1≤6.","lesson":"l03","skill":"distribution","dimension":"procedural-fluency"},{"id":"U09-M11","domain":"Both sides","prompt":"Solve 7x−6>2x+14.","options":["x<4","x>4","x>20","x<20"],"answer":1,"explanation":"5x>20.","lesson":"l03","skill":"both-sides","dimension":"procedural-fluency"},{"id":"U09-M12","domain":"All real","prompt":"Classify 4x−3≤4x+2.","options":["x≤5/4","x≥5/4","no solution","all real numbers"],"answer":3,"explanation":"−3≤2 is always true.","lesson":"l04","skill":"all-real","dimension":"procedural-fluency"},{"id":"U09-M13","domain":"No solution","prompt":"Classify 2(x+5)<2x+3.","options":["x<−7/2","x>−7/2","all real numbers","no solution"],"answer":3,"explanation":"10<3 is false.","lesson":"l04","skill":"no-solution","dimension":"procedural-fluency"},{"id":"U09-M14","domain":"Compound and","prompt":"Solve x≥−1 and x<6.","options":["x<−1 or x≥6","−1≤x<6","−1<x≤6","all real numbers"],"answer":1,"explanation":"Take the overlap.","lesson":"l04","skill":"compound-and","dimension":"procedural-fluency"},{"id":"U09-M15","domain":"Compound or","prompt":"Solve x<−5 or x≥2.","options":["−5<x<2","empty set","two outward rays","all real numbers"],"answer":2,"explanation":"The union has two rays.","lesson":"l05","skill":"compound-or","dimension":"procedural-fluency"},{"id":"U09-M16","domain":"Chained","prompt":"Solve −5<2x+1≤9.","options":["−3<x≤4","−2<x≤5","−6<x≤8","x≤−3 or x>4"],"answer":0,"explanation":"Subtract 1, divide by 2.","lesson":"l05","skill":"chained","dimension":"procedural-fluency"},{"id":"U09-M17","domain":"Boundary","prompt":"Which value is excluded from −2≤x<4?","options":["−2","4","0","3.9"],"answer":1,"explanation":"The upper boundary is strict.","lesson":"l05","skill":"boundary","dimension":"procedural-fluency"},{"id":"U09-M18","domain":"Context","prompt":"$30 plus $7 per item must be at most $121. Maximum items:","options":["13","12","14","17"],"answer":0,"explanation":"7n≤91, n≤13.","lesson":"l05","skill":"context","dimension":"transfer-reasoning"},{"id":"U09-M19","domain":"Discrete","prompt":"n≤8.75 counts chairs. Greatest feasible n:","options":["8.75","9","7","8"],"answer":3,"explanation":"Chairs require whole numbers.","lesson":"l06","skill":"discrete","dimension":"procedural-fluency"},{"id":"U09-M20","domain":"Round up","prompt":"At least 205 units in groups of 32 requires groups:","options":["6","6.41","7","8"],"answer":2,"explanation":"Round up to meet the minimum.","lesson":"l06","skill":"round-up","dimension":"procedural-fluency"},{"id":"U09-M21","domain":"Nonnegative","prompt":"Which domain is reasonable for number of participants p?","options":["all real numbers","negative integers","p≥0 whole numbers","p≠0 only"],"answer":2,"explanation":"Participants are counted and nonnegative.","lesson":"l06","skill":"nonnegative","dimension":"representation-interpretation"},{"id":"U09-M22","domain":"Verification","prompt":"To verify x≤3 as a solution set, test:","options":["only x=3","only x=100","only the graph label","a value inside and outside in the original inequality"],"answer":3,"explanation":"Membership and exclusion checks support the conclusion.","lesson":"l07","skill":"verification","dimension":"procedural-fluency"},{"id":"U09-M23","domain":"Reversal reasoning","prompt":"Why does multiplying by −1 reverse 2<5?","options":["it reflects order, giving −2>−5","it produces −2<−5","all negatives are equal","the symbol is decorative"],"answer":0,"explanation":"Negative scaling reverses order.","lesson":"l07","skill":"reversal-reasoning","dimension":"transfer-reasoning"},{"id":"U09-M24","domain":"Decision quality","prompt":"A trustworthy constraint conclusion states:","options":["only the algebraic endpoint","solution set, endpoint rules, units, domain, assumptions, and feasibility","only a decimal","no context"],"answer":1,"explanation":"Complete interpretation is required.","lesson":"l07","skill":"decision-quality","dimension":"transfer-reasoning"},{"id":"U09-M25","domain":"Compound inequalities","prompt":"Solve −2≤3x+4<13.","options":["−2≤x<3","−6≤x<9","−2<x≤3","x<3 only"],"answer":0,"explanation":"Subtract 4: −6≤3x<9; divide by 3: −2≤x<3.","lesson":"l07","skill":"compound-inequality","dimension":"procedural-fluency"}],"reasoning_prompts":["Which inequality or constraint strategy helped you most?","Where did you check direction, boundary inclusion, domain, units, or feasibility?"],"assessment_note":"25-question cumulative mastery check; exactly 20 correct is required to meet the 80% mastery standard.","assessment_version":"3.0","blueprint_version":"prealgebra-unit-mastery-v3","question_count":25,"pass_count":20};</script><script src="../assets/assessment-engine.js"></script>
