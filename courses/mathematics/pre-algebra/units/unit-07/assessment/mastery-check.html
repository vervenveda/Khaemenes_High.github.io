</head><body data-high-assessment-shell="true"><a class="skip" href="#main">Skip to main content</a><main id="main"><section class="hero"><div class="wrap"><p class="eyebrow">Cumulative Assessment · 25 Questions</p><h1>Unit 7 Mastery Check</h1><p class="lead">A cumulative check across all eight lessons. Results remain in this browser.</p><div class="actions"><a class="btn" href="../#lessons">Review Lessons</a><button class="btn" id="printPage" type="button">Print</button></div></div></section><section><div class="wrap assessment-layout"><article class="card assessment-main"><form class="question-list" id="questionList"></form><div class="reasoning" id="reasoningSection"></div></article><aside class="card assessment-side"><p class="eyebrow">Progress</p><div class="dot-grid" id="dotGrid"></div><p class="notice" id="resultMessage">Answer every scored question before submitting.</p><div class="side-actions"><button class="btn primary" id="submitButton" type="button">Submit & Review</button><button class="btn" id="saveDraft" type="button">Save Draft</button><button class="btn" id="resetButton" type="button">Reset</button><button class="btn" id="exportButton" type="button">Export Result</button></div></aside></div></section><section id="results" hidden><div class="wrap"><article class="card assessment-main"><p class="eyebrow">Result</p><div class="result-score" id="resultScore"></div><h2 id="resultTitle"></h2><p class="notice" id="resultSummary"></p><div class="grid domain-grid" id="domainGrid"></div></article></div></section></main><footer class="footer"><div class="wrap footer-inner"><span>Pre-Algebra Unit 7</span><span>Results stay in this browser</span></div></footer><script>window.ASSESSMENT_CONFIG={"title":"Unit 7 Mastery Check","subtitle":"A cumulative check across all eight lessons. Results remain in this browser.","storage_key":"khaemenes-prealgebra-u07-mastery-v1","pathway":"Cumulative Assessment","threshold":80,"show_hints":false,"questions":[{"id":"U07-M01","domain":"Vocabulary","prompt":"In 12x²−5x+9, coefficient of x is:","options":["12","−5","5","9"],"answer":1,"explanation":"The x-term is −5x.","lesson":"l01","skill":"vocabulary","dimension":"procedural-fluency"},{"id":"U07-M02","domain":"Terms","prompt":"How many terms are in 3a²−2ab+b²?","options":["2","4","5","3"],"answer":3,"explanation":"Three additive parts.","lesson":"l01","skill":"terms","dimension":"procedural-fluency"},{"id":"U07-M03","domain":"Translation","prompt":"“Half the sum of x and 8” is:","options":["(x+8)/2","x/2+8","x+4","2(x+8)"],"answer":0,"explanation":"The whole sum is divided by 2.","lesson":"l01","skill":"translation","dimension":"procedural-fluency"},{"id":"U07-M04","domain":"Context","prompt":"A $30 fee plus $8 per class c is:","options":["30c+8","38c","8c+30","30+8"],"answer":2,"explanation":"Fixed fee plus variable cost.","lesson":"l02","skill":"context","dimension":"transfer-reasoning"},{"id":"U07-M05","domain":"Substitution","prompt":"Evaluate 4x−x² for x=−2.","options":["−4","4","−12","12"],"answer":2,"explanation":"−8−4=−12.","lesson":"l02","skill":"substitution","dimension":"procedural-fluency"},{"id":"U07-M06","domain":"Multiple variables","prompt":"2a²b for a=−3,b=2.","options":["36","−36","−18","18"],"answer":0,"explanation":"2·9·2=36.","lesson":"l02","skill":"multiple-variables","dimension":"multi-step-application"},{"id":"U07-M07","domain":"Commutative","prompt":"Which shows commutative multiplication?","options":["(ab)c=a(bc)","a·1=a","a/a=1","ab=ba"],"answer":3,"explanation":"Order changes.","lesson":"l03","skill":"commutative","dimension":"multi-step-application"},{"id":"U07-M08","domain":"Associative","prompt":"Which shows associative addition?","options":["a+b=b+a","(a+b)+c=a+(b+c)","a+0=a","a+(−a)=0"],"answer":1,"explanation":"Grouping changes.","lesson":"l03","skill":"associative","dimension":"procedural-fluency"},{"id":"U07-M09","domain":"Identity","prompt":"Which preserves x by multiplication?","options":["x·1","x·0","x+(−x)","x/x for x=0"],"answer":0,"explanation":"1 is multiplicative identity.","lesson":"l03","skill":"identity","dimension":"multi-step-application"},{"id":"U07-M10","domain":"Distribute","prompt":"Expand −4(2x−3).","options":["−8x−12","8x−12","−8x+12","8x+12"],"answer":2,"explanation":"Distribute −4 to both terms.","lesson":"l04","skill":"distribute","dimension":"procedural-fluency"},{"id":"U07-M11","domain":"Factor","prompt":"Factor 21x+14 using the greatest integer common factor.","options":["3(7x+14)","7(3x+2)","14(1.5x+1)","21(x+14)"],"answer":1,"explanation":"GCF is 7.","lesson":"l04","skill":"factor","dimension":"procedural-fluency"},{"id":"U07-M12","domain":"Like terms","prompt":"Simplify 5x²−2x+3x²+7x.","options":["8x²+9x","2x²+5x","8x⁴+5x","8x²+5x"],"answer":3,"explanation":"Combine matching powers.","lesson":"l04","skill":"like-terms","dimension":"procedural-fluency"},{"id":"U07-M13","domain":"Multi-step","prompt":"Simplify 3(2x−1)+4−x.","options":["5x−7","7x+1","6x+3","5x+1"],"answer":3,"explanation":"6x−3+4−x=5x+1.","lesson":"l05","skill":"multi-step","dimension":"multi-step-application"},{"id":"U07-M14","domain":"Equivalence","prompt":"Which equals 2(3x+5)−4?","options":["6x+1","6x+6","6x+10","3x+6"],"answer":1,"explanation":"6x+10−4=6x+6.","lesson":"l05","skill":"equivalence","dimension":"procedural-fluency"},{"id":"U07-M15","domain":"Formula","prompt":"For C=5/9(F−32), F=68 gives:","options":["10","36","20","100"],"answer":2,"explanation":"5/9·36=20.","lesson":"l05","skill":"formula","dimension":"procedural-fluency"},{"id":"U07-M16","domain":"Units","prompt":"If density=mass/volume, units kg/m³ are:","options":["mass per volume","volume per mass","mass times volume","unitless"],"answer":0,"explanation":"Kilograms divided by cubic meters.","lesson":"l06","skill":"units","dimension":"multi-step-application"},{"id":"U07-M17","domain":"Scaling","prompt":"If area A=s² and s triples, A becomes:","options":["3A","9A","6A","27A"],"answer":1,"explanation":"(3s)²=9s².","lesson":"l06","skill":"scaling","dimension":"multi-step-application"},{"id":"U07-M18","domain":"Pattern","prompt":"Rule 6n−2 at n=7 gives:","options":["40","34","42","44"],"answer":0,"explanation":"42−2=40.","lesson":"l06","skill":"pattern","dimension":"procedural-fluency"},{"id":"U07-M19","domain":"Explicit rule","prompt":"Sequence 4,9,14,19 has rule:","options":["4n+5","5n+4","9n−5","5n−1"],"answer":3,"explanation":"At n=1, 5−1=4.","lesson":"l07","skill":"explicit-rule","dimension":"procedural-fluency"},{"id":"U07-M20","domain":"Counterexample","prompt":"Which disproves x²>x for every real x?","options":["x=2","x=3","x=1/2","x=−2"],"answer":2,"explanation":"1/4 is not greater than 1/2.","lesson":"l07","skill":"counterexample","dimension":"error-analysis"},{"id":"U07-M21","domain":"Constraint","prompt":"For 7/(x−3), required constraint:","options":["x≠0","x>3","x≠3","x=3"],"answer":2,"explanation":"Denominator cannot be zero.","lesson":"l07","skill":"constraint","dimension":"procedural-fluency"},{"id":"U07-M22","domain":"Model meaning","prompt":"In C=12+4m, 12 represents:","options":["rate per month","number of months","total only","fixed starting amount"],"answer":3,"explanation":"The constant is the starting amount.","lesson":"l08","skill":"model-meaning","dimension":"transfer-reasoning"},{"id":"U07-M23","domain":"Model validity","prompt":"A linear model is least appropriate when:","options":["the rate changes after several units","rate remains constant","there is a fixed starting amount","variables have units"],"answer":0,"explanation":"A changing rate needs a piecewise or different model.","lesson":"l08","skill":"model-validity","dimension":"transfer-reasoning"},{"id":"U07-M24","domain":"Decision quality","prompt":"A defensible algebraic model should state:","options":["only a formula","variables, units, assumptions, constraints, and evidence","only an answer","no domain"],"answer":1,"explanation":"Transparent modelling requires definitions and limits.","lesson":"l08","skill":"decision-quality","dimension":"transfer-reasoning"},{"id":"U07-M25","domain":"Equivalent expressions","prompt":"Which expression is equivalent to 6x+18?","options":["6(x+3)","3(x+3)","6(x+18)","2(3x+18)"],"answer":0,"explanation":"Factor the greatest common factor 6: 6(x+3).","lesson":"l08","skill":"factor-equivalent-expression","dimension":"procedural-fluency"}],"reasoning_prompts":["Which algebraic strategy helped you most?","Where did you verify structure, substitution, units, or assumptions?"],"assessment_note":"25-question cumulative mastery check; exactly 20 correct is required to meet the 80% mastery standard.","assessment_version":"3.0","blueprint_version":"prealgebra-unit-mastery-v3","question_count":25,"pass_count":20};</script><script src="../assets/assessment-engine.js"></script>
