</head><body data-high-assessment-shell="true"><a class="skip" href="#main">Skip to main content</a><main id="main"><section class="hero"><div class="wrap"><p class="eyebrow">Cumulative Assessment · 25 Questions</p><h1>Unit 10 Mastery Check</h1><p class="lead">A cumulative check across all eight lessons. Results remain in this browser.</p><div class="actions"><a class="btn" href="../#lessons">Review Lessons</a><button class="btn" id="printPage" type="button">Print</button></div></div></section><section><div class="wrap assessment-layout"><article class="card assessment-main"><form class="question-list" id="questionList"></form><div class="reasoning" id="reasoningSection"></div></article><aside class="card assessment-side"><p class="eyebrow">Progress</p><div class="dot-grid" id="dotGrid"></div><p class="notice" id="resultMessage">Answer every scored question before submitting.</p><div class="side-actions"><button class="btn primary" id="submitButton" type="button">Submit & Review</button><button class="btn" id="saveDraft" type="button">Save Draft</button><button class="btn" id="resetButton" type="button">Reset</button><button class="btn" id="exportButton" type="button">Export Result</button></div></aside></div></section><section id="results" hidden><div class="wrap"><article class="card assessment-main"><p class="eyebrow">Result</p><div class="result-score" id="resultScore"></div><h2 id="resultTitle"></h2><p class="notice" id="resultSummary"></p><div class="grid domain-grid" id="domainGrid"></div></article></div></section></main><footer class="footer"><div class="wrap footer-inner"><span>Pre-Algebra Unit 10</span><span>Results stay in this browser</span></div></footer><script>window.ASSESSMENT_CONFIG={"title":"Unit 10 Mastery Check","subtitle":"A cumulative check across all eight lessons. Results remain in this browser.","storage_key":"khaemenes-prealgebra-u10-mastery-v1","pathway":"Cumulative Assessment","threshold":80,"show_hints":false,"questions":[{"id":"U10-M01","domain":"Coordinates","prompt":"Point (−6,−2) lies in:","options":["I","III","II","IV"],"answer":1,"explanation":"Both coordinates are negative.","lesson":"l01","skill":"coordinates","dimension":"procedural-fluency"},{"id":"U10-M02","domain":"Axis","prompt":"Point (0,7) lies on:","options":["x-axis","origin","Quadrant I","y-axis"],"answer":3,"explanation":"x=0 defines the y-axis.","lesson":"l01","skill":"axis","dimension":"representation-interpretation"},{"id":"U10-M03","domain":"Pattern","prompt":"Next term in 3,8,13,18,…:","options":["23","21","22","25"],"answer":0,"explanation":"Add 5.","lesson":"l01","skill":"pattern","dimension":"procedural-fluency"},{"id":"U10-M04","domain":"Explicit rule","prompt":"Sequence 2,6,10,14,… has rule:","options":["2n+4","4n+2","4n−2","6n−4"],"answer":2,"explanation":"At n=1, 4−2=2.","lesson":"l02","skill":"explicit-rule","dimension":"procedural-fluency"},{"id":"U10-M05","domain":"Function","prompt":"Which relation is not a function?","options":["{(1,3),(2,4)}","{(1,3),(2,3)}","{(1,3),(1,4)}","{(−1,1),(0,0)}"],"answer":2,"explanation":"Input 1 has two outputs.","lesson":"l02","skill":"function","dimension":"representation-interpretation"},{"id":"U10-M06","domain":"Domain","prompt":"Domain of {(−3,2),(0,5),(8,2)}:","options":["{−3,0,8}","{2,5}","{−3,0,2,5,8}","all reals"],"answer":0,"explanation":"Domain is the set of inputs.","lesson":"l02","skill":"domain","dimension":"representation-interpretation"},{"id":"U10-M07","domain":"Evaluation","prompt":"If f(x)=4x−3, f(5)=:","options":["20","23","25","17"],"answer":3,"explanation":"20−3=17.","lesson":"l03","skill":"evaluation","dimension":"procedural-fluency"},{"id":"U10-M08","domain":"Representation","prompt":"For y=2x+5, y when x=4:","options":["8","13","9","18"],"answer":1,"explanation":"2(4)+5=13.","lesson":"l03","skill":"representation","dimension":"procedural-fluency"},{"id":"U10-M09","domain":"Words","prompt":"“$30 fixed plus $7 per item n” is:","options":["C=7n+30","C=30n+7","C=37n","C=30−7n"],"answer":0,"explanation":"Rate times items plus fixed amount.","lesson":"l03","skill":"words","dimension":"procedural-fluency"},{"id":"U10-M10","domain":"Rate table","prompt":"Table (0,1),(2,7),(4,13) has rate:","options":["2","6","3","7"],"answer":2,"explanation":"Rise 6 over run 2 equals 3.","lesson":"l04","skill":"rate-table","dimension":"representation-interpretation"},{"id":"U10-M11","domain":"Rate points","prompt":"Rate from (−1,4) to (5,−8):","options":["−1/2","−2","2","12"],"answer":1,"explanation":"Rise −12 over run 6 equals −2.","lesson":"l04","skill":"rate-points","dimension":"multi-step-application"},{"id":"U10-M12","domain":"Slope","prompt":"Slope through (2,3) and (6,11):","options":["1","4","8","2"],"answer":3,"explanation":"8/4=2.","lesson":"l04","skill":"slope","dimension":"procedural-fluency"},{"id":"U10-M13","domain":"Intercept","prompt":"In y=−5x+9, y-intercept:","options":["−5","0","5","9"],"answer":3,"explanation":"b=9.","lesson":"l05","skill":"intercept","dimension":"representation-interpretation"},{"id":"U10-M14","domain":"Equation","prompt":"Slope 4, y-intercept −2:","options":["y=−2x+4","y=4x−2","y=2x−4","y=4x+2"],"answer":1,"explanation":"Use y=mx+b.","lesson":"l05","skill":"equation","dimension":"representation-interpretation"},{"id":"U10-M15","domain":"Vertical slope","prompt":"Line x=−3 has slope:","options":["−3","0","undefined","3"],"answer":2,"explanation":"Vertical run is zero.","lesson":"l05","skill":"vertical-slope","dimension":"procedural-fluency"},{"id":"U10-M16","domain":"Linear table","prompt":"Which outputs are linear for x=0,1,2,3?","options":["5,2,−1,−4","1,2,4,8","0,1,4,9","2,3,5,8"],"answer":0,"explanation":"Differences are −3 each time.","lesson":"l06","skill":"linear-table","dimension":"representation-interpretation"},{"id":"U10-M17","domain":"Nonlinear","prompt":"Which equation is nonlinear?","options":["y=7x−1","y=x²+1","y=−4","y=(1/2)x"],"answer":1,"explanation":"The squared term creates changing rate.","lesson":"l06","skill":"nonlinear","dimension":"procedural-fluency"},{"id":"U10-M18","domain":"Function notation","prompt":"If g(x)=x²−1, g(3)=:","options":["8","5","9","10"],"answer":0,"explanation":"9−1=8.","lesson":"l06","skill":"function-notation","dimension":"procedural-fluency"},{"id":"U10-M19","domain":"Proportional","prompt":"Which is direct variation?","options":["y=6x+2","y=x²","y=6","y=6x"],"answer":3,"explanation":"Direct variation has form y=kx.","lesson":"l07","skill":"proportional","dimension":"procedural-fluency"},{"id":"U10-M20","domain":"Model meaning","prompt":"In V=80−4t, 80 represents:","options":["decrease per unit","residual","initial value","x-intercept always"],"answer":2,"explanation":"At t=0, V=80.","lesson":"l07","skill":"model-meaning","dimension":"transfer-reasoning"},{"id":"U10-M21","domain":"Interpolation","prompt":"Data cover years 2010–2020. Estimate for 2017:","options":["extrapolation","residual","interpolation","undefined slope"],"answer":2,"explanation":"2017 is inside the observed interval.","lesson":"l07","skill":"interpolation","dimension":"procedural-fluency"},{"id":"U10-M22","domain":"Extrapolation","prompt":"Estimate for 2035 from data ending 2020:","options":["interpolation","observed value","domain restriction already tested","extrapolation"],"answer":3,"explanation":"2035 lies outside the data range.","lesson":"l08","skill":"extrapolation","dimension":"procedural-fluency"},{"id":"U10-M23","domain":"Residual","prompt":"Observed 74, predicted 79. Residual:","options":["−5","0","5","153"],"answer":0,"explanation":"74−79=−5.","lesson":"l08","skill":"residual","dimension":"procedural-fluency"},{"id":"U10-M24","domain":"Decision quality","prompt":"A trustworthy model report includes:","options":["only a predicted number","representations, units, domain, data source, error, assumptions, and limitations","only a slope","no discussion of fit"],"answer":1,"explanation":"Complete context and uncertainty make the claim defensible.","lesson":"l08","skill":"decision-quality","dimension":"transfer-reasoning"},{"id":"U10-M25","domain":"Linear modelling","prompt":"A taxi fare is $4.50 plus $2.25 per mile. Which equation models cost C for m miles, and what does the slope mean?","options":["C=4.5m+2.25; initial fee","C=2.25m+4.5; $2.25 per mile","C=2.25+4.5m; $4.50 per mile","C=6.75m; total fixed cost"],"answer":1,"explanation":"The variable rate is $2.25 per mile and the fixed fee is $4.50.","lesson":"l08","skill":"linear-model-interpretation","dimension":"transfer-reasoning"}],"reasoning_prompts":["Which representation, function, rate, or slope strategy helped you most?","Where did you check coordinates, units, domain, fit, or model limitations?"],"assessment_note":"25-question cumulative mastery check; exactly 20 correct is required to meet the 80% mastery standard.","assessment_version":"3.0","blueprint_version":"prealgebra-unit-mastery-v3","question_count":25,"pass_count":20};</script><script src="../assets/assessment-engine.js"></script>
