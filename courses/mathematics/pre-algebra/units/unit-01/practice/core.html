60", "90", "270"], "answer": 2, "explanation": "LCM=2×3²×5=90."}, {"domain": "Application", "prompt": "Signals repeat every 12 and 18 seconds. When next aligned?", "options": ["6 seconds", "30 seconds", "36 seconds", "216 seconds"], "answer": 2, "explanation": "LCM(12,18)=36."}, {"domain": "Order", "prompt": "Evaluate 5+24÷6×2.", "options": ["13", "18", "48", "58"], "answer": 0, "explanation": "24÷6=4, 4×2=8, then 5+8=13."}, {"domain": "Order", "prompt": "Evaluate 2[9−(3²−4)].", "options": ["8", "10", "16", "20"], "answer": 0, "explanation": "3²−4=5; 9−5=4; 2×4=8."}, {"domain": "Structure", "prompt": "Which expression equals 24?", "options": ["3+5×3", "(3+5)×3", "3×5+3", "3²+5"], "answer": 1, "explanation": "(3+5)×3=24."}, {"domain": "Estimation", "prompt": "Best estimate of 798÷41?", "options": ["2", "20", "200", "2,000"], "answer": 1, "explanation": "800÷40=20."}, {"domain": "Reasonableness", "prompt": "A calculator shows 62×48=297.6. Best response?", "options": ["Accept it because calculators are exact.", "Reject it because 60×50 is about 3,000.", "Reject it because products cannot contain decimals.", "Accept it because 297.6 is near 300."], "answer": 1, "explanation": "The product should be near 3,000."}, {"domain": "Precision", "prompt": "Which task normally needs greatest precision?", "options": ["Estimating festival attendance", "Paying a utility bill", "Judging whether a trip is near 100 or 1,000 km", "Estimating books on a shelf"], "answer": 1, "explanation": "Payments normally require exact currency values."}], "reasoning_prompts": ["Which strategy saved the most time?", "Which answer did you verify with an estimate?"]};</script><script src="../assets/assessment-engine.js"></script></body></html>
