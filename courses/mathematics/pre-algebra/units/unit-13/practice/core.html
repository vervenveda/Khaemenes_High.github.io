t-main"><p class="eyebrow">Result</p><div class="result-score" id="resultScore"></div><h2 id="resultTitle"></h2><p class="notice" id="resultSummary"></p><div class="grid domain-grid" id="domainGrid"></div></article></div></section></main><footer class="footer"><div class="wrap footer-inner"><span>Pre-Algebra Unit 13</span><span>Results stay in this browser</span></div></footer><script>window.ASSESSMENT_CONFIG={"title":"Core Practice","subtitle":"Complete practice across the full mathematical modelling cycle.","storage_key":"khaemenes-prealgebra-u13-core-v1","pathway":"Core Pathway","threshold":75,"show_hints":false,"questions":[{"domain":"Scope","prompt":"Best one-week scope:","options":["solve every community problem","predict forever","collect all private data","compare three fictional options using two criteria and one constraint"],"answer":3,"explanation":"The first is bounded and measurable."},{"domain":"Data minimization","prompt":"Collect:","options":["exact addresses by default","passwords","only variables needed for the question","all personal details"],"answer":2,"explanation":"Minimization protects privacy."},{"domain":"Model plan","prompt":"Before calculating, document:","options":["a decorative border","variables, units, sources, assumptions, and representations","only the final number","no constraints"],"answer":1,"explanation":"A plan makes the method coherent."},{"domain":"Inequality","prompt":"Capacity at least 80 means:","options":["c≥80","c≤80","c<0","c=8"],"answer":0,"explanation":"At least means greater than or equal to."},{"domain":"Rate model","prompt":"Distance at constant speed is:","options":["d=r+t","d=r/t always","d=0","d=rt"],"answer":3,"explanation":"Distance equals rate times time."},{"domain":"Percent check","prompt":"After a 20% increase, reverse-check by:","options":["multiplying by 0","ignoring original","dividing new value by 1.20","adding 20 again"],"answer":2,"explanation":"The multiplier reverses the change."},{"domain":"Scale"
