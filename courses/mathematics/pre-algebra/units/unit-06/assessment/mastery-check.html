</head><body data-high-assessment-shell="true"><a class="skip" href="#main">Skip to main content</a><main id="main"><section class="hero"><div class="wrap"><p class="eyebrow">Cumulative Assessment · 25 Questions</p><h1>Unit 6 Mastery Check</h1><p class="lead">A cumulative check across all seven lessons. Results remain in this browser.</p><div class="actions"><a class="btn" href="../#lessons">Review Lessons</a><button class="btn" id="printPage" type="button">Print</button></div></div></section><section><div class="wrap assessment-layout"><article class="card assessment-main"><form class="question-list" id="questionList"></form><div class="reasoning" id="reasoningSection"></div></article><aside class="card assessment-side"><p class="eyebrow">Progress</p><div class="dot-grid" id="dotGrid"></div><p class="notice" id="resultMessage">Answer every scored question before submitting.</p><div class="side-actions"><button class="btn primary" id="submitButton" type="button">Submit & Review</button><button class="btn" id="saveDraft" type="button">Save Draft</button><button class="btn" id="resetButton" type="button">Reset</button><button class="btn" id="exportButton" type="button">Export Result</button></div></aside></div></section><section id="results" hidden><div class="wrap"><article class="card assessment-main"><p class="eyebrow">Result</p><div class="result-score" id="resultScore"></div><h2 id="resultTitle"></h2><p class="notice" id="resultSummary"></p><div class="grid domain-grid" id="domainGrid"></div></article></div></section></main><footer class="footer"><div class="wrap footer-inner"><span>Pre-Algebra Unit 6</span><span>Results stay in this browser</span></div></footer><script>window.ASSESSMENT_CONFIG={"title":"Unit 6 Mastery Check","subtitle":"A cumulative check across all seven lessons. Results remain in this browser.","storage_key":"khaemenes-prealgebra-u06-mastery-v1","pathway":"Cumulative Assessment","threshold":80,"show_hints":false,"questions":[{"id":"U06-M01","domain":"Meaning","prompt":"Which expanded form equals (-4)^3?","options":["(-4)+(-4)+(-4)","-(4×4×4)","-4×3","4×4×4"],"answer":1,"explanation":"The grouped base -4 is used as a factor three times.","lesson":"l01","skill":"meaning","dimension":"representation-interpretation"},{"id":"U06-M02","domain":"Grouping","prompt":"Evaluate -5^2.","options":["-10","10","25","-25"],"answer":3,"explanation":"Exponentiation occurs before the leading negative.","lesson":"l01","skill":"grouping","dimension":"procedural-fluency"},{"id":"U06-M03","domain":"Zero exponent","prompt":"For t≠0, (3t)^0 equals:","options":["1","0","3","t"],"answer":0,"explanation":"Every nonzero base to the zero power equals 1.","lesson":"l01","skill":"zero-exponent","dimension":"procedural-fluency"},{"id":"U06-M04","domain":"Negative exponent","prompt":"10^-5 equals:","options":["-100000","0.0001","0.00001","100000"],"answer":2,"explanation":"Move the decimal five places left.","lesson":"l01","skill":"negative-exponent","dimension":"procedural-fluency"},{"id":"U06-M05","domain":"Product property","prompt":"c^8×c^-5 simplifies to:","options":["c^13","1/c^3","c^3","-c^3"],"answer":2,"explanation":"8+(-5)=3.","lesson":"l02","skill":"product-property","dimension":"procedural-fluency"},{"id":"U06-M06","domain":"Quotient property","prompt":"d^-2÷d^4 with positive exponents is:","options":["1/d^6","d^2","1/d^2","d^6"],"answer":0,"explanation":"d^(-2-4)=d^-6=1/d^6.","lesson":"l02","skill":"quotient-property","dimension":"procedural-fluency"},{"id":"U06-M07","domain":"Power of power","prompt":"(x^4)^3 equals:","options":["x^7","3x^4","x^64","x^12"],"answer":3,"explanation":"Multiply exponents.","lesson":"l02","skill":"power-of-power","dimension":"procedural-fluency"},{"id":"U06-M08","domain":"Power product","prompt":"(3a^2b)^2 equals:","options":["6a^4b^2","9a^4b^2","9a^2b^2","3a^4b"],"answer":1,"explanation":"Square every factor.","lesson":"l03","skill":"power-product","dimension":"procedural-fluency"},{"id":"U06-M09","domain":"Square root","prompt":"√576 equals:","options":["24","22","26","288"],"answer":0,"explanation":"24^2=576.","lesson":"l03","skill":"square-root","dimension":"procedural-fluency"},{"id":"U06-M10","domain":"Cube root","prompt":"∛1000 equals:","options":["100","250","10","333.3"],"answer":2,"explanation":"10^3=1000.","lesson":"l03","skill":"cube-root","dimension":"procedural-fluency"},{"id":"U06-M11","domain":"Negative cube root","prompt":"∛(-729) equals:","options":["-3","-9","3","9"],"answer":1,"explanation":"(-9)^3=-729.","lesson":"l03","skill":"negative-cube-root","dimension":"procedural-fluency"},{"id":"U06-M12","domain":"Bounds","prompt":"√130 lies between:","options":["10 and 11","12 and 13","64 and 65","11 and 12"],"answer":3,"explanation":"121<130<144.","lesson":"l04","skill":"bounds","dimension":"procedural-fluency"},{"id":"U06-M13","domain":"Approximation","prompt":"√45 to the nearest tenth is:","options":["6.5","7.1","22.5","6.7"],"answer":3,"explanation":"√45≈6.708.","lesson":"l04","skill":"approximation","dimension":"procedural-fluency"},{"id":"U06-M14","domain":"Irrational","prompt":"Which is irrational?","options":["√196","√7","0.333...","-11/4"],"answer":1,"explanation":"√7 is not rational.","lesson":"l04","skill":"irrational","dimension":"procedural-fluency"},{"id":"U06-M15","domain":"Scientific notation","prompt":"Write 903,000,000 in scientific notation.","options":["9.03×10^7","90.3×10^7","9.03×10^8","0.903×10^9"],"answer":2,"explanation":"Move the decimal eight places left.","lesson":"l05","skill":"scientific-notation","dimension":"procedural-fluency"},{"id":"U06-M16","domain":"Scientific notation","prompt":"Write 0.000000052 in scientific notation.","options":["5.2×10^-8","5.2×10^-7","52×10^-9","0.52×10^-7"],"answer":0,"explanation":"Move the decimal eight places right.","lesson":"l05","skill":"scientific-notation","dimension":"procedural-fluency"},{"id":"U06-M17","domain":"Standard form","prompt":"7.15×10^-4 equals:","options":["0.0000715","0.000715","0.00715","7150"],"answer":1,"explanation":"Move the decimal four places left.","lesson":"l05","skill":"standard-form","dimension":"procedural-fluency"},{"id":"U06-M18","domain":"Comparison","prompt":"Which is smallest?","options":["7.1×10^-7","4.2×10^-6","9.9×10^-6","1.3×10^-5"],"answer":0,"explanation":"10^-7 represents a smaller positive scale than 10^-6 or 10^-5.","lesson":"l05","skill":"comparison","dimension":"procedural-fluency"},{"id":"U06-M19","domain":"Multiplication","prompt":"(4×10^7)(3×10^-5) equals:","options":["1.2×10^2","12×10^12","7×10^2","1.2×10^3"],"answer":3,"explanation":"12×10^2=1.2×10^3.","lesson":"l06","skill":"multiplication","dimension":"multi-step-application"},{"id":"U06-M20","domain":"Division","prompt":"(9×10^-2)÷(3×10^4) equals:","options":["3×10^2","6×10^-6","3×10^-6","3×10^-2"],"answer":2,"explanation":"9÷3=3 and -2-4=-6.","lesson":"l06","skill":"division","dimension":"procedural-fluency"},{"id":"U06-M21","domain":"Addition","prompt":"7.4×10^5+9×10^4 equals:","options":["1.64×10^10","7.49×10^5","8.3×10^5","16.4×10^4"],"answer":2,"explanation":"9×10^4=0.9×10^5; sum 8.3×10^5.","lesson":"l06","skill":"addition","dimension":"procedural-fluency"},{"id":"U06-M22","domain":"Subtraction","prompt":"5.2×10^-3-8×10^-4 equals:","options":["4.4×10^-4","5.12×10^-3","-2.8×10^-3","4.4×10^-3"],"answer":3,"explanation":"8×10^-4=0.8×10^-3; difference 4.4×10^-3.","lesson":"l07","skill":"subtraction","dimension":"procedural-fluency"},{"id":"U06-M23","domain":"Scale","prompt":"A bacterium is 2.5×10^-6 m long. 4×10^5 bacteria end to end span:","options":["1 m","0.1 m","10 m","1×10^-11 m"],"answer":0,"explanation":"2.5×4×10^(-6+5)=10×10^-1=1 m.","lesson":"l07","skill":"scale","dimension":"multi-step-application"},{"id":"U06-M24","domain":"Precision","prompt":"Why is scientific notation useful?","options":["It makes every value exact","It communicates scale, supports operations, and can show significant digits","It removes units","It changes irrational numbers into rational numbers"],"answer":1,"explanation":"Scientific notation communicates magnitude and precision while preserving the value.","lesson":"l07","skill":"precision","dimension":"transfer-reasoning"},{"id":"U06-M25","domain":"Scientific notation","prompt":"Compute (3×10⁵)(4×10⁻³) and write the result in scientific notation.","options":["1.2×10³","12×10²","1.2×10⁸","7×10²"],"answer":0,"explanation":"3×4=12 and 10⁵×10⁻³=10², so 12×10²=1.2×10³.","lesson":"l07","skill":"scientific-notation-product","dimension":"procedural-fluency"}],"reasoning_prompts":["Which exponent, root, or notation strategy helped you most?","Where did you check grouping, magnitude, units, or precision?"],"assessment_note":"25-question cumulative mastery check; exactly 20 correct is required to meet the 80% mastery standard.","assessment_version":"3.0","blueprint_version":"prealgebra-unit-mastery-v3","question_count":25,"pass_count":20};</script><script src="../assets/assessment-engine.js"></script>
