</head><body data-high-assessment-shell="true"><a class="skip" href="#main">Skip to main content</a><main id="main"><section class="hero"><div class="wrap"><p class="eyebrow">Cumulative Assessment · 25 Questions</p><h1>Unit 12 Mastery Check</h1><p class="lead">A cumulative check across all eight lessons. Results remain in this browser.</p><div class="actions"><a class="btn" href="../#lessons">Review Lessons</a><button class="btn" id="printPage" type="button">Print</button></div></div></section><section><div class="wrap assessment-layout"><article class="card assessment-main"><form class="question-list" id="questionList"></form><div class="reasoning" id="reasoningSection"></div></article><aside class="card assessment-side"><p class="eyebrow">Progress</p><div class="dot-grid" id="dotGrid"></div><p class="notice" id="resultMessage">Answer every scored question before submitting.</p><div class="side-actions"><button class="btn primary" id="submitButton" type="button">Submit & Review</button><button class="btn" id="saveDraft" type="button">Save Draft</button><button class="btn" id="resetButton" type="button">Reset</button><button class="btn" id="exportButton" type="button">Export Result</button></div></aside></div></section><section id="results" hidden><div class="wrap"><article class="card assessment-main"><p class="eyebrow">Result</p><div class="result-score" id="resultScore"></div><h2 id="resultTitle"></h2><p class="notice" id="resultSummary"></p><div class="grid domain-grid" id="domainGrid"></div></article></div></section></main><footer class="footer"><div class="wrap footer-inner"><span>Pre-Algebra Unit 12</span><span>Results stay in this browser</span></div></footer><script>window.ASSESSMENT_CONFIG={"title":"Unit 12 Mastery Check","subtitle":"A cumulative check across all eight lessons. Results remain in this browser.","storage_key":"khaemenes-prealgebra-u12-mastery-v1","pathway":"Cumulative Assessment","threshold":80,"show_hints":false,"questions":[{"id":"U12-M01","domain":"Question type","prompt":"Which asks for a distribution?","options":["What is 12÷3?","Is 9 odd?","What is today’s date?","How many hours do students study each week?"],"answer":3,"explanation":"Study hours vary across students.","lesson":"l01","skill":"question-type","dimension":"procedural-fluency"},{"id":"U12-M02","domain":"Variable type","prompt":"Number of siblings is:","options":["numerical discrete","categorical only","a sample","a graph"],"answer":0,"explanation":"It is a count.","lesson":"l01","skill":"variable-type","dimension":"procedural-fluency"},{"id":"U12-M03","domain":"Sampling","prompt":"Best representative city sample:","options":["people at one gym","randomly selected residents from address lists across neighborhoods","online volunteers only","one apartment building"],"answer":1,"explanation":"Coverage across neighborhoods and random selection improve representation.","lesson":"l01","skill":"sampling","dimension":"procedural-fluency"},{"id":"U12-M04","domain":"Relative frequency","prompt":"27 of 45:","options":["40%","50%","60%","72%"],"answer":2,"explanation":"27/45=0.60.","lesson":"l02","skill":"relative-frequency","dimension":"procedural-fluency"},{"id":"U12-M05","domain":"Display","prompt":"Best for a five-number summary:","options":["pie chart","map","single bar","box plot"],"answer":3,"explanation":"Box plots encode minimum, quartiles, median, maximum.","lesson":"l02","skill":"display","dimension":"procedural-fluency"},{"id":"U12-M06","domain":"Mean","prompt":"Mean of 6,8,8,10,13:","options":["9","8","10","45"],"answer":0,"explanation":"45/5=9.","lesson":"l02","skill":"mean","dimension":"procedural-fluency"},{"id":"U12-M07","domain":"Median","prompt":"Median of 1,4,7,9,12,20:","options":["7","8","9","10"],"answer":1,"explanation":"Average 7 and 9 gives 8.","lesson":"l03","skill":"median","dimension":"procedural-fluency"},{"id":"U12-M08","domain":"Mode","prompt":"Mode of 3,4,4,5,6,6,6:","options":["3","4","6","5"],"answer":2,"explanation":"Six appears most.","lesson":"l03","skill":"mode","dimension":"procedural-fluency"},{"id":"U12-M09","domain":"Range","prompt":"Range of 14,18,21,29:","options":["14","11","43","15"],"answer":3,"explanation":"29−14=15.","lesson":"l03","skill":"range","dimension":"representation-interpretation"},{"id":"U12-M10","domain":"IQR","prompt":"Q1=7,Q3=19:","options":["12","26","7","19"],"answer":0,"explanation":"19−7=12.","lesson":"l04","skill":"iqr","dimension":"procedural-fluency"},{"id":"U12-M11","domain":"MAD interpretation","prompt":"Smaller MAD indicates:","options":["larger maximum necessarily","values are generally closer to the mean","more categories","causation"],"answer":1,"explanation":"MAD measures average distance from mean.","lesson":"l04","skill":"mad-interpretation","dimension":"procedural-fluency"},{"id":"U12-M12","domain":"Outlier effect","prompt":"A high outlier usually affects which more?","options":["median more than mean","both always equally","mean more than median","neither"],"answer":2,"explanation":"Mean is less resistant.","lesson":"l04","skill":"outlier-effect","dimension":"procedural-fluency"},{"id":"U12-M13","domain":"Misleading graph","prompt":"Starting a y-axis at 99 may:","options":["prove the data false","remove the denominator automatically","create random sampling","exaggerate small changes"],"answer":3,"explanation":"A narrow axis can magnify differences.","lesson":"l05","skill":"misleading-graph","dimension":"error-analysis"},{"id":"U12-M14","domain":"Association","prompt":"A scatterplot association:","options":["may be explained by confounding","alone proves cause","means every point lies on a line","has probability 1"],"answer":0,"explanation":"Other variables or designs may explain the pattern.","lesson":"l05","skill":"association","dimension":"procedural-fluency"},{"id":"U12-M15","domain":"Simple probability","prompt":"P(drawing a heart from a standard 52-card deck):","options":["1/2","1/4","1/13","13"],"answer":1,"explanation":"13 hearts out of 52.","lesson":"l05","skill":"simple-probability","dimension":"procedural-fluency"},{"id":"U12-M16","domain":"Complement","prompt":"If P(rain)=0.28, P(no rain):","options":["0.28","0.62","0.72","1.28"],"answer":2,"explanation":"1−0.28=0.72.","lesson":"l06","skill":"complement","dimension":"procedural-fluency"},{"id":"U12-M17","domain":"Experimental probability","prompt":"42 successes in 70 trials:","options":["0.4","0.7","0.8","0.6"],"answer":3,"explanation":"42/70=0.60.","lesson":"l06","skill":"experimental-probability","dimension":"procedural-fluency"},{"id":"U12-M18","domain":"Two dice sample space","prompt":"Ordered outcomes for two six-sided dice:","options":["36","12","18","24"],"answer":0,"explanation":"6·6=36.","lesson":"l06","skill":"two-dice-sample-space","dimension":"representation-interpretation"},{"id":"U12-M19","domain":"Independent","prompt":"P(A)=0.2,P(B)=0.3 independent. P(both):","options":["0.05","0.06","0.5","0.6"],"answer":1,"explanation":"0.2·0.3=0.06.","lesson":"l07","skill":"independent","dimension":"procedural-fluency"},{"id":"U12-M20","domain":"Without replacement","prompt":"Two draws without replacement are generally:","options":["independent","equally likely regardless of first","dependent","impossible"],"answer":2,"explanation":"First draw changes remaining composition.","lesson":"l07","skill":"without-replacement","dimension":"procedural-fluency"},{"id":"U12-M21","domain":"Bias","prompt":"Surveying only customers who complain risks:","options":["random assignment","perfect coverage","zero variability","selection bias"],"answer":3,"explanation":"The group is not representative of all customers.","lesson":"l07","skill":"bias","dimension":"procedural-fluency"},{"id":"U12-M22","domain":"Random selection","prompt":"Random selection primarily supports:","options":["generalization to the population","causal proof by itself","elimination of all nonresponse","equal means"],"answer":0,"explanation":"Representative selection supports inference.","lesson":"l08","skill":"random-selection","dimension":"procedural-fluency"},{"id":"U12-M23","domain":"Random assignment","prompt":"Random assignment in an experiment primarily supports:","options":["population coverage by itself","causal comparison","a larger denominator","a box plot"],"answer":1,"explanation":"It balances treatment groups on average.","lesson":"l08","skill":"random-assignment","dimension":"procedural-fluency"},{"id":"U12-M24","domain":"Decision quality","prompt":"A defensible data decision states:","options":["only the preferred result","no sample size","source, sample, method, summaries, uncertainty, bias, assumptions, and limits","certainty from association"],"answer":2,"explanation":"Transparent evidence and limits are essential.","lesson":"l08","skill":"decision-quality","dimension":"transfer-reasoning"},{"id":"U12-M25","domain":"Statistical reasoning","prompt":"A data set has mean 18 and one very large outlier. Which statement is most defensible?","options":["The median may better represent a typical value","The mean can never change","The range becomes smaller","The outlier proves the sample is biased"],"answer":0,"explanation":"A large outlier can pull the mean, while the median is more resistant.","lesson":"l08","skill":"outlier-center-choice","dimension":"transfer-reasoning"}],"reasoning_prompts":["Which data, probability, or sampling strategy helped you most?","Where did you check variation, denominators, bias, uncertainty, or causal language?"],"assessment_note":"25-question cumulative mastery check; exactly 20 correct is required to meet the 80% mastery standard.","assessment_version":"3.0","blueprint_version":"prealgebra-unit-mastery-v3","question_count":25,"pass_count":20};</script><script src="../assets/assessment-engine.js"></script>
