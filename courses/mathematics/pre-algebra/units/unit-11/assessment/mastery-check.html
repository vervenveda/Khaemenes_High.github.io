</head><body data-high-assessment-shell="true"><a class="skip" href="#main">Skip to main content</a><main id="main"><section class="hero"><div class="wrap"><p class="eyebrow">Cumulative Assessment · 25 Questions</p><h1>Unit 11 Mastery Check</h1><p class="lead">A cumulative check across all eight lessons. Results remain in this browser.</p><div class="actions"><a class="btn" href="../#lessons">Review Lessons</a><button class="btn" id="printPage" type="button">Print</button></div></div></section><section><div class="wrap assessment-layout"><article class="card assessment-main"><form class="question-list" id="questionList"></form><div class="reasoning" id="reasoningSection"></div></article><aside class="card assessment-side"><p class="eyebrow">Progress</p><div class="dot-grid" id="dotGrid"></div><p class="notice" id="resultMessage">Answer every scored question before submitting.</p><div class="side-actions"><button class="btn primary" id="submitButton" type="button">Submit & Review</button><button class="btn" id="saveDraft" type="button">Save Draft</button><button class="btn" id="resetButton" type="button">Reset</button><button class="btn" id="exportButton" type="button">Export Result</button></div></aside></div></section><section id="results" hidden><div class="wrap"><article class="card assessment-main"><p class="eyebrow">Result</p><div class="result-score" id="resultScore"></div><h2 id="resultTitle"></h2><p class="notice" id="resultSummary"></p><div class="grid domain-grid" id="domainGrid"></div></article></div></section></main><footer class="footer"><div class="wrap footer-inner"><span>Pre-Algebra Unit 11</span><span>Results stay in this browser</span></div></footer><script>window.ASSESSMENT_CONFIG={"title":"Unit 11 Mastery Check","subtitle":"A cumulative check across all eight lessons. Results remain in this browser.","storage_key":"khaemenes-prealgebra-u11-mastery-v1","pathway":"Cumulative Assessment","threshold":80,"show_hints":false,"questions":[{"id":"U11-M01","domain":"Units","prompt":"Which unit is appropriate for room area?","options":["m","m³","degrees","m²"],"answer":3,"explanation":"Area uses square units.","lesson":"l01","skill":"units","dimension":"multi-step-application"},{"id":"U11-M02","domain":"Conversion","prompt":"3.2 L equals:","options":["3,200 mL","32 mL","320 mL","32,000 mL"],"answer":0,"explanation":"Multiply litres by 1,000.","lesson":"l01","skill":"conversion","dimension":"procedural-fluency"},{"id":"U11-M03","domain":"Precision","prompt":"A reading of 7.36 cm is recorded to the nearest:","options":["centimetre","hundredth of a centimetre","tenth of a centimetre","metre"],"answer":1,"explanation":"Two decimal places indicate hundredths.","lesson":"l01","skill":"precision","dimension":"procedural-fluency"},{"id":"U11-M04","domain":"Complement","prompt":"Complement of 64°:","options":["16°","116°","26°","296°"],"answer":2,"explanation":"90−64=26.","lesson":"l02","skill":"complement","dimension":"procedural-fluency"},{"id":"U11-M05","domain":"Vertical angles","prompt":"Vertical angles 2x+11 and 5x−25 give x=","options":["7","18","36","12"],"answer":3,"explanation":"2x+11=5x−25; 36=3x; x=12.","lesson":"l02","skill":"vertical-angles","dimension":"procedural-fluency"},{"id":"U11-M06","domain":"Polygon sum","prompt":"Interior-angle sum of a decagon:","options":["1,440°","1,080°","1,260°","1,800°"],"answer":0,"explanation":"(10−2)·180=1,440.","lesson":"l02","skill":"polygon-sum","dimension":"procedural-fluency"},{"id":"U11-M07","domain":"Perimeter","prompt":"Regular pentagon side 8 cm. Perimeter:","options":["13 cm","40 cm","32 cm","64 cm"],"answer":1,"explanation":"5·8=40.","lesson":"l03","skill":"perimeter","dimension":"procedural-fluency"},{"id":"U11-M08","domain":"Circumference","prompt":"Circle radius 6. Exact circumference:","options":["6π","36π","12π","72π"],"answer":2,"explanation":"C=2πr=12π.","lesson":"l03","skill":"circumference","dimension":"procedural-fluency"},{"id":"U11-M09","domain":"Triangle area","prompt":"b=15,h=8. Area:","options":["46","120","240","60"],"answer":3,"explanation":"15·8/2=60.","lesson":"l03","skill":"triangle-area","dimension":"multi-step-application"},{"id":"U11-M10","domain":"Trapezoid area","prompt":"Bases 9 and 17, height 6. Area:","options":["78","52","104","156"],"answer":0,"explanation":"(9+17)·6/2=78.","lesson":"l04","skill":"trapezoid-area","dimension":"multi-step-application"},{"id":"U11-M11","domain":"Circle area","prompt":"Diameter 18. Exact area:","options":["18π","81π","36π","324π"],"answer":1,"explanation":"Radius 9, area 81π.","lesson":"l04","skill":"circle-area","dimension":"multi-step-application"},{"id":"U11-M12","domain":"Composite area","prompt":"12×9 rectangle minus 4×3 cutout:","options":["84","104","96","120"],"answer":2,"explanation":"108−12=96.","lesson":"l04","skill":"composite-area","dimension":"multi-step-application"},{"id":"U11-M13","domain":"Scale","prompt":"At 1:40, 7.5 cm represents:","options":["47.5 cm","400 cm","3,000 cm","300 cm"],"answer":3,"explanation":"7.5·40=300.","lesson":"l05","skill":"scale","dimension":"representation-interpretation"},{"id":"U11-M14","domain":"Similarity","prompt":"Corresponding sides 5→12.5. Scale factor:","options":["2.5","0.4","2","7.5"],"answer":0,"explanation":"12.5/5=2.5.","lesson":"l05","skill":"similarity","dimension":"multi-step-application"},{"id":"U11-M15","domain":"Area scale","prompt":"Scale factor 2.5 changes area by:","options":["2.5","6.25","5","15.625"],"answer":1,"explanation":"2.5²=6.25.","lesson":"l05","skill":"area-scale","dimension":"multi-step-application"},{"id":"U11-M16","domain":"Pythagorean","prompt":"Legs 12 and 16. Hypotenuse:","options":["18","24","20","28"],"answer":2,"explanation":"12-16-20 is a scaled 3-4-5 triangle.","lesson":"l06","skill":"pythagorean","dimension":"procedural-fluency"},{"id":"U11-M17","domain":"Missing leg","prompt":"Hypotenuse 17, one leg 8. Other leg:","options":["9","12","25","15"],"answer":3,"explanation":"17²−8²=225, so 15.","lesson":"l06","skill":"missing-leg","dimension":"procedural-fluency"},{"id":"U11-M18","domain":"Distance","prompt":"Distance from (−1,3) to (7,9):","options":["10","8","12","14"],"answer":0,"explanation":"Changes 8 and 6 produce distance 10.","lesson":"l06","skill":"distance","dimension":"procedural-fluency"},{"id":"U11-M19","domain":"Surface area","prompt":"Cube side 5. Surface area:","options":["25","150","75","125"],"answer":1,"explanation":"6·25=150.","lesson":"l07","skill":"surface-area","dimension":"multi-step-application"},{"id":"U11-M20","domain":"Volume","prompt":"Cylinder r=2,h=9. Exact volume:","options":["18π","72π","36π","81π"],"answer":2,"explanation":"π·4·9=36π.","lesson":"l07","skill":"volume","dimension":"multi-step-application"},{"id":"U11-M21","domain":"Midpoint","prompt":"Midpoint of (−4,6) and (8,−2):","options":["(4,4)","(6,2)","(12,4)","(2,2)"],"answer":3,"explanation":"Average x and y.","lesson":"l07","skill":"midpoint","dimension":"procedural-fluency"},{"id":"U11-M22","domain":"Reflection","prompt":"Reflect (−5,2) across x-axis:","options":["(−5,−2)","(5,2)","(5,−2)","(2,−5)"],"answer":0,"explanation":"Keep x; reverse y.","lesson":"l08","skill":"reflection","dimension":"representation-interpretation"},{"id":"U11-M23","domain":"Error","prompt":"Measured 24.6, accepted 25.0. Absolute error:","options":["0.04","0.4","4","49.6"],"answer":1,"explanation":"|24.6−25.0|=0.4.","lesson":"l08","skill":"error","dimension":"error-analysis"},{"id":"U11-M24","domain":"Decision quality","prompt":"A trustworthy geometry model includes:","options":["only a diagram","only exact values","units, scale, formulas, constraints, precision, assumptions, and limitations","no estimate of error"],"answer":2,"explanation":"Transparent modelling communicates methods and limits.","lesson":"l08","skill":"decision-quality","dimension":"transfer-reasoning"},{"id":"U11-M25","domain":"Geometry modelling","prompt":"A rectangular garden is 12 m by 8 m with a 1 m-wide path inside all four edges. What is the area of the remaining planting region?","options":["96 m²","60 m²","70 m²","48 m²"],"answer":1,"explanation":"Inner dimensions are 10 m by 6 m, so the planting area is 60 m².","lesson":"l08","skill":"composite-area-model","dimension":"transfer-reasoning"}],"reasoning_prompts":["Which measurement, angle, scale, or geometric strategy helped you most?","Where did you verify units, precision, constraints, or reasonableness?"],"assessment_note":"25-question cumulative mastery check; exactly 20 correct is required to meet the 80% mastery standard.","assessment_version":"3.0","blueprint_version":"prealgebra-unit-mastery-v3","question_count":25,"pass_count":20};</script><script src="../assets/assessment-engine.js"></script>
