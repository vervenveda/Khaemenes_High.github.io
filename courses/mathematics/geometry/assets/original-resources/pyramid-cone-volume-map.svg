<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="t d"><title id="t">Khaemenes Academy Pyramid and Cone Volume Map</title><desc id="d">Side-by-side pyramid and cone showing base area, height, and the one-third volume relationship.</desc>
<rect width="1600" height="1000" fill="#0b1220"/><rect x="48" y="48" width="1504" height="904" rx="28" fill="#111c2d" stroke="#d7b66a" stroke-width="4"/>
<text x="800" y="110" fill="#f5f1e8" font-size="46" text-anchor="middle" font-family="Georgia,serif">Khaemenes Academy · Geometry</text><text x="800" y="165" fill="#e5ca89" font-size="34" text-anchor="middle" font-family="Georgia,serif">Pyramid &amp; Cone Volume Map</text>
<g transform="translate(160,250)"><polygon points="120,470 520,470 430,300 210,300" fill="#203755" stroke="#8ed0db" stroke-width="7"/><line x1="320" y1="50" x2="120" y2="470" stroke="#8ed0db" stroke-width="7"/><line x1="320" y1="50" x2="520" y2="470" stroke="#8ed0db" stroke-width="7"/><line x1="320" y1="50" x2="430" y2="300" stroke="#8ed0db" stroke-width="7"/><line x1="320" y1="50" x2="210" y2="300" stroke="#8ed0db" stroke-width="7"/><line x1="320" y1="50" x2="320" y2="385" stroke="#e5ca89" stroke-width="5" stroke-dasharray="14 10"/><text x="335" y="225" fill="#e5ca89" font-size="30">h</text><text x="250" y="520" fill="#fff" font-size="30">base area = B</text></g>
<g transform="translate(850,250)"><ellipse cx="320" cy="470" rx="210" ry="70" fill="#203755" stroke="#8ed0db" stroke-width="7"/><line x1="320" y1="50" x2="110" y2="470" stroke="#8ed0db" stroke-width="7"/><line x1="320" y1="50" x2="530" y2="470" stroke="#8ed0db" stroke-width="7"/><line x1="320" y1="50" x2="320" y2="470" stroke="#e5ca89" stroke-width="5" stroke-dasharray="14 10"/><text x="335" y="260" fill="#e5ca89" font-size="30">h</text><text x="240" y="560" fill="#fff" font-size="30">base area = B</text></g>
<text x="800" y="825" text-anchor="middle" fill="#f5f1e8" font-size="42" font-family="Arial,sans-serif">V = ⅓Bh</text><text x="800" y="875" text-anchor="middle" fill="#cbd6e2" font-size="27" font-family="Arial,sans-serif">Same base area and height as a prism/cylinder → one-third the volume</text><text x="800" y="925" text-anchor="middle" fill="#cbd6e2" font-size="24" font-family="Arial,sans-serif">Original Khaemenes Academy reference · printable · scalable SVG · no external dependency</text></svg>