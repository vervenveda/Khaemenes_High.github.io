<g font-family="Arial,sans-serif"><text x="1040" y="330" fill="#f5f1e8" font-size="42">Standard form</text><text x="1040" y="395" fill="#e5ca89" font-size="48">(x − h)² + (y − k)² = r²</text><text x="1040" y="480" fill="#f5f1e8" font-size="30">Center → (h, k)</text><text x="1040" y="530" fill="#f5f1e8" font-size="30">Radius → r</text><text x="1040" y="610" fill="#cbd6e2" font-size="27">Example:</text><text x="1040" y="655" fill="#fff" font-size="31">(x − 2)² + (y + 1)² = 9</text><text x="1040" y="705" fill="#cbd6e2" font-size="27">center (2, −1), radius 3</text></g>
