<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="t d"><title id="t">Khaemenes Academy Sphere Surface Area and Volume Map</title><desc id="d">Sphere showing radius, great circle, surface area formula and volume formula with dimensional interpretation.</desc>
<rect width="1600" height="1000" fill="#0b1220"/><rect x="48" y="48" width="1504" height="904" rx="28" fill="#111c2d" stroke="#d7b66a" stroke-width="4"/>
<text x="800" y="110" fill="#f5f1e8" font-size="46" text-anchor="middle" font-family="Georgia,serif">Khaemenes Academy · Geometry</text><text x="800" y="165" fill="#e5ca89" font-size="34" text-anchor="middle" font-family="Georgia,serif">Sphere · Surface Area &amp; Volume Map</text>
<circle cx="480" cy="525" r="260" fill="#203755" stroke="#8ed0db" stroke-width="8"/><ellipse cx="480" cy="525" rx="260" ry="80" fill="none" stroke="#6aa8b6" stroke-width="5" stroke-dasharray="12 9"/><line x1="480" y1="525" x2="740" y2="525" stroke="#e5ca89" stroke-width="6"/><circle cx="480" cy="525" r="10" fill="#e5ca89"/><text x="610" y="505" fill="#e5ca89" font-size="34" font-family="Arial,sans-serif">r</text>
<g font-family="Arial,sans-serif"><text x="880" y="345" fill="#f5f1e8" font-size="38">Surface area</text><text x="880" y="410" fill="#e5ca89" font-size="52">SA = 4πr²</text><text x="880" y="475" fill="#cbd6e2" font-size="27">square units · outside covering</text><text x="880" y="585" fill="#f5f1e8" font-size="38">Volume</text><text x="880" y="650" fill="#e5ca89" font-size="52">V = ⁴⁄₃πr³</text><text x="880" y="715" fill="#cbd6e2" font-size="27">cubic units · space inside</text><text x="880" y="800" fill="#fff" font-size="30">Scale r by k → SA × k², V × k³</text></g><text x="800" y="925" text-anchor="middle" fill="#cbd6e2" font-family="Arial,sans-serif" font-size="24">Original Khaemenes Academy reference · printable · scalable SVG · no external dependency</text></svg>