<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#17344a"><title>Linear Model Lab · Khaemenes Algebra I</title><link rel="stylesheet" href="../assets/styles.css"></head><body><a class="skip" href="#main">Skip to main content</a><header class="site-header"><div class="wrap header-inner"><a class="brand" href="../"><span class="brand-mark">A1</span><span class="brand-copy"><strong>KHAEMENES ACADEMY</strong><small>Algebra I · Applied Mathematics Lab</small></span></a><nav class="header-nav"><a href="../">Course Home</a><a href="index.html">Labs</a><a href="../units/unit-06/">Unit 06</a></nav></div></header><main id="main"></main><footer class="footer"><div class="wrap footer-inner"><span>KH-MATH-A1-LAB-01</span><span>Linear modelling · Evidence · 80% lab mastery</span></div></footer><script>window.KHAE_ALGEBRA1_LAB={id:"linear-model",eyebrow:"Applied Lab 01 · Linear Functions",title:"Linear Model Lab",purpose:"Build, test, interpret, and defend a linear model from paired data rather than treating a fitted equation as automatically true.",question:"How well can a linear model predict travel time from distance, and where does that model stop being trustworthy?",scenario:"A cyclist records distance and elapsed travel time on a mostly level route. Use the supplied observations or replace them with your own paired measurements. Treat the data as evidence: model the trend, inspect error, interpret parameters with units, and state when prediction becomes unreasonable.",data:[["Distance x (miles)","Elapsed time y (minutes)"],["1","5.1"],["2","9.9"],["3","15.2"],["4","19.8"],["5","25.1"],["6","30.0"]],objectives:["Represent paired quantitative data and identify a plausible linear trend.","Estimate or calculate a line of fit and write it as y = mx + b.","Interpret slope and intercept in the context and with correct units.","Compare observed and predicted values using residuals or prediction errors.","Distinguish interpolation from extrapolation and defend a model limitation."],procedure:["Plot the six ordered pairs on graph paper or a coordinate tool. Label both axes and units.","Estimate a reasonable line of fit, then calculate or refine its slope and intercept.","Use your equation to predict y for at least three observed x-values and compute observed minus predicted error.","Make one interpolation prediction inside the observed domain and one extrapolation prediction outside it.","Decide whether the linear model is useful, and support that decision with numerical and contextual evidence."],sections:[{id:"representation",title:"Graph & Model",prompt:"Describe your graph and write your linear model. Show how you obtained slope and intercept. Include units and enough calculation that another reader can reproduce the model.",rows:10,full:true},{id:"residuals",title:"Prediction Error",prompt:"For at least three supplied data points, record the predicted value and the residual or prediction error. What pattern do the errors show?",rows:8},{id:"meaning",title:"Interpret the Parameters",prompt:"Explain what the slope means in minutes per mile and what the intercept would mean physically. Is the intercept plausible in this context? Why or why not?",rows:8},{id:"prediction",title:"Interpolation vs. Extrapolation",prompt:"Make one prediction inside the measured distance range and one beyond it. Which prediction deserves more confidence, and what assumption are you making?",rows:8},{id:"defense",title:"Model Defense",prompt:"State a conclusion about the usefulness of your linear model. Name at least two limitations or conditions that could make the relationship less linear.",rows:9,full:true}],checklist:["Axes, variables, and units are explicit.","The equation is supported by calculations or a documented fitting method.","At least three prediction errors/residuals are evaluated.","Slope and intercept are interpreted in context rather than only named.","Interpolation and extrapolation are distinguished.","The final claim includes limitations and does not imply causation from association alone."],rubric:["Mathematical accuracy and reproducibility","Graph/model representation and units","Residual/error analysis","Interpretation of slope, intercept, and predictions","Limitations, reasoning, and model defense"]};</script><script src="assets/lab-engine-v1.js"></script></body></html>
