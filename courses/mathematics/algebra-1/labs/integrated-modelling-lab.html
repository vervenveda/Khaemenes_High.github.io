st original constraints, data, an alternate representation, residual/error evidence, or a boundary case. Record any mismatch and revise if needed.",rows:10},{id:"sensitivity",title:"Sensitivity & Uncertainty",prompt:"Change at least one important parameter or assumption. Quantify how the result changes and identify which assumptions have the greatest influence.",rows:9},{id:"defense",title:"Recommendation & Model Defense",prompt:"State what decision or conclusion the model supports. Separate evidence from judgment, identify uncertainty/fairness concerns, and list additional information that would improve the model.",rows:11,full:true}],checklist:["The question is specific enough to model and does not overclaim what mathematics can establish.","Variables, units, domains, and constraints are explicit.","The selected model is justified and accompanied by another representation.","At least one independent validation or verification check is documented.","Sensitivity to a changed assumption/parameter is quantified.","The conclusion states limitations, uncertainty, and any fairness or ethical concern relevant to the decision."],rubric:["Question framing, variables, and assumptions","Model selection and algebraic accuracy","Representations and validation evidence","Sensitivity, uncertainty, and revision","Communication, limitations, fairness, and defense"]};</script><script src="assets/lab-engine-v1.js"></script></body></html>
