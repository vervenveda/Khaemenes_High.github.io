<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#17344a"><title>Financial Evidence Lab · Khaemenes Algebra I</title><link rel="stylesheet" href="../assets/styles.css"></head><body><a class="skip" href="#main">Skip to main content</a><header class="site-header"><div class="wrap header-inner"><a class="brand" href="../"><span class="brand-mark">A1</span><span class="brand-copy"><strong>KHAEMENES ACADEMY</strong><small>Algebra I · Applied Mathematics Lab</small></span></a><nav class="header-nav"><a href="../">Course Home</a><a href="index.html">Labs</a><a href="../units/unit-12/">Unit 12</a></nav></div></header><main id="main"></main><footer class="footer"><div class="wrap footer-inner"><span>KH-MATH-A1-LAB-05</span><span>Financial modelling · Fees · 80% lab mastery</span></div></footer><script>window.KHAE_ALGEBRA1_LAB={id:"financial-evidence",eyebrow:"Applied Lab 05 · Financial Mathematics",title:"Financial Evidence Lab",purpose:"Compare financial growth claims by modelling rates, compounding, fees, time, and assumptions instead of ranking options by headline percentage alone.",question:"Can an account with a higher advertised annual rate produce a lower net result once fees and time are included?",scenario:"Compare two hypothetical savings accounts for a $1,000 starting balance with no deposits or withdrawals. Account A advertises 4.0% annual interest compounded monthly with no annual fee. Account B advertises 4.5% annual interest compounded monthly but charges a $36 fee at the end of each year. Assume rates stay fixed solely for this mathematical comparison; real rates, terms, taxes, inflation, and protections can differ.",data:[["Feature","Account A","Account B"],["Starting balance","$1,000","$1,000"],["Nominal annual rate","4.0%","4.5%"],["Compounding","monthly","monthly"],["Annual fee","$0","$36 at year-end"],["Deposits/withdrawals","none","none"]],objectives:["Translate annual percentage rates and monthly compounding into exponential expressions.","Include fees explicitly instead of comparing headline rates alone.","Compare one-year and multi-year outcomes using consistent assumptions.","Find or estimate a break-even starting balance or time horizon.","Communicate why a mathematical comparison is not automatically personalized financial advice."],procedure:["Write the one-year compound-interest expression for each account before applying any annual fee.","Calculate each one-year ending balance and Account B's net balance after its $36 fee.","Extend the comparison for three years, applying Account B's fee at each year-end and documenting the recurrence or calculation method.","Investigate how the result changes for a different starting balance and estimate a break-even balance where the higher rate offsets the annual fee over one year.","Write a conclusion that separates the mathematical result from real-world factors not represented in the model."],sections:[{id:"models",title:"Build the Financial Models",prompt:"Write the compound-interest equations or recurrence rules used for both accounts. Define rate per compounding period, number of periods, fee timing, and units.",rows:10,full:true},{id:"one_year",title:"One-Year Comparison",prompt:"Calculate each account's balance after 12 monthly compounding periods. Then apply Account B's annual fee and compare net dollar growth and percent growth.",rows:9},{id:"multi_year",title:"Three-Year Evidence",prompt:"Extend the balances through three years. Show when each annual fee is applied and compare the ending balances. Avoid applying a fee or interest rate at the wrong time.",rows:10},{id:"break_even",title:"Break-Even & Sensitivity",prompt:"Change the starting balance and estimate or solve for a one-year break-even balance at which Account B's extra interest offsets its $36 fee. Explain what the break-even value means.",rows:9},{id:"defense",title:"Evidence-Based Conclusion",prompt:"State which account produces the larger modeled balance for the given assumptions. Then identify at least three omitted real-world factors—such as changing rates, taxes, inflation, liquidity, eligibility, or account protections—that would matter before a real decision.",rows:9,full:true}],checklist:["Monthly rate and number of periods are used consistently.","The annual fee is included at the stated time.","Dollar growth and percent growth are not confused.","Multi-year calculations preserve the previous year's net balance.","A break-even or sensitivity analysis is included.","The conclusion distinguishes mathematical evidence from personalized financial advice."],rubric:["Compound-interest and fee-model accuracy","One-year calculations and interpretation","Multi-year recurrence and timing","Break-even/sensitivity reasoning","Evidence communication and model limitations"]};</script><script src="assets/lab-engine-v1.js"></script></body></html>
