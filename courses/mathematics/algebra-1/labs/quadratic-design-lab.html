rms to zeros and maximum value.","Restrict a mathematical domain using physical meaning.","Verify an optimum numerically and algebraically.","Analyze how changing the available fencing changes the design."],procedure:["Derive A(x) from the fencing constraint rather than accepting the formula without explanation.","Expand the function and identify its zeros and axis of symmetry.","Rewrite or analyze the quadratic in vertex form and determine the maximizing depth, width, and area.","Check nearby integer or decimal depth choices to verify that the vertex gives the largest area in the physical domain.","Repeat the reasoning symbolically or numerically for a different fencing amount and describe what changes."],sections:[{id:"derivation",title:"Derive the Quadratic",prompt:"Starting from the three fenced sides, derive the width expression and A(x). Show the factored and standard forms and state the physically meaningful domain.",rows:10,full:true},{id:"features",title:"Interpret Key Features",prompt:"Identify the zeros, axis of symmetry, vertex, maximum area, and corresponding dimensions. Explain what each feature means physically.",rows:9},{id:"verification",title:"Verify the Maximum",prompt:"Evaluate the area for at least four depths around the maximizing value. Use the results to verify the algebraic conclusion and explain why a boundary value is not optimal.",rows:8},{id:"sensitivity",title:"Change the Constraint",prompt:"Choose a different total fencing amount. Build the new area function and determine how the optimal depth, width, and maximum area change.",rows:9},{id:"defense",title:"Design Defense",prompt:"Recommend the final dimensions and defend the design using the quadratic model, domain, units, and at least one practical limitation not represented by area alone.",rows:9,full:true}],checklist:["The quadratic is derived from the fencing condition.","Factored/standard/vertex information is connected correctly.","The physical domain excludes impossible dimensions.","The maximum is verified numerically as well as algebraically.","A changed fencing constraint is analyzed.","The recommendation includes units and a practical limitation."],rubric:["Derivation and algebraic accuracy","Quadratic features and domain interpretation","Maximum verification and numerical evidence","Sensitivity to a changed constraint","Design defense, units, and limitations"]};</script><script src="assets/lab-engine-v1.js"></script></body></html>
