<style>:root{font:17px/1.6 system-ui,Arial;color:#28241c;background:#f5eddf}*{box-sizing:border-box}main{max-width:850px;margin:auto;padding:24px}h1{font-family:Georgia,serif;font-size:clamp(28px,4vw,40px);font-weight:500}.card{background:#fffdfa;border:1px solid #cbb99a;padding:22px;border-radius:7px;margin:16px 0}button,a{font:inherit;display:inline-block;border:1px solid #927c5d;background:#fff5e5;border-radius:7px;padding:9px 13px;margin:4px;color:#28241c;cursor:pointer;text-decoration:none}button:disabled{opacity:.5;cursor:default}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #226c99;outline-offset:3px}label{display:block;margin:10px 0;padding:10px;border:1px solid #ddd0ba;border-radius:7px;cursor:pointer}input{margin-right:10px}#status{border-left:4px solid #8f7958;padding:8px 13px;min-height:58px}.subtle{color:#605645}</style></head><body><main>
<p><a href="../../../algebra-1/instructional-repair-pack/resource-studio/units-02-04.html">← Return to reading and worksheets</a></p>
<h1>Structure &amp; Balance Challenge</h1><p>Units 02–04 · Nine formative reasoning tasks. No grading, official mastery credit, storage, or external dependencies.</p>
<div class="card"><p class="subtle" id="count"></p><h2 id="prompt"></h2><fieldset><legend>Choose the strongest mathematical answer</legend><div id="choices"></div></fieldset><p id="status" role="status" aria-live="polite" aria-atomic="true">Select an answer, then check your reasoning.</p><button id="check" type="button">Check answer</button><button id="next" type="button" disabled>Next</button><button id="restart" type="button">Restart from Question 1</button></div>
</main><script>
"use strict";
const tasks=[
["Unit 02","Simplify 3(2x−5)+4x.",["10x−15","10x−5","6x−1"],0,"3 multiplies both terms: 6x−15+4x=10x−15."],
["Unit 02","Which expression means 'seven less than three times n'? ",["7−3n","3(n−7)","3n−7"],2,"Three times n is 3n; seven less gives 3n−7."],
["Unit 02","Why does testing x=2 in two expressions not prove they are identical?",["A single input verifies only that case.","All expressions are linear.","An input can never be checked."],0,"A universal identity requires an algebraic argument valid across the shared domain."],
["Unit 03","Solve 2(x−3)=x+4.",["x=10","x=1","x=−10"],0,"Distribute: 2x−6=x+4. Subtract x and add 6 to get x=10."],
["Unit 03","What happens when 2(x+1)=2x+3 is simplified?",["x=1","Every number works","No number works"],2,"Removing 2x gives 2=3, a contradiction."],
["Unit 03","What is the most reliable check of a solved equation?",["Check only a middle step","Substitute into the original equation","Accept a calculator result"],1,"Substitution into the original checks the full chain of transformations."],
["Unit 04","Solve −2x<6.",["x<−3","x>−3","x>3"],1,"Dividing by −2 reverses order: x>−3."],
["Unit 04","Represent x≥1 AND x<4 in interval notation.",["[1,4)","(1,4]","(−∞,1] ∪ [4,∞)"],0,"AND means intersection; include 1 and exclude 4."],
["Unit 04","Which statement about endpoints is correct?",["Infinity is included using a bracket.","An open circle includes the endpoint.","A closed circle includes the endpoint."],2,"Closed means included; an infinity symbol always has a parenthesis."]
];
let index=0,correct=0,graded=false;const $=id=>document.getElementById(id);
function render(){graded=false;$("count").textContent="Question "+(index+1)+" of "+tasks.length+" · "+tasks[index][0];$("prompt").textContent=tasks[index][1];$("choices").replaceChildren();for(let i=0;i<tasks[index][2].length;i++){let label=document.createElement("label"),radio=document.createElement("input");radio.type="radio";radio.name="selection";radio.value=String(i);label.append(radio,document.createTextNode(tasks[index][2][i]));$("choices").append(label)}$("status").textContent="Select an answer, then check your reasoning.";$("check").disabled=false;$("next").disabled=true;$("next").textContent=index===tasks.length-1?"Finish round":"Next question"}
$("check").addEventListener("click",()=>{if(graded)return;const chosen=document.querySelector('input[name="selection"]:checked');if(!chosen){$("status").textContent="Choose one answer to continue.";return}graded=true;let ok=Number(chosen.value)===tasks[index][3];if(ok)correct++;$("status").textContent=(ok?"Correct. ":"Review: ")+tasks[index][4];document.querySelectorAll('input[name="selection"]').forEach(x=>x.disabled=true);$("check").disabled=true;$("next").disabled=false});
$("next").addEventListener("click",()=>{if(!graded)return;index++;if(index<tasks.length){render();return}$("count").textContent="Complete";$("prompt").textContent="Round complete";$("choices").replaceChildren();$("status").textContent="You answered "+correct+" of "+tasks.length+" correctly. Review the readings if needed; this is formative practice only.";$("check").disabled=true;$("next").disabled=true});
$("restart").addEventListener("click",()=>{index=0;correct=0;render()});render();
</script></body></html>
