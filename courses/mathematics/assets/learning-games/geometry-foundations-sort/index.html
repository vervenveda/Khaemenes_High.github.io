<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Geometry Foundations Sort · Khaemenes Academy Mathematics</title><style>
:root{font-family:"Brandon Grotesque","Avenir Next","Segoe UI",Arial,sans-serif;color:#f5f1e8;background:#07111d}*{box-sizing:border-box}body{margin:0;min-width:0}main{width:min(calc(100% - 24px),900px);margin:auto;padding:28px 0 72px}h1,h2{font-family:Cinzel,Georgia,serif;font-weight:400}h1{font-size:clamp(30px,7vw,48px);line-height:1.08}.kicker{letter-spacing:.12em;text-transform:uppercase;font-size:11px;color:#ead7aa}.card{padding:20px;border:1px solid rgba(234,215,170,.26);border-radius:7px;background:#102033}.choices{display:grid;gap:8px}.choices label{display:block;padding:10px;border:1px solid rgba(234,215,170,.18);border-radius:7px;background:#0b1827;cursor:pointer}button,a.button{font:inherit;color:#f5f1e8;background:#17344a;border:1px solid #c9a35f;border-radius:7px;padding:10px 12px;text-decoration:none;cursor:pointer}button:disabled{opacity:.5}.actions{display:flex;gap:8px;flex-wrap:wrap}.status{min-height:56px;padding:9px 12px;border-left:3px solid #c9a35f}.muted{color:#b7c2cf}progress{width:100%}@media(max-width:320px){main{width:calc(100% - 12px)}.actions>*{width:100%}.card{padding:14px}}
</style></head><body><main><p class="kicker">Khaemenes Academy · Geometry · Formative Practice</p><h1>Geometry Foundations Sort</h1><p>Classify points, lines, planes, collinearity, coplanarity, intersections, and defined terms.</p><section class="card"><p id="counter" class="muted"></p><progress id="progress" max="10" value="0"></progress><p id="saved" class="muted"></p><h2 id="questionTitle"></h2><div id="choices" class="choices"></div><p id="status" class="status" role="status" aria-live="polite">Choose the strongest answer.</p><div class="actions"><button id="check">Check answer</button><button id="next" disabled>Next</button><button id="restart">New round</button><a class="button" href="../../../geometry/units/unit-01/lessons/u01-l01.html">Return to lesson</a></div></section><p class="muted">Formative only. This game cannot award Geometry mastery or unlock course gates.</p></main><script>(()=>{"use strict";const BANK=[["Which object has no dimension and names an exact location?",["point","line","plane","segment"],0,"A point names a location and has no length, width, or height."],["Which object extends infinitely in two opposite directions?",["ray","segment","line","plane"],2,"A line extends infinitely in both directions."],["Which object extends infinitely in all directions within a flat surface?",["line","plane","ray","angle"],1,"A plane is a flat two-dimensional surface extending without end."],["Points on the same line are:",["coplanar only","collinear","parallel","skew"],1,"Collinear points lie on one line."],["Points in the same plane are:",["collinear","coplanar","perpendicular","congruent"],1,"Coplanar points share a plane."],["Two distinct intersecting lines meet in exactly:",["one point","two points","a plane","no points"],0,"Two distinct intersecting lines share one point."],["Two distinct parallel lines are always:",["intersecting","coplanar","skew","perpendicular"],1,"Parallel lines lie in the same plane and never meet."],["Skew lines are:",["parallel and coplanar","noncoplanar and nonintersecting","perpendicular","the same line"],1,"Skew lines are not coplanar and do not intersect."],["A line and a plane can intersect in:",["exactly two points only","one point or an entire line","no possible way","exactly three points"],1,"A line may pierce a plane at one point or lie in it."],["Which is a defined term built from points and a line?",["point","line","plane","segment"],3,"Segments are defined from endpoints on a line."],["A unique plane is determined by:",["one point","two points only","three noncollinear points","one line only"],2,"Three noncollinear points determine exactly one plane."],["If two planes intersect, their intersection is generally a:",["point","line","ray","circle"],1,"Two distinct intersecting planes meet in a line."]],KEY="khae-geometry-foundations-sort-v1",$=id=>document.getElementById(id);let tasks=[],i=0,score=0,graded=false;function sh(a){a=[...a];for(let n=a.length-1;n>0;n--){const j=Math.floor(Math.random()*(n+1));[a[n],a[j]]=[a[j],a[n]]}return a}function read(){try{return JSON.parse(localStorage.getItem(KEY)||'{"best":0,"attempts":0}')}catch{return{best:0,attempts:0}}}function save(p){try{const r=read();r.best=Math.max(Number(r.best)||0,p);r.attempts=(Number(r.attempts)||0)+1;localStorage.setItem(KEY,JSON.stringify(r))}catch{}}function saved(){const r=read();$("saved").textContent=r.attempts?"Saved best: "+r.best+"% · "+r.attempts+" round(s).":"Scores save locally on this device."}function start(){tasks=sh(BANK).slice(0,10);i=0;score=0;render()}function render(){graded=false;const t=tasks[i];$("counter").textContent="Question "+(i+1)+" of "+tasks.length;$("progress").value=i;$("questionTitle").textContent=t[0];$("choices").replaceChildren();t[1].forEach((c,n)=>{const l=document.createElement("label"),r=document.createElement("input");r.type="radio";r.name="a";r.value=n;l.append(r,document.createTextNode(c));$("choices").append(l)});$("status").textContent="Choose the strongest answer.";$("check").disabled=false;$("next").disabled=true;$("next").textContent=i===tasks.length-1?"See results":"Next";$("check").onclick=()=>{if(graded)return;const x=document.querySelector('input[name="a"]:checked');if(!x){$("status").textContent="Choose an answer first.";return}graded=true;const ok=Number(x.value)===t[2];if(ok)score++;$("status").textContent=(ok?"Correct. ":"Review: ")+t[3];document.querySelectorAll('input[name="a"]').forEach(r=>r.disabled=true);$("check").disabled=true;$("next").disabled=false};$("next").onclick=()=>{if(!graded)return;i++;if(i<tasks.length){render();return}const p=Math.round(score/tasks.length*100);save(p);$("progress").value=tasks.length;$("counter").textContent="Round complete";$("questionTitle").textContent=score+" / "+tasks.length+" correct ("+p+"%)";$("choices").replaceChildren();$("status").textContent=p>=80?"Strong formative result. Official mastery remains separate.":"Review the explanations and retry.";$("check").disabled=true;$("next").disabled=true;saved()};$("restart").onclick=start}saved();start()})();</script></body></html>
