<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Evidence & Modelling Challenge · Algebra I</title><style>:root{font:17px/1.6 system-ui,Arial;color:#29241c;background:#f6eee2}*{box-sizing:border-box}main{max-width:850px;margin:auto;padding:24px}h1{font:normal clamp(28px,5vw,40px)/1.3 Georgia,serif}.card{background:#fffdfa;border:1px solid #cbb99c;padding:22px;border-radius:7px;margin:15px 0}a,button{font:inherit;color:inherit;background:#fff7e8;padding:9px 12px;border:1px solid #927f64;border-radius:7px;cursor:pointer;text-decoration:none}button:disabled{opacity:.55}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #246c99;outline-offset:3px}label{display:flex;align-items:start;gap:10px;padding:10px;margin:8px 0;border:1px solid #d9c9b0;border-radius:7px}input{flex:none;margin-top:7px}fieldset{border:1px solid #cbb99c;border-radius:7px}#feedback{border-left:3px solid #8d7858;padding:12px;min-height:58px}.muted{color:#615447}</style></head><body><main><p><a href="../../../algebra-1/instructional-repair-pack/resource-studio/units-12-13.html">← Return to readings and model lab</a></p><h1>Evidence &amp; Modelling Challenge</h1><p>Sixteen formative reasoning questions. No student identifiers, local storage, official scores, or mastery credit.</p><div class="card"><p id="count" class="muted"></p><h2 id="prompt"></h2><fieldset><legend>Select the best mathematical conclusion</legend><div id="choices"></div></fieldset><p id="feedback" role="status" aria-live="polite" aria-atomic="true"></p><button type="button" id="check">Check answer</button> <button type="button" id="next" disabled>Next</button> <button type="button" id="restart">Restart</button></div></main><script>
"use strict";const bank=[
["12","Which question is statistical?",["How many minutes did one student travel yesterday?","How long do students at this school generally travel?","What is 4+5?"],1,"A statistical question anticipates differences among members of a group."],
["12","Find the mean of 2,4,4,6,9.",["4","5","7"],1,"Sum 25 divided by five observations gives 5."],
["12","Find the median of 2,4,4,6,9.",["4","5","6"],0,"The middle value of five ordered values is 4."],
["12","What is the range of 2,4,4,6,9?",["9","5","7"],2,"Maximum minus minimum is 9−2=7."],
["12","For the data 2,4,4,6,9, which variance describes the entire five-value population?",["28/5=5.6","28/4=7","25/5=5"],0,"Squared deviations from mean 5 sum to 28; population variance divides by five."],
["12","A survey sampled only athletes. What concern matters when describing all students?",["Possible selection bias","Certain representativeness","Proof of causation"],0,"Sampling only athletes may not represent other students."],
["12","How much simple interest does $1,000 earn at 5% for one year?",["$5","$50","$500"],1,"1000×0.05×1=$50."],
["12","A correlation between two variables by itself establishes what?",["Causation","A guaranteed forecast","Association, not necessarily causation"],2,"Confounding factors and study design matter before causal claims."],
["13","For A(n)=180+8n and B(n)=80+12n, find the break-even student count.",["20","25","30"],1,"Set equal: 180+8n=80+12n; 100=4n; n=25."],
["13","At 20 students, which provider costs less?",["B, by $20","A, by $20","They are equal"],0,"A costs $340 and B costs $320."],
["13","At 30 students, which provider costs less?",["B, by $20","A, by $20","They are equal"],1,"A costs $420; B costs $440."],
["13","If A's fixed charge rises to $200, what is the new break-even count?",["25","20","30"],2,"200+8n=80+12n, so n=30."],
["13","What is a reasonable domain for the number of students n?",["Any negative real number","Nonnegative whole numbers, within capacity","Only numbers with decimals"],1,"Students are counted discretely and cannot be negative; vehicle capacity may limit the domain."],
["13","What does sensitivity testing examine?",["How results respond to changes in assumptions","Only the first calculated answer","Whether a model looks attractive"],0,"Change a parameter, then recompute the decision and break-even point."],
["13","What must be considered beyond the cheapest transport quote?",["Only the font used in the proposal","Nothing else","Capacity, accessibility and fees"],2,"A defensible decision incorporates constraints, fairness, and unmodelled costs."],
["13","Which conclusion is mathematically strongest?",["B is always best.","B is cheaper for 20 under stated equal-service assumptions; verify fees and accessibility.","My calculator says B."],1,"Name the scenario, evidence, assumptions, and a limitation."]
];let i=0,correct=0,answered=false;const $=id=>document.getElementById(id);
function render(){answered=false;const q=bank[i];$("count").textContent="Unit "+q[0]+" · Question "+(i+1)+" of "+bank.length;$("prompt").textContent=q[1];$("choices").replaceChildren();q[2].forEach((choice,n)=>{let l=document.createElement("label"),input=document.createElement("input");input.type="radio";input.name="option";input.value=String(n);l.append(input,document.createTextNode(choice));$("choices").append(l)});$("feedback").textContent="Choose an answer before checking.";$("check").disabled=false;$("next").disabled=true;$("next").textContent=i===bank.length-1?"Finish":"Next question"}
$("check").addEventListener("click",()=>{if(answered)return;let selected=document.querySelector('input[name="option"]:checked');if(!selected){$("feedback").textContent="Select one answer to continue.";return}answered=true;let q=bank[i],ok=Number(selected.value)===q[3];if(ok)correct++;$("feedback").textContent=(ok?"Correct. ":"Review: ")+q[4];document.querySelectorAll('input[name="option"]').forEach(x=>x.disabled=true);$("check").disabled=true;$("next").disabled=false});
$("next").addEventListener("click",()=>{if(!answered)return;i++;if(i<bank.length){render();return}$("count").textContent="Round complete";$("prompt").textContent="Well done finishing the challenge.";$("choices").replaceChildren();$("feedback").textContent="You answered "+correct+" of "+bank.length+" correctly. This score is for practice only and has not been saved.";$("check").disabled=true;$("next").disabled=true});
$("restart").addEventListener("click",()=>{i=0;correct=0;render()});render();
</script></body></html>
