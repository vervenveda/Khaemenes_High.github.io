<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Exponent Properties Lab · Unit 06 Lesson 03</title><style>:root{font-family:system-ui,sans-serif;color:#30291f;background:#f7f0e3}*{box-sizing:border-box}body{margin:0}main{max-width:840px;margin:auto;padding:24px 18px 70px}h1,h2{font-weight:500}.card{background:#fffdf8;border:1px solid #c7b69a;border-radius:7px;padding:22px;margin:20px 0}button,input,.button{font:inherit;border:1px solid #8c7656;border-radius:7px;padding:12px;background:#fffdf8;color:#30291f}button,.button{cursor:pointer}button:hover,.button:hover{background:#eadfc9}button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid #20638d;outline-offset:3px}input{max-width:220px;width:100%}.button{display:inline-block;text-decoration:none}progress{width:100%;height:18px}#feedback{min-height:3em}</style></head><body><main><p>Pre-Algebra · Unit 06 · Lesson 03</p><h1>Exponent Properties Lab</h1><p>Practice multiplying and dividing powers, powers of powers, products raised to powers, and zero or negative exponents. Enter the <strong>numerical value</strong> of each expression, not exponent notation. Decimals are accepted.</p><section class="card"><p id="counter" aria-live="polite"></p><progress id="progress" max="10" value="0"></progress><h2 id="question"></h2><form id="form"><label for="answer">Your numerical answer</label><p><input id="answer" type="number" step="any" required autocomplete="off"> <button id="check" type="submit">Check answer</button></p></form><p id="feedback" role="status" aria-live="polite"></p><button id="next" type="button" hidden>Next →</button><div id="finish"></div></section><a class="button" href="../../../pre-algebra/units/unit-06/lessons/lesson-03-exponent-properties-equivalent-expressions.html">← Return to Lesson 03</a><script>(()=>{'use strict';const tasks=[["Simplify 2³ × 2⁴. What is the resulting value?",128,"Add exponents with the same base: 2^(3+4) = 2⁷ = 128."],["Simplify 5⁶ ÷ 5⁴. What is the resulting value?",25,"Subtract exponents with the same base: 5^(6−4) = 5² = 25."],["Evaluate (3²)³.",729,"Multiply exponents: (3²)³ = 3⁶ = 729."],["Evaluate (2 × 3)².",36,"Distribute the power to both factors: 2² × 3² = 4 × 9 = 36."],["Evaluate 7⁰.",1,"Any nonzero number raised to the zero power is 1."],["Evaluate 2⁻³. Enter a decimal.",0.125,"2⁻³ = 1/2³ = 1/8 = 0.125."],["Evaluate 4³ × 4⁻¹.",16,"4^(3 + (−1)) = 4² = 16."],["Evaluate (10³ ÷ 10¹) × 10².",10000,"10^(3−1+2) = 10⁴ = 10000."],["Evaluate (2³)² ÷ 2⁴.",4,"2^(3×2−4) = 2² = 4."],["Evaluate (3 × 2²)².",144,"3² × (2²)² = 9 × 16 = 144."]];let i=0,score=0,answered=false;const $=id=>document.getElementById(id);function show(){answered=false;$('counter').textContent='Question '+(i+1)+' of '+tasks.length;$('progress').value=i;$('question').textContent=tasks[i][0];$('answer').value='';$('answer').disabled=false;$('check').disabled=false;$('form').hidden=false;$('feedback').textContent='';$('next').hidden=true;$('answer').focus()}$('form').addEventListener('submit',e=>{e.preventDefault();if(answered||$('answer').value.trim()==='')return;answered=true;const ok=Math.abs(Number($('answer').value)-tasks[i][1])<0.000001;if(ok)score++;$('feedback').textContent=(ok?'Correct! ':'Not quite. Correct answer: '+tasks[i][1]+'. ')+tasks[i][2];$('answer').disabled=true;$('check').disabled=true;$('next').hidden=false;$('next').textContent=i===tasks.length-1?'See results →':'Next →'});$('next').addEventListener('click',()=>{i++;if(i<tasks.length){show();return}$('progress').value=tasks.length;$('counter').textContent='Completed';$('question').textContent='Your results';$('form').hidden=true;$('next').hidden=true;$('feedback').textContent='Score: '+score+'/'+tasks.length+' ('+Math.round(score/tasks.length*100)+'%). Review explanations and replay to practice.';const b=document.createElement('button');b.textContent='Play again';b.addEventListener('click',()=>{i=0;score=0;$('finish').replaceChildren();show()});$('finish').replaceChildren(b)});show()})();</script></main><script src="https://vervenveda.com/Khaemenes_High.github.io/assets/vnv-beta-link.js" defer data-khaemenes-student-toolbar="v1.8"></script>
