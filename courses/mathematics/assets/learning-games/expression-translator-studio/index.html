<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Expression Translator Studio · Khaemenes Mathematics</title><style>
:root{font-family:"Avenir Next","Segoe UI",Arial,sans-serif;color:#f4efe6;background:#07111d}*{box-sizing:border-box}body{margin:0}main{max-width:900px;margin:auto;padding:26px 16px 70px}h1,h2{font-family:Georgia,serif;font-weight:400}h1{font-size:clamp(30px,5vw,44px)}.card{background:#102033;border:1px solid rgba(234,215,170,.25);border-radius:7px;padding:20px;margin:18px 0}.choices{display:grid;gap:9px}.choices label{padding:10px;border:1px solid rgba(234,215,170,.18);border-radius:7px;background:#0b1827;cursor:pointer}button,a.button{font:inherit;color:#f4efe6;background:#17344a;border:1px solid #c9a35f;border-radius:7px;padding:10px 13px;text-decoration:none;cursor:pointer}button:disabled{opacity:.5}.status{min-height:54px;border-left:3px solid #c9a35f;padding:8px 12px}.muted{color:#b7c2cf}.actions{display:flex;gap:8px;flex-wrap:wrap}progress{width:100%}@media(max-width:520px){.actions>*{width:100%}}</style></head><body><main>
<p class="muted">Khaemenes Academy · Mathematics · Formative Practice</p><h1>Expression Translator Studio</h1><p>Translate carefully between words and symbols. Order matters: “less than,” “more than,” quotients, and grouped quantities can change the entire expression.</p>
<section class="card"><p id="counter"></p><progress id="progress" max="10" value="0"></progress><p id="saved" class="muted"></p><h2 id="prompt"></h2><div id="choices" class="choices"></div><p id="status" class="status" role="status" aria-live="polite"></p><div class="actions"><button id="check">Check</button><button id="next" disabled>Next</button><button id="restart">New round</button><a class="button" href="../../../pre-algebra/units/unit-07/lessons/lesson-02-translating-words-contexts-expressions.html">Return to lesson</a></div></section>
</main><script>(()=>{"use strict";const BANK=[
["Translate: five more than x.",["5x","x+5","5−x","x−5"],1,"‘Five more than x’ means add 5 to x."],
["Translate: seven less than 3n.",["7−3n","3n−7","3(n−7)","7n−3"],1,"‘Seven less than 3n’ reverses the subtraction order: 3n−7."],
["Translate: twice the sum of x and 4.",["2x+4","2(x+4)","x+8","2x−4"],1,"The sum is grouped first, then multiplied by 2."],
["Translate: the quotient of y and 6.",["6/y","y−6","y/6","6y"],2,"A quotient of y and 6 is y divided by 6."],
["Translate: 9 decreased by twice m.",["9−2m","2m−9","9m−2","2(9−m)"],0,"Start with 9, then subtract 2m."],
["Which phrase means 4(x−3)?",["Four less than x minus 3","Four times the difference of x and 3","The difference of 4x and 3","x minus twelve"],1,"Parentheses show that the entire difference is multiplied by 4."],
["Which expression represents ‘half of the quantity p+8’?",["p/2+8","(p+8)/2","p+4","2(p+8)"],1,"The whole quantity p+8 is divided by 2."],
["Translate: the square of a number t, increased by 6.",["(t+6)²","t²+6","2t+6","t²−6"],1,"Square t first, then increase by 6."],
["Which phrase matches 3a+2b?",["Three more than a plus two more than b","Three times a plus two times b","Five times ab","Three times the sum a+2b"],1,"Each coefficient multiplies its own variable term."],
["Translate: the product of 5 and the quantity k−2.",["5k−2","5(k−2)","k−10","5+k−2"],1,"‘The quantity’ signals grouping before multiplication."],
["Which expression means ‘12 divided by the sum of x and 1’?",["12/x+1","12/(x+1)","(12/x)+1","x+13"],1,"The denominator is the entire sum x+1."],
["Translate: 4 fewer than twice q.",["4−2q","2q−4","2(q−4)","4q−2"],1,"‘4 fewer than twice q’ is 2q−4."],
["Which phrase matches n/3−5?",["Five less than one third of n","One third of five less than n","Three less than five times n","The quotient of n and 8"],0,"n/3 is one third of n, then subtract 5."],
["Translate: the perimeter of a rectangle with length l and width w.",["lw","2l+w","2l+2w","l+w"],2,"A rectangle perimeter is twice the length plus twice the width."],
["Translate: a cost of $8 plus $3 for each ticket t.",["8t+3","3t+8","11t","8+3"],1,"The fixed fee is 8 and the variable cost is 3t."],
["Which expression represents ‘x is divided into 24 equal groups’?",["x/24","24/x","24x","24−x"],1,"24 divided by x gives the size when 24 is divided into x groups."]
];let tasks=[],i=0,score=0,graded=false;const $=id=>document.getElementById(id),KEY="khae-expression-translator-v1";
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function rec(){try{return JSON.parse(localStorage.getItem(KEY)||'{"best":0,"attempts":0}')}catch{return {best:0,attempts:0}}}function save(p){try{const r=rec();r.best=Math.max(r.best||0,p);r.attempts=(r.attempts||0)+1;localStorage.setItem(KEY,JSON.stringify(r))}catch{}}function saved(){const r=rec();$("saved").textContent=r.attempts?"Saved best: "+r.best+"% · "+r.attempts+" round(s).":"Scores save locally as formative practice."}function start(){tasks=shuffle(BANK).slice(0,10);i=0;score=0;render()}function render(){graded=false;const t=tasks[i];$("counter").textContent="Question "+(i+1)+" of "+tasks.length;$("progress").value=i;$("prompt").textContent=t[0];$("choices").replaceChildren();t[1].forEach((c,n)=>{const l=document.createElement("label"),r=document.createElement("input");r.type="radio";r.name="a";r.value=n;l.append(r,document.createTextNode(c));$("choices").append(l)});$("status").textContent="Translate carefully before choosing.";$("check").disabled=false;$("next").disabled=true;$("next").textContent=i===tasks.length-1?"Results":"Next"}$("check").onclick=()=>{const x=document.querySelector('input[name="a"]:checked');if(!x||graded){if(!x)$("status").textContent="Choose an answer first.";return}graded=true;const ok=Number(x.value)===tasks[i][2];if(ok)score++;$("status").textContent=(ok?"Correct. ":"Review: ")+tasks[i][3];document.querySelectorAll('input[name="a"]').forEach(r=>r.disabled=true);$("check").disabled=true;$("next").disabled=false};$("next").onclick=()=>{if(!graded)return;i++;if(i<tasks.length){render();return}const p=Math.round(score/tasks.length*100);save(p);$("progress").value=10;$("counter").textContent="Round complete";$("prompt").textContent=score+" / 10 correct ("+p+"%)";$("choices").replaceChildren();$("status").textContent=p>=80?"Strong formative translation fluency. Official lesson mastery remains separate.":"Review the explanations and try a fresh randomized round.";$("next").disabled=true;saved()};$("restart").onclick=start;saved();start()})();</script></body></html>
