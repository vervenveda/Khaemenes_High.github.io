<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Exponents to Radicals Challenge · Algebra I</title><style>
:root{font:17px/1.6 system-ui,Arial;color:#29241c;background:#f6eee1}*{box-sizing:border-box}main{max-width:860px;margin:auto;padding:24px}h1{font:normal clamp(28px,5vw,40px)/1.3 Georgia,serif}.card{background:#fffdfa;border:1px solid #cab798;border-radius:7px;padding:22px;margin:15px 0}a,button{font:inherit;display:inline-block;color:#29241c;border:1px solid #927f64;background:#fff6e7;padding:9px 12px;border-radius:7px;text-decoration:none;cursor:pointer;margin:3px}button:disabled{opacity:.55;cursor:default}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #246a99;outline-offset:3px}label{display:flex;gap:10px;padding:10px;margin:9px 0;border:1px solid #dccdb6;border-radius:7px;cursor:pointer}input{flex:none;margin-top:7px}#feedback{border-left:3px solid #786747;padding:9px 12px;min-height:55px}.muted{color:#625443}fieldset{border:1px solid #d0bfa4;border-radius:7px}
</style></head><body><main><p><a href="../../../algebra-1/instructional-repair-pack/resource-studio/units-08-11.html">← Return to reading, worksheets and models</a></p><h1>Exponents to Radicals Challenge</h1><p>Units 08–11 · Twenty formative reasoning questions, four from each unit. This game records no progress and cannot unlock official coursework.</p>
<div class="card"><p id="count" class="muted"></p><h2 id="prompt"></h2><fieldset><legend>Choose one answer</legend><div id="options"></div></fieldset><p id="feedback" role="status" aria-live="polite" aria-atomic="true">Select an answer, then check your reasoning.</p><button type="button" id="check">Check answer</button><button type="button" id="next" disabled>Next question</button><button type="button" id="restart">Start again</button></div></main><script>
"use strict";
const bank=[
["08","Simplify 2³ × 2⁻⁵.",["1/4","4","1/8"],0,"Add exponents with like bases: 3+(−5)=−2, so 2⁻²=1/4."],
["08","Which expression is scientific notation for 0.00042?",["42×10⁻⁵","4.2×10⁻⁴","0.42×10⁻³"],1,"Scientific notation has a coefficient at least 1 and below 10: 4.2×10⁻⁴."],
["08","A quantity increases five percent per year. Which factor is used each year?",["1.05","0.05","5"],0,"Five percent growth means multiply by 1+0.05=1.05 each period."],
["08","What is the value of 0⁻²?",["0","1","Undefined"],2,"The reciprocal would require dividing by zero."],
["09","Expand (x−2)(x−3).",["x²−6","x²−5x+6","x²+5x+6"],1,"Distribute all pairs: x²−3x−2x+6=x²−5x+6."],
["09","What are the zeros of (x−2)(x−3)=0?",["2 and 3","−2 and −3","0 and 6"],0,"Set each factor equal to zero because the product equals zero."],
["09","Factor 6x²+9x by the greatest common factor.",["3x(2x+3)","3(2x²+9x)","x(6x+9x)"],0,"The greatest common factor is 3x."],
["09","Does (x−2)(x−3)=4 allow setting each factor equal to zero?",["Yes, in any equation.","No, first rearrange to a zero product equation.","Only if x is negative."],1,"The zero-product property requires an expression equal to zero."],
["10","Find the vertex of y=(x−2)²−1.",["(2,−1)","(−2,1)","(1,3)"],0,"Vertex form identifies h=2 and k=−1."],
["10","Find the zeros of y=(x−1)(x−3).",["−1 and −3","0 and 2","1 and 3"],2,"Set each factor equal to zero."],
["10","How many real roots does a quadratic with a negative discriminant have?",["Zero","One","Two"],0,"For real coefficients a negative discriminant means no real roots."],
["10","Which expression is equivalent to x²−4x+3?",["(x−2)²−1","(x−2)²+1","(x−4)²+3"],0,"(x−2)²−1=x²−4x+4−1=x²−4x+3."],
["11","What is the principal square root √25?",["±5","−5","5"],2,"The radical denotes the nonnegative principal square root."],
["11","Simplify √72.",["6√2","9√8","12√6"],0,"72=36×2, so √72=6√2."],
["11","Solve √(x−2)=3.",["x=5","x=11","x=7"],1,"Square: x−2=9, so x=11; check √9=3."],
["11","Distance from (1,2) to (4,6)?",["7","√7","5"],2,"Differences are 3 and 4; distance √(3²+4²)=5."]
,
["08","An exponential model is 200(0.8)^t. What is its value at t=2?",["128","160","320"],0,"Two periods of 20% decay give 200×0.8×0.8=128."],
["09","Factor x²−9.",["(x−3)(x+3)","(x−9)(x+1)","(x−3)²"],0,"The difference-of-squares identity gives x²−3²=(x−3)(x+3)."],
["10","Solve x²−4x+3=0.",["Only x=2","x=1 or x=3","x=−1 or x=−3"],1,"Factor (x−1)(x−3)=0, then set each factor to zero."],
["11","Which candidate solves √(x+1)=x−1?",["x=0","x=3","x=0 or x=3"],1,"The right side must be nonnegative, so x≥1. Squaring gives x(x−3)=0; only x=3 checks in the original."]];
const $=id=>document.getElementById(id);let pos=0,correct=0,submitted=false;
function show(){submitted=false;const q=bank[pos];$("count").textContent="Unit "+q[0]+" · Question "+(pos+1)+" of "+bank.length;$("prompt").textContent=q[1];$("options").replaceChildren();q[2].forEach((choice,i)=>{const label=document.createElement("label"),radio=document.createElement("input");radio.type="radio";radio.name="answer";radio.value=String(i);label.append(radio,document.createTextNode(choice));$("options").append(label)});$("feedback").textContent="Select an answer, then check your reasoning.";$("check").disabled=false;$("next").disabled=true;$("next").textContent=pos===bank.length-1?"Finish":"Next question"}
$("check").addEventListener("click",()=>{if(submitted)return;const choice=document.querySelector('input[name="answer"]:checked');if(!choice){$("feedback").textContent="Please choose an answer first.";return}submitted=true;const q=bank[pos],ok=Number(choice.value)===q[3];if(ok)correct++;$("feedback").textContent=ok?"Correct. "+q[4]:"Review. Correct answer: "+q[2][q[3]]+". "+q[4];document.querySelectorAll('input[name="answer"]').forEach(x=>x.disabled=true);$("check").disabled=true;$("next").disabled=false});
$("next").addEventListener("click",()=>{if(!submitted)return;pos++;if(pos<bank.length){show();return}$("count").textContent="Practice round complete";$("prompt").textContent="All twenty questions completed.";$("options").replaceChildren();$("feedback").textContent="You answered "+correct+" of "+bank.length+" correctly. This is formative practice, not official mastery evidence.";$("check").disabled=true;$("next").disabled=true});
$("restart").addEventListener("click",()=>{pos=0;correct=0;show()});show();
</script></body></html>
