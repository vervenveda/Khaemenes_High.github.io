<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Exponent Pattern Explorer · Pre-Algebra Unit 06 Lesson 02</title><style>:root{font-family:system-ui,sans-serif;color:#30291f;background:#f7f0e3}*{box-sizing:border-box}body{margin:0}main{max-width:840px;margin:auto;padding:24px 18px 70px}h1,h2{font-weight:500}.card{background:#fffdf8;border:1px solid #c7b69a;border-radius:7px;padding:22px;margin:20px 0}button,input,.button{font:inherit;border:1px solid #8c7656;border-radius:7px;padding:12px;background:#fffdf8;color:#30291f}button,.button{cursor:pointer}button:hover,.button:hover{background:#eadfc9}button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid #20638d;outline-offset:3px}input{max-width:220px;width:100%}.button{display:inline-block;text-decoration:none}progress{width:100%;height:18px}#feedback{min-height:3em}</style></head><body><main><p>Pre-Algebra · Unit 06 · Lesson 02</p><h1>Exponent Pattern Explorer</h1><p>Explore zero and negative exponents. For nonzero <em>a</em>, a⁰ = 1 and a⁻ⁿ = 1/aⁿ. A negative exponent means a reciprocal, not a negative answer. Enter a decimal number; for repeating decimals round to six places.</p><section class="card"><p id="counter" aria-live="polite"></p><progress id="progress" max="10" value="0"></progress><h2 id="question"></h2><form id="form"><label for="answer">Your numerical answer</label><p><input id="answer" type="number" step="any" required autocomplete="off"> <button id="check" type="submit">Check answer</button></p></form><p id="feedback" role="status" aria-live="polite"></p><button id="next" type="button" hidden>Next →</button><div id="finish"></div></section><a class="button" href="../../../pre-algebra/units/unit-06/lessons/lesson-02-zero-negative-exponents-patterns.html">← Return to Lesson 02</a><script>(()=>{'use strict';const tasks=[["What is 7⁰?",1,"Any nonzero base raised to the zero power is 1."],["What is 2⁻³?",0.125,"2⁻³ = 1/2³ = 1/8 = 0.125."],["What is 10⁻²?",0.01,"10⁻² = 1/100 = 0.01."],["What is 4⁻¹?",0.25,"4⁻¹ = 1/4 = 0.25."],["What is 3⁻²? Enter a decimal rounded to 6 places.",0.111111,"3⁻² = 1/9 ≈ 0.111111."],["What is 5⁰ + 2⁰?",2,"Each nonzero base to the zero power is 1; 1 + 1 = 2."],["What is 2⁻¹ + 2⁻¹?",1,"1/2 + 1/2 = 1."],["What is (−2)⁻²?",0.25,"(−2)⁻² = 1/(−2)² = 1/4."],["What is 10⁻³?",0.001,"10⁻³ = 1/1000 = 0.001."],["What is 2³ × 2⁻³?",1,"2³ × 2⁻³ = 2⁰ = 1."]];let i=0,score=0,answered=false;const $=id=>document.getElementById(id);function show(){answered=false;$('counter').textContent='Question '+(i+1)+' of '+tasks.length;$('progress').value=i;$('question').textContent=tasks[i][0];$('answer').value='';$('answer').disabled=false;$('check').disabled=false;$('form').hidden=false;$('feedback').textContent='';$('next').hidden=true;$('answer').focus()}$('form').addEventListener('submit',e=>{e.preventDefault();if(answered||$('answer').value.trim()==='')return;answered=true;const ok=Math.abs(Number($('answer').value)-tasks[i][1])<0.000001;if(ok)score++;$('feedback').textContent=(ok?'Correct! ':'Not quite. Correct answer: '+tasks[i][1]+'. ')+tasks[i][2];$('answer').disabled=true;$('check').disabled=true;$('next').hidden=false;$('next').textContent=i===tasks.length-1?'See results →':'Next →'});$('next').addEventListener('click',()=>{i++;if(i<tasks.length){show();return}$('progress').value=tasks.length;$('counter').textContent='Completed';$('question').textContent='Your results';$('form').hidden=true;$('next').hidden=true;$('feedback').textContent='Score: '+score+'/'+tasks.length+' ('+Math.round(score/tasks.length*100)+'%). Review explanations and replay to practice.';const b=document.createElement('button');b.textContent='Play again';b.addEventListener('click',()=>{i=0;score=0;$('finish').replaceChildren();show()});$('finish').replaceChildren(b)});show()})();</script></main><script src="https://vervenveda.com/Khaemenes_High.github.io/assets/vnv-beta-link.js" defer data-khaemenes-student-toolbar="v1.8"></script>
</body></html>
