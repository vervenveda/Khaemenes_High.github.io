<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Percent Rate & Whole Detective · Unit 05 Lesson 03</title><style>:root{font-family:system-ui,sans-serif;color:#30291f;background:#f7f0e3}*{box-sizing:border-box}body{margin:0}main{max-width:820px;margin:auto;padding:24px 18px 70px}h1,h2{font-weight:500}.card{background:#fffdf8;border:1px solid #c7b69a;border-radius:7px;padding:22px;margin:20px 0}button,input,.button{font:inherit;border:1px solid #8c7656;border-radius:7px;padding:12px;background:#fffdf8;color:#30291f}button,.button{cursor:pointer}button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid #20638d;outline-offset:3px}input{max-width:200px;width:100%}.button{display:inline-block;text-decoration:none}progress{width:100%;height:18px}#feedback{min-height:3em}</style></head><body><main><p>Pre-Algebra · Unit 05 · Lesson 03</p><h1>Percent Rate & Whole Detective</h1><p>Find the missing rate or whole. For “what percent,” divide part by whole and multiply by 100. For a missing whole, divide the part by the percent written as a decimal. Enter numbers only (no percent symbol).</p><section class="card"><p id="counter" aria-live="polite"></p><progress id="progress" max="10" value="0"></progress><p id="savedRecord" aria-live="polite"></p><h2 id="question"></h2><form id="form"><label for="answer">Your answer (number)</label><p><input id="answer" type="number" step="any" required autocomplete="off"> <button id="check" type="submit">Check answer</button></p></form><p id="feedback" role="status" aria-live="polite"></p><button id="next" type="button" hidden>Next →</button><div id="finish"></div></section><a class="button" href="../../../pre-algebra/units/unit-05/lessons/lesson-03-finding-percent-rate-or-whole.html">← Return to Lesson 03</a><script>(()=>{'use strict';const tasks=[["18 is what percent of 60?",30,"18 ÷ 60 × 100 = 30%."],["12 is 20% of what number?",60,"12 ÷ 0.20 = 60."],["45 is what percent of 90?",50,"45 ÷ 90 × 100 = 50%."],["7 is 10% of what number?",70,"7 ÷ 0.10 = 70."],["24 is what percent of 80?",30,"24 ÷ 80 × 100 = 30%."],["36 is 60% of what number?",60,"36 ÷ 0.60 = 60."],["9 is what percent of 120?",7.5,"9 ÷ 120 × 100 = 7.5%."],["15 is 25% of what number?",60,"15 ÷ 0.25 = 60."],["84 is what percent of 70?",120,"84 ÷ 70 × 100 = 120%."],["5 is 2.5% of what number?",200,"5 ÷ 0.025 = 200."]];let i=0,score=0,answered=false;const STORAGE_KEY="khae-percent-rate-whole-v1";const $=id=>document.getElementById(id);function readRecord(){try{const v=JSON.parse(localStorage.getItem(STORAGE_KEY)||"null");return v&&typeof v==="object"?{bestPercent:Number(v.bestPercent)||0,attempts:Array.isArray(v.attempts)?v.attempts:[]}:{bestPercent:0,attempts:[]}}catch{return {bestPercent:0,attempts:[]}}}function showSavedRecord(){const r=readRecord();$("savedRecord").textContent=r.attempts.length?"Saved best: "+r.bestPercent+"% · "+r.attempts.length+" completed attempt(s).":"Completed scores save locally in this browser."}function saveResult(percent){try{const r=readRecord();r.bestPercent=Math.max(r.bestPercent,percent);r.attempts.push({percent,score,total:tasks.length,completedAt:new Date().toISOString()});r.attempts=r.attempts.slice(-100);localStorage.setItem(STORAGE_KEY,JSON.stringify(r));showSavedRecord()}catch{$("savedRecord").textContent="Score shown, but local saving is unavailable in this browser."}}function challenge(){i=(i+1)%tasks.length;show()}function show(){answered=false;$('counter').textContent='Question '+(i+1)+' of '+tasks.length;$('progress').value=i;$('question').textContent=tasks[i][0];$('answer').value='';$('answer').disabled=false;$('check').disabled=false;$('form').hidden=false;$('feedback').textContent='';$('next').hidden=true;$('answer').focus()}$('form').addEventListener('submit',e=>{e.preventDefault();if(answered||$('answer').value.trim()==='')return;answered=true;const ok=Math.abs(Number($('answer').value)-tasks[i][1])<0.000001;if(ok)score++;$('feedback').textContent=(ok?'Correct! ':'Correct answer: '+tasks[i][1]+'. ')+tasks[i][2];$('answer').disabled=true;$('check').disabled=true;$('next').hidden=false;$('next').textContent=i===tasks.length-1?'See results →':'Next →'});$('next').addEventListener('click',()=>{i++;if(i<tasks.length){show();return}$('progress').value=tasks.length;$('counter').textContent='Completed';$('question').textContent='Your results';$('form').hidden=true;$('next').hidden=true;$('feedback').textContent='Score: '+score+'/'+tasks.length+' ('+Math.round(score/tasks.length*100)+'%).';saveResult(Math.round(score/tasks.length*100));const b=document.createElement('button');b.textContent='Play again';b.addEventListener('click',()=>{i=0;score=0;$('finish').replaceChildren();show()});$('finish').replaceChildren(b)} );showSavedRecord();show()})();</script></main></body></html>
