</style></head><body><main><p class="kicker">Khaemenes Academy · Geometry · Formative Practice</p><h1>Geometric Probability Lab</h1><p>Use length and area ratios to model probability in continuous geometric settings.</p><section class="card"><p id="counter" class="muted"></p><progress id="progress" max="10" value="0"></progress><p id="saved" class="muted"></p><h2 id="questionTitle"></h2><div id="choices" class="choices"></div><p id="status" class="status" role="status" aria-live="polite">Choose the strongest answer.</p><div class="actions"><button id="check">Check answer</button><button id="next" disabled>Next</button><button id="restart">New round</button><a class="button" href="../../../geometry/units/unit-10/lessons/u10-l06.html">Return to lesson</a></div></section><p class="muted">Formative only. This game cannot award Geometry mastery or unlock course gates.</p></main><script>(()=>{"use strict";const BANK=[["A point is chosen uniformly on a 10-unit segment. Favorable length is 3. Probability is:",["3/10","7/10","3/7","10/3"],0,"Geometric probability is favorable length divided by total length."],["A dart lands uniformly on a 100 cm² board. Target area is 25 cm². Probability is:",["1/2","1/4","3/4","25"],1,"25/100=1/4."],["For uniform geometric probability, the denominator represents:",["favorable measure only","total possible measure","number of vertices","perimeter always"],1,"Use total length, area, or other measure."],["A spinner region covers 60° of a 360° circle. Probability is:",["1/3","1/6","2/3","5/6"],1,"60/360=1/6."],["A square target has side 4 inside a square board with side 8. Probability of target hit is:",["1/2","1/4","1/8","1/16"],1,"Area ratio is 16/64=1/4."],["A point is selected on [0,20]. Probability it lies between 5 and 9 is:",["1/5","1/4","4/15","9/20"],0,"Favorable length is 4; total length is 20."],["Why can area ratios represent probability?",["Uniform location makes equal-area regions equally likely","Area always equals 1","Perimeter determines every probability","Probability ignores scale"],0,"Uniform selection links likelihood to measure."],["A circular target has radius 2 inside a circular board radius 4. Probability is:",["1/2","1/4","1/8","1/16"],1,"Area ratio is 4π/16π=1/4."],["If favorable area doubles while total area stays fixed, probability:",["halves","doubles","stays the same","becomes zero"],1,"The ratio doubles."],["A 12-unit path has a 2-unit unsafe section. Probability a random point lies in it is:",["1/3","1/6","1/12","5/6"],1,"2/12=1/6."],["Geometric probability requires checking that selection is:",["uniform over the modeled region","always discrete","always a coin flip","without units"],0,"Area/length ratios assume uniform selection."],["If favorable area is 18 and total area is 72, probability is:",["1/2","1/3","1/4","3/4"],2,"18/72=1/4."]],KEY="khae-geometric-probability-lab-v1",$=id=>document.getElementById(id);let tasks=[],i=0,score=0,graded=false;function sh(a){a=[...a];for(let n=a.length-1;n>0;n--){const j=Math.floor(Math.random()*(n+1));[a[n],a[j]]=[a[j],a[n]]}return a}function read(){try{return JSON.parse(localStorage.getItem(KEY)||'{"best":0,"attempts":0}')}catch{return{best:0,attempts:0}}}function save(p){try{const r=read();r.best=Math.max(Number(r.best)||0,p);r.attempts=(Number(r.attempts)||0)+1;localStorage.setItem(KEY,JSON.stringify(r))}catch{}}function saved(){const r=read();$("saved").textContent=r.attempts?"Saved best: "+r.best+"% · "+r.attempts+" round(s).":"Scores save locally on this device."}function start(){tasks=sh(BANK).slice(0,10);i=0;score=0;render()}function render(){graded=false;const t=tasks[i];$("counter").textContent="Question "+(i+1)+" of "+tasks.length;$("progress").value=i;$("questionTitle").textContent=t[0];$("choices").replaceChildren();t[1].forEach((c,n)=>{const l=document.createElement("label"),r=document.createElement("input");r.type="radio";r.name="a";r.value=n;l.append(r,document.createTextNode(c));$("choices").append(l)});$("status").textContent="Choose the strongest answer.";$("check").disabled=false;$("next").disabled=true;$("next").textContent=i===tasks.length-1?"See results":"Next";$("check").onclick=()=>{if(graded)return;const x=document.querySelector('input[name="a"]:checked');if(!x){$("status").textContent="Choose an answer first.";return}graded=true;const ok=Number(x.value)===t[2];if(ok)score++;$("status").textContent=(ok?"Correct. ":"Review: ")+t[3];document.querySelectorAll('input[name="a"]').forEach(r=>r.disabled=true);$("check").disabled=true;$("next").disabled=false};$("next").onclick=()=>{if(!graded)return;i++;if(i<tasks.length){render();return}const p=Math.round(score/tasks.length*100);save(p);$("progress").value=tasks.length;$("counter").textContent="Round complete";$("questionTitle").textContent=score+" / "+tasks.length+" correct ("+p+"%)";$("choices").replaceChildren();$("status").textContent=p>=80?"Strong formative result. Official mastery remains separate.":"Review the explanations and retry.";$("check").disabled=true;$("next").disabled=true;saved()};$("restart").onclick=start}saved();start()})();</script></body></html>
