<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Power & Grouping Quest · Pre-Algebra Unit 06 Lesson 01</title><style>:root{font-family:system-ui,sans-serif;color:#30291f;background:#f7f0e3}*{box-sizing:border-box}body{margin:0}main{max-width:840px;margin:auto;padding:24px 18px 70px}h1,h2{font-weight:500}.card{background:#fffdf8;border:1px solid #c7b69a;border-radius:7px;padding:22px;margin:20px 0}button,input,.button{font:inherit;border:1px solid #8c7656;border-radius:7px;padding:12px;background:#fffdf8;color:#30291f}button,.button{cursor:pointer}button:hover,.button:hover{background:#eadfc9}button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid #20638d;outline-offset:3px}input{max-width:220px;width:100%}.button{display:inline-block;text-decoration:none}progress{width:100%;height:18px}#feedback{min-height:3em}</style></head><body><main><p>Pre-Algebra · Unit 06 · Lesson 01</p><h1>Power & Grouping Quest</h1><p>Exponents describe repeated multiplication. Parentheses determine which numbers belong to the base. Watch the difference between <strong>(−2)⁴</strong> and <strong>−2⁴</strong>. Enter a number, including a minus sign when needed.</p><section class="card"><p id="counter" aria-live="polite"></p><progress id="progress" max="10" value="0"></progress><h2 id="question"></h2><form id="form"><label for="answer">Your numerical answer</label><p><input id="answer" type="number" step="any" required autocomplete="off"> <button id="check" type="submit">Check answer</button></p></form><p id="feedback" role="status" aria-live="polite"></p><button id="next" type="button" hidden>Next →</button><div id="finish"></div></section><a class="button" href="../../../pre-algebra/units/unit-06/lessons/lesson-01-exponent-meaning-powers-grouping.html">← Return to Lesson 01</a><script>(()=>{'use strict';const tasks=[["What is 2³?",8,"2 × 2 × 2 = 8."],["What is 5²?",25,"5 × 5 = 25."],["What is 3⁴?",81,"3 × 3 × 3 × 3 = 81."],["What is 10³?",1000,"10 × 10 × 10 = 1,000."],["What is 4³?",64,"4 × 4 × 4 = 64."],["What is (−2)⁴?",16,"Four negative factors multiply to a positive number: 16."],["What is −2⁴ without parentheses?",-16,"Exponentiation happens before the leading negative: −(2⁴) = −16."],["What is (3 + 2)²?",25,"Group first: (3 + 2)² = 5² = 25."],["What is 6² + 2³?",44,"6² = 36 and 2³ = 8; total = 44."],["What is (2 × 3)³?",216,"2 × 3 = 6, then 6³ = 216."]];let i=0,score=0,answered=false;const $=id=>document.getElementById(id);function show(){answered=false;$('counter').textContent='Question '+(i+1)+' of '+tasks.length;$('progress').value=i;$('question').textContent=tasks[i][0];$('answer').value='';$('answer').disabled=false;$('check').disabled=false;$('form').hidden=false;$('feedback').textContent='';$('next').hidden=true;$('answer').focus()}$('form').addEventListener('submit',e=>{e.preventDefault();if(answered||$('answer').value.trim()==='')return;answered=true;const ok=Math.abs(Number($('answer').value)-tasks[i][1])<0.000001;if(ok)score++;$('feedback').textContent=(ok?'Correct! ':'Not quite. Correct answer: '+tasks[i][1]+'. ')+tasks[i][2];$('answer').disabled=true;$('check').disabled=true;$('next').hidden=false;$('next').textContent=i===tasks.length-1?'See results →':'Next →'});$('next').addEventListener('click',()=>{i++;if(i<tasks.length){show();return}$('progress').value=tasks.length;$('counter').textContent='Completed';$('question').textContent='Your results';$('form').hidden=true;$('next').hidden=true;$('feedback').textContent='Score: '+score+'/'+tasks.length+' ('+Math.round(score/tasks.length*100)+'%). Review explanations and replay to practice.';const b=document.createElement('button');b.textContent='Play again';b.addEventListener('click',()=>{i=0;score=0;$('finish').replaceChildren();show()});$('finish').replaceChildren(b)});show()})();</script></main><script src="https://vervenveda.com/Khaemenes_High.github.io/assets/vnv-beta-link.js" defer data-khaemenes-student-toolbar="v1.8"></script>
