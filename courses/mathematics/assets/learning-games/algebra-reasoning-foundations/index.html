<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Algebra Reasoning Foundations · Khaemenes Academy</title><style>:root{font:17px/1.6 system-ui,Arial;color:#29241e;background:#f6eee2}*{box-sizing:border-box}main{max-width:820px;margin:auto;padding:24px}h1{font:normal clamp(28px,5vw,40px)/1.3 Georgia,serif}.card{background:#fffdfa;border:1px solid #cab798;border-radius:7px;padding:22px}button,a{font:inherit;padding:9px 12px;border:1px solid #8c785c;border-radius:7px;background:#fff7e7;color:#29241e;text-decoration:none;cursor:pointer;margin:3px}button:disabled{opacity:.55}button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid #246b9d;outline-offset:3px}label{display:flex;gap:12px;margin:9px 0;padding:9px;border:1px solid #d7c8b1;border-radius:7px}input{margin-top:8px;flex:none}#feedback{border-left:3px solid #8c785c;padding:10px;min-height:55px}fieldset{border:1px solid #cab798;border-radius:7px}</style></head><body><main><p><a href="../../../algebra-1/instructional-repair-pack/resource-studio/index.html">← Resource Studio</a></p><h1>Algebra Reasoning Foundations</h1><p>Unit 01 · Four short reasoning challenges. Optional practice only; no official grades, progression unlocks or saved student data.</p><section class="card"><h2 id="gameQuestion"></h2><fieldset><legend>Select one answer</legend><div id="gameChoices"></div></fieldset><p id="feedback" role="status" aria-live="polite" aria-atomic="true"></p><button id="check" type="button">Check</button> <button id="next" type="button" disabled>Next</button> <button id="restart" type="button">Restart</button></section></main><script>"use strict";
const $=id=>document.getElementById(id);
const bank=[{q:"Which statement is justified for all real x by the distributive property?",choices:["3(x+2)=3x+2","3(x+2)=3x+6","3(x+2)=x+6"],correct:1,why:"The factor 3 multiplies every term inside the parentheses."},{q:"Which interval describes -3 < x ≤ 2?",choices:["[-3,2]","(-3,2]","(-3,2)"],correct:1,why:"The left endpoint is excluded; the right is included."},{q:"A speed of 54 km/h equals how many m/s?",choices:["15 m/s","54 m/s","150 m/s"],correct:0,why:"54 × 1000/3600 = 15, and units cancel to m/s."},{q:"Readings are nearly identical but far from the accepted reference. Which description fits?",choices:["Accurate and imprecise","Repeatable but inaccurate","Both accurate and repeatable"],correct:1,why:"Close agreement among readings shows repeatability, not necessarily accuracy."}];let idx=0,score=0,checked=false;function render(){checked=false;$("gameQuestion").textContent="Question "+(idx+1)+" of "+bank.length+": "+bank[idx].q;$("gameChoices").replaceChildren();bank[idx].choices.forEach((answer,i)=>{const label=document.createElement("label"),input=document.createElement("input");input.type="radio";input.name="answer";input.value=String(i);label.append(input,document.createTextNode(answer));$("gameChoices").append(label)});$("feedback").textContent="";$("check").disabled=false;$("next").disabled=true;$("next").textContent=idx===bank.length-1?"See result":"Next"}$("check").addEventListener("click",()=>{if(checked)return;const selected=document.querySelector('input[name="answer"]:checked');if(!selected){$("feedback").textContent="Select an answer before checking.";return}checked=true;const ok=Number(selected.value)===bank[idx].correct;if(ok)score++;$("feedback").textContent=(ok?"Correct. ":"Review: ")+bank[idx].why;document.querySelectorAll('input[name="answer"]').forEach(x=>x.disabled=true);$("check").disabled=true;$("next").disabled=false});$("next").addEventListener("click",()=>{idx++;if(idx<bank.length){render();return}$("gameQuestion").textContent="Round complete";$("gameChoices").replaceChildren();$("feedback").textContent="You answered "+score+" of "+bank.length+" correctly. This is practice only, not a mastery result.";$("next").disabled=true;$("check").disabled=true});$("restart").addEventListener("click",()=>{idx=0;score=0;render()});render();
</script></body></html>
