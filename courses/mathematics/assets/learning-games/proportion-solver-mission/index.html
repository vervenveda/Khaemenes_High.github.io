<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Proportion Solver Mission</title><style>body{font:16px system-ui,sans-serif;background:#f8f1e5;color:#30291f;margin:0;padding:20px}main{max-width:720px;margin:auto}h1{font-weight:500}.card{border:1px solid #c4b293;border-radius:7px;background:#fffdf8;padding:20px}input,button{font:inherit;padding:12px;border:1px solid #776348;border-radius:7px;background:white}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #24729c}progress{width:100%}#feedback{min-height:3em}</style></head><body><main><h1>Proportion Solver Mission</h1><p>Solve equivalent ratios and direct-variation problems. Enter numbers only. Use cross products or a constant of proportionality, and check units.</p><section class="card"><p id="count"></p><progress id="progress" max="10" value="0"></progress><h2 id="question"></h2><form id="form"><label for="answer">Numerical answer</label><p><input id="answer" type="number" step="any" required> <button id="check" type="submit">Check</button></p></form><p id="feedback" role="status" aria-live="polite"></p><button id="next" type="button" hidden>Next →</button><div id="finish"></div></section><p><a href="../../../pre-algebra/units/unit-04/lessons/lesson-05-solving-proportions-direct-variation.html">← Back to Lesson 05</a></p></main><script>(()=>{'use strict';const tasks=[["If 3/5 = x/20, what is x?",12,"Multiply 20 × 3 ÷ 5 = 12."],["If 4/7 = 12/x, what is x?",21,"4x = 7 × 12 = 84, so x = 21."],["A recipe uses 2 cups for 5 servings. How many cups for 15 servings?",6,"15 ÷ 5 = 3 batches; 2 × 3 = 6 cups."],["If y = 4x, what is y when x = 7?",28,"y = 4 × 7 = 28."],["If y = 3x and y = 45, what is x?",15,"x = 45 ÷ 3 = 15."],["A car travels 90 miles in 2 hours at a constant speed. How many miles in 6 hours?",270,"90 ÷ 2 = 45 miles/hour; 45 × 6 = 270."],["If 8/12 = x/18, what is x?",12,"x = 18 × 8 ÷ 12 = 12."],["A scale model has 3 cm for every 12 m. How many meters does 8 cm represent?",32,"12 ÷ 3 = 4 m per cm; 8 × 4 = 32 m."],["If y = kx, and y = 24 when x = 6, what is k?",4,"k = y ÷ x = 24 ÷ 6 = 4."],["If 5/8 = 25/x, what is x?",40,"5x = 8 × 25 = 200; x = 40."]];let i=0,score=0,answered=false;const $=id=>document.getElementById(id);function show(){answered=false;$('count').textContent='Question '+(i+1)+' of '+tasks.length;$('progress').value=i;$('question').textContent=tasks[i][0];$('answer').value='';$('answer').disabled=false;$('check').disabled=false;$('form').hidden=false;$('feedback').textContent='';$('next').hidden=true}$('form').addEventListener('submit',e=>{e.preventDefault();if(answered||$('answer').value.trim()==='')return;answered=true;const ok=Math.abs(Number($('answer').value)-tasks[i][1])<0.000001;if(ok)score++;$('feedback').textContent=(ok?'Correct! ':'Try reviewing this: Correct answer '+tasks[i][1]+'. ')+tasks[i][2];$('answer').disabled=true;$('check').disabled=true;$('next').hidden=false;$('next').textContent=i===tasks.length-1?'See results':'Next →'});$('next').addEventListener('click',()=>{i++;if(i<tasks.length){show();return}$('progress').value=tasks.length;$('count').textContent='Completed';$('question').textContent='Your results';$('form').hidden=true;$('next').hidden=true;$('feedback').textContent='Score: '+score+'/'+tasks.length+'. Review the explanations and try again.';const b=document.createElement('button');b.textContent='Play again';b.addEventListener('click',()=>{i=0;score=0;$('finish').replaceChildren();show()});$('finish').replaceChildren(b)});show()})();</script></body></html>
