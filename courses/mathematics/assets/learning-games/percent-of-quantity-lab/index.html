er').focus()}$('answerForm').addEventListener('submit',e=>{e.preventDefault();if(answered)return;const value=$('answer').value;if(value.trim()==='')return;answered=true;const ok=Math.abs(Number(value)-tasks[i].a)<0.000001;if(ok)score++;$('feedback').textContent=(ok?'Correct! ':'Not quite. Correct answer: '+tasks[i].a+'. ')+tasks[i].why;$('answer').disabled=true;$('check').disabled=true;$('next').hidden=false;$('next').textContent=i===tasks.length-1?'See results →':'Next question →'});$('next').addEventListener('click',()=>{i++;if(i<tasks.length)return show();$('progress').value=tasks.length;$('counter').textContent='Completed';$('question').textContent='Your results';$('answerForm').hidden=true;$('next').hidden=true;$('feedback').textContent='Score: '+score+'/'+tasks.length+' ('+Math.round(score/tasks.length*100)+'%). Review explanations and try again.';saveResult(Math.round(score/tasks.length*100));const b=document.createElement('button');b.textContent='Play again';b.addEventListener('click',()=>{i=0;score=0;b.remove();show()});$('finish').hidden=false;$('finish').replaceChildren(b)} );showSavedRecord();show()})();</script></main><script src="https://vervenveda.com/Khaemenes_High.github.io/assets/vnv-beta-link.js" defer data-khaemenes-student-toolbar="v1.8"></script>
