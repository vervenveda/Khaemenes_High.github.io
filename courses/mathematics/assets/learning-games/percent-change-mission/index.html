<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Percent Change Mission · Pre-Algebra Unit 05 Lesson 04</title><style>:root{font-family:system-ui,sans-serif;color:#30291f;background:#f7f0e3}*{box-sizing:border-box}body{margin:0}main{max-width:820px;margin:auto;padding:24px 18px 70px}h1,h2{font-weight:500}.card{background:#fffdf8;border:1px solid #c7b69a;border-radius:7px;padding:22px;margin:20px 0}button,input,.button{font:inherit;border:1px solid #8c7656;border-radius:7px;padding:12px;background:#fffdf8;color:#30291f}button,.button{cursor:pointer}button:hover,.button:hover{background:#eadfc9}button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid #20638d;outline-offset:3px}input{max-width:200px;width:100%}.button{display:inline-block;text-decoration:none}progress{width:100%;height:18px}#feedback{min-height:3em}</style></head><body><main><p>Pre-Algebra · Unit 05 · Lesson 04</p><h1>Percent Change Mission</h1><p>Compare the change with the <strong>original</strong> amount. Percent change = (difference ÷ original) × 100. Read each question carefully: some ask for a percentage, others ask for a new price in dollars. Enter numbers only.</p><section class="card"><p id="counter" aria-live="polite"></p><progress id="progress" max="10" value="0"></progress><h2 id="question"></h2><form id="form"><label for="answer">Your numerical answer</label><p><input id="answer" type="number" step="any" required autocomplete="off"> <button id="check" type="submit">Check answer</button></p></form><p id="feedback" role="status" aria-live="polite"></p><button id="next" type="button" hidden>Next →</button><div id="finish"></div></section><a class="button" href="../../../pre-algebra/units/unit-05/lessons/lesson-04-percent-increase-decrease-relative-change.html">← Return to Lesson 04</a><script>(()=>{'use strict';const tasks=[["A price rises from $50 to $60. What is the percent increase?",20,"(60 − 50) ÷ 50 × 100 = 20%."],["A jacket falls from $80 to $60. What is the percent decrease?",25,"(80 − 60) ÷ 80 × 100 = 25%."],["Enrollment grows from 120 to 150. What is the percent increase?",25,"(150 − 120) ÷ 120 × 100 = 25%."],["A population drops from 200 to 170. What is the percent decrease?",15,"(200 − 170) ÷ 200 × 100 = 15%."],["A $40 item increases by 10%. What is the new price in dollars?",44,"40 × 1.10 = 44."],["A $90 item decreases by 20%. What is the new price in dollars?",72,"90 × 0.80 = 72."],["A value changes from 25 to 30. What is its percent increase?",20,"(30 − 25) ÷ 25 × 100 = 20%."],["A value changes from 60 to 45. What is its percent decrease?",25,"(60 − 45) ÷ 60 × 100 = 25%."],["A $100 price rises by 20% then falls by 20%. What is the final price in dollars?",96,"100 × 1.20 × 0.80 = 96. The changes do not cancel."],["A quantity changes from 80 to 100. What is its percent increase?",25,"(100 − 80) ÷ 80 × 100 = 25%."]];let i=0,score=0,answered=false;const $=id=>document.getElementById(id);function show(){answered=false;$('counter').textContent='Question '+(i+1)+' of '+tasks.length;$('progress').value=i;$('question').textContent=tasks[i][0];$('answer').value='';$('answer').disabled=false;$('check').disabled=false;$('form').hidden=false;$('feedback').textContent='';$('next').hidden=true;$('answer').focus()}$('form').addEventListener('submit',e=>{e.preventDefault();if(answered||$('answer').value.trim()==='')return;answered=true;const ok=Math.abs(Number($('answer').value)-tasks[i][1])<0.000001;if(ok)score++;$('feedback').textContent=(ok?'Correct! ':'Not quite. Correct answer: '+tasks[i][1]+'. ')+tasks[i][2];$('answer').disabled=true;$('check').disabled=true;$('next').hidden=false;$('next').textContent=i===tasks.length-1?'See results →':'Next →'});$('next').addEventListener('click',()=>{i++;if(i<tasks.length){show();return}$('progress').value=tasks.length;$('counter').textContent='Completed';$('question').textContent='Your results';$('form').hidden=true;$('next').hidden=true;$('feedback').textContent='Score: '+score+'/'+tasks.length+' ('+Math.round(score/tasks.length*100)+'%). Review the explanations and play again to strengthen your reasoning.';const b=document.createElement('button');b.textContent='Play again';b.addEventListener('click',()=>{i=0;score=0;$('finish').replaceChildren();show()});$('finish').replaceChildren(b)});show()})();</script></main></body></html>
