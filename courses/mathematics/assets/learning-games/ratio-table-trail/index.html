<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ratio Table Trail · Unit 04 Lesson 02</title><style>:root{font-family:system-ui,sans-serif;color:#30291f;background:#f7f0e3}*{box-sizing:border-box}body{margin:0}main{max-width:840px;margin:auto;padding:24px 18px 70px}h1,h2{font-weight:500}.card{background:#fffdf8;border:1px solid #c7b69a;border-radius:7px;padding:22px;margin:20px 0}button,input,.button{font:inherit;border:1px solid #8c7656;border-radius:7px;padding:12px;background:#fffdf8;color:#30291f}button,.button{cursor:pointer}button:hover,.button:hover{background:#eadfc9}button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid #20638d;outline-offset:3px}input{max-width:220px;width:100%}.button{display:inline-block;text-decoration:none}progress{width:100%;height:18px}#feedback{min-height:3em}</style></head><body><main><p>Pre-Algebra · Unit 04 · Lesson 02</p><h1>Ratio Table Trail</h1><p>Use equivalent ratios, ratio tables, and double number lines to solve 10 proportional reasoning challenges. Enter numbers only. To solve, find the scale factor or unit rate, then apply it to both quantities.</p><section class="card"><p id="counter" aria-live="polite"></p><progress id="progress" max="10" value="0"></progress><p id="savedRecord" aria-live="polite"></p><h2 id="question"></h2><form id="form"><label for="answer">Your numerical answer</label><p><input id="answer" type="number" step="any" required autocomplete="off"> <button id="check" type="submit">Check answer</button></p></form><p id="feedback" role="status" aria-live="polite"></p><button id="next" type="button" hidden>Next →</button><div id="finish"></div></section><a class="button" href="../../../pre-algebra/units/unit-04/lessons/lesson-02-ratio-tables-double-number-lines.html">← Return to Lesson 02</a><script>(()=>{'use strict';const tasks=[["A ratio table has 2 cups of juice for 5 cups of water. How many cups of water for 6 cups of juice?",15,"Multiply both parts of 2:5 by 3 to get 6:15."],["A recipe uses 3 eggs for 12 muffins. How many muffins for 5 eggs at the same rate?",20,"12 ÷ 3 = 4 muffins per egg; 5 × 4 = 20."],["A double number line shows 4 miles correspond to 12 minutes. How many minutes for 10 miles?",30,"12 ÷ 4 = 3 minutes per mile; 10 × 3 = 30."],["A ratio table shows 5 pencils cost $10. What is the cost of 8 pencils in dollars?",16,"$10 ÷ 5 = $2 per pencil; 8 × 2 = $16."],["Two quantities have ratio 3:7. If the first is 12, what is the second?",28,"12 ÷ 3 = 4; 7 × 4 = 28."],["A line pairs 0, 2, 4, 6 kilometers with 0, 8, 16, 24 minutes. How many minutes for 9 kilometers?",36,"8 ÷ 2 = 4 minutes per kilometer; 9 × 4 = 36."],["A ratio table has 6 red beads for 9 blue beads. How many blue beads for 10 red beads?",15,"The ratio 6:9 simplifies to 2:3; 10 red requires 15 blue."],["A map uses 1 centimeter for 4 kilometers. How many kilometers do 7 centimeters represent?",28,"7 × 4 = 28 kilometers."],["At a constant rate, 8 pages take 12 minutes to read. How many minutes for 20 pages?",30,"12 ÷ 8 = 1.5 minutes per page; 20 × 1.5 = 30."],["A ratio table pairs 4 tickets with $28. How much do 9 tickets cost in dollars?",63,"28 ÷ 4 = $7 per ticket; 9 × 7 = $63."]];let i=0,score=0,answered=false;const STORAGE_KEY="khae-ratio-table-trail-v1";const $=id=>document.getElementById(id);function readRecord(){try{const v=JSON.parse(localStorage.getItem(STORAGE_KEY)||"null");return v&&typeof v==="object"?{bestPercent:Number(v.bestPercent)||0,attempts:Array.isArray(v.attempts)?v.attempts:[]}:{bestPercent:0,attempts:[]}}catch{return {bestPercent:0,attempts:[]}}}function showSavedRecord(){const r=readRecord();$("savedRecord").textContent=r.attempts.length?"Saved best: "+r.bestPercent+"% · "+r.attempts.length+" completed attempt(s).":"Completed scores save locally in this browser."}function saveResult(percent){try{const r=readRecord();r.bestPercent=Math.max(r.bestPercent,percent);r.attempts.push({percent,score,total:tasks.length,completedAt:new Date().toISOString()});r.attempts=r.attempts.slice(-100);localStorage.setItem(STORAGE_KEY,JSON.stringify(r));showSavedRecord()}catch{$("savedRecord").textContent="Score shown, but local saving is unavailable in this browser."}}function challenge(){i=(i+1)%tasks.length;show()}function show(){answered=false;$('counter').textContent='Question '+(i+1)+' of '+tasks.length;$('progress').value=i;$('question').textContent=tasks[i][0];$('answer').value='';$('answer').disabled=false;$('check').disabled=false;$('form').hidden=false;$('feedback').textContent='';$('next').hidden=true;$('answer').focus()}$('form').addEventListener('submit',e=>{e.preventDefault();if(answered||$('answer').value.trim()==='')return;answered=true;const ok=Math.abs(Number($('answer').value)-tasks[i][1])<0.000001;if(ok)score++;$('feedback').textContent=(ok?'Correct! ':'Not quite. Correct answer: '+tasks[i][1]+'. ')+tasks[i][2];$('answer').disabled=true;$('check').disabled=true;$('next').hidden=false;$('next').textContent=i===tasks.length-1?'See results →':'Next →'});$('next').addEventListener('click',()=>{i++;if(i<tasks.length){show();return}$('progress').value=tasks.length;$('counter').textContent='Completed';$('question').textContent='Your results';$('form').hidden=true;$('next').hidden=true;$('feedback').textContent='Score: '+score+'/'+tasks.length+' ('+Math.round(score/tasks.length*100)+'%). Review the worked explanations and replay.';saveResult(Math.round(score/tasks.length*100));const b=document.createElement('button');b.textContent='Play again';b.addEventListener('click',()=>{i=0;score=0;$('finish').replaceChildren();show()});$('finish').replaceChildren(b)} );showSavedRecord();show()})();</script></main></body></html>
