<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Khaemenes Academy — Question & Evidence Studio</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f1e7;color:#242c32;font:400 17px/1.6 system-ui,sans-serif}main{max-width:850px;margin:auto;padding:20px}h1,h2{font-family:Georgia,serif;font-weight:400}input,select,textarea,button{width:100%;font:inherit;padding:10px;border:1px solid #8b938e;border-radius:7px;background:white;color:inherit}textarea{min-height:84px}label{display:block;margin:14px 0 5px}.panel{background:white;border:1px solid #c9c0b2;border-radius:7px;padding:18px;margin:16px 0}button{cursor:pointer;background:#245f60;color:white;margin-top:12px}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #bf8e35}#result{white-space:pre-wrap}@media print{button,.no-print{display:none}main{padding:0}.panel{break-inside:avoid}}</style></head><body><main><p><a href="lessons/day-01.html">← Unit 01 · Day 01</a></p><h1>Khaemenes Academy</h1><h2>Grade 9 · Science · Unit 01 · Lesson 01</h2><p>Question & Evidence Studio · Original offline scientific inquiry tool</p><div class="panel"><label for="student">Student name</label><input id="student" autocomplete="off"><label for="date">Date</label><input id="date" type="date"><label for="phenomenon">Observed phenomenon</label><textarea id="phenomenon" placeholder="What happens? Describe only what you observe."></textarea><label for="variable">Measurable outcome and units</label><textarea id="variable" placeholder="What quantity can be measured, and in what units?"></textarea><label for="question">Investigable question</label><textarea id="question" placeholder="How does ... affect ... under ...?"></textarea><label for="method">Evidence pathway</label><select id="method"><option>Controlled experiment</option><option>Observation or field study</option><option>Existing dataset</option><option>Historical records</option><option>Model or simulation</option></select><label for="limit">One limitation or alternative explanation</label><textarea id="limit"></textarea><button id="check">Check investigation plan</button><p id="result" role="status" aria-live="polite"></p></div><p>Practice feedback is formative only. This tool does not award verified mastery or change the course record.</p><button class="no-print" onclick="print()">Print evidence sheet</button></main><script>document.getElementById("check").addEventListener("click",()=>{const names=["phenomenon","variable","question","limit"];const missing=names.filter(id=>document.getElementById(id).value.trim().length<12);document.getElementById("result").textContent=missing.length?"Revise these fields with specific scientific details: "+missing.join(", ")+".":"Your draft has all four evidence components. Ask whether another student can reproduce the measurement and whether your conclusion avoids unsupported causation. Educator review is still required.";});</script></body></html>
