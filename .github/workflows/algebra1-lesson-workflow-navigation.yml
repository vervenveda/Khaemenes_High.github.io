name: Algebra I Lesson Workflow Navigation
on:
  push:
    branches: [main]
    paths:
      - "courses/mathematics/assets/course-lesson-workflow-v1.js"
      - "courses/mathematics/assets/course-lesson-workflow-v1.css"
      - "courses/mathematics/algebra-1/assets/algebra1-workflow-adapter-v1.js"
      - "courses/mathematics/algebra-1/units/**/lessons/*.html"
      - "courses/mathematics/algebra-1/tests/lesson-workflow-navigation-regression.mjs"
      - ".github/workflows/algebra1-lesson-workflow-navigation.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-stage-navigation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check all Algebra I workflow cards and lesson loader coverage
        run: node courses/mathematics/algebra-1/tests/lesson-workflow-navigation-regression.mjs
