name: High School Record and Route Validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check all public page dependencies and routes
        run: python3 tools/validate-sitewide-routes.py
      - name: Verify grade-aware High School routes and Higher Learning handoffs
        run: node tools/test-high-navigation-routes.mjs
      - name: Verify local ecosystem menu interactions and learner switching
        run: node tools/test-high-navigation-menu.mjs
      - name: Verify learner isolation, ownership recovery and direct math routes
        run: node scripts/validate_learner_scoped_persistence.mjs
      - name: Verify learner-owned course pins and language selections
        run: node tools/test-high-course-pins.mjs

      - name: Verify English records, scores and recovery
        run: node tools/test-upper-english-records.mjs
      - name: Verify offline cache ownership
        run: node tools/test-offline-cache-ownership.mjs
      - name: Verify canonical mathematics games are offline-ready
        run: node tools/test-math-game-offline-cache.mjs
      - name: Verify correct-course offline routing and read-only lesson recovery
        run: node tools/test-course-aware-offline-recovery.mjs
      - name: Verify Algebra II lesson note drafts, recovery and concurrent tab safety
        run: node tools/test-algebra2-note-preservation.mjs
      - name: Validate three-course mathematics visual continuity
        run: node tools/test-math-course-visual-continuity.mjs
      - name: Verify Grade 9 English and Science parchment consistency
        run: node tools/test-grade09-visual-consistency.mjs
