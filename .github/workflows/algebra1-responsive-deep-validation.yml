name: Algebra I Responsive + Deep Lesson Validation

on:
  pull_request:
    paths:
      - 'courses/mathematics/algebra-1/**'
      - 'courses/mathematics/geometry/assets/styles.css'
      - 'courses/mathematics/algebra-2/assets/styles.css'
      - 'assets/math-course-visual-unifier.css'
      - 'assets/MATHEMATICS-DESIGN-STANDARD.md'
      - 'tools/test-math-visual-standard.mjs'
      - '.github/workflows/algebra1-responsive-deep-validation.yml'
  push:
    branches:
      - main
    paths:
      - 'courses/mathematics/algebra-1/**'
      - 'courses/mathematics/geometry/assets/styles.css'
      - 'courses/mathematics/algebra-2/assets/styles.css'
      - 'assets/math-course-visual-unifier.css'
      - 'assets/MATHEMATICS-DESIGN-STANDARD.md'
      - 'tools/test-math-visual-standard.mjs'
      - '.github/workflows/algebra1-responsive-deep-validation.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Validate responsive and instructional contract
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, sys

          root = Path('courses/mathematics/algebra-1')
          errors = []

          responsive = root/'assets/responsive-layout-v1.css'
          if not responsive.exists():
              errors.append('missing responsive-layout-v1.css')
          else:
              css = responsive.read_text(encoding='utf-8')
              for token in ['max-width:1180px','max-width:900px','max-width:680px','max-width:430px','orientation:landscape','overflow-x:hidden']:
                  if token not in css:
                      errors.append(f'responsive contract missing {token}')

          styles = (root/'assets/styles.css').read_text(encoding='utf-8')
          if '@import url("./responsive-layout-v1.css")' not in styles:
              errors.append('shared styles.css does not import responsive contract')

          authority = (root/'assets/mastery-authority-v1.js').read_text(encoding='utf-8')
          entry = (root/'assets/readiness-entry-gate-v1.js').read_text(encoding='utf-8')
          for name, text in [('mastery authority',authority),('readiness entry gate',entry)]:
              if 'responsive-layout-v1.css' not in text:
                  errors.append(f'{name} does not load responsive contract')

          deep = (root/'assets/deep-lesson-engine-v1.js').read_text(encoding='utf-8')
          for token in ['deep-concept-card','deep-dialog','What the lesson check expects','worked']:
              if token.lower() not in deep.lower():
                  errors.append(f'deep lesson engine missing {token}')

          focused = (root/'assets/focused-assessment-v1.js').read_text(encoding='utf-8')
          for token in ['One problem at a time','focused-assessment-dots','Previous','Next']:
              if token not in focused:
                  errors.append(f'focused assessment engine missing {token}')

          sw = (root/'service-worker.js').read_text(encoding='utf-8')
          for asset in ['responsive-layout-v1.css','readiness-entry-gate-v1.js','deep-lesson-engine-v1.js','lesson-resource-map.js','lesson-resource-bridge-v1.js','focused-assessment-v1.js','applied-mission-studio-v1.js']:
              if asset not in sw:
                  errors.append(f'service worker does not cache {asset}')

          lesson_files = sorted(root.glob('units/unit-*/lessons/*.html'))
          if len(lesson_files) != 87:
              errors.append(f'expected 87 Algebra I lesson pages; found {len(lesson_files)}')
          for path in lesson_files:
              html = path.read_text(encoding='utf-8')
              if not re.search(r'<meta\s+name=["\']viewport["\']', html, re.I):
                  errors.append(f'missing viewport metadata: {path}')

          critical = [root/'index.html', root/'diagnostic/index.html', root/'assessments/weekly-mastery.html', root/'assessments/midterm-units-01-06.html', root/'assessments/final-exam-36-weeks.html']
          for path in critical:
              html = path.read_text(encoding='utf-8')
              if not re.search(r'<meta\s+name=["\']viewport["\']', html, re.I):
                  errors.append(f'missing viewport metadata: {path}')

          if errors:
              print('\n'.join('ERROR: '+x for x in errors))
              sys.exit(1)
          print(f'PASS: responsive/deep lesson contract validated across {len(lesson_files)} lesson pages.')
          PY

      - name: JavaScript syntax
        run: |
          node --check courses/mathematics/algebra-1/assets/mastery-authority-v1.js
          node --check courses/mathematics/algebra-1/assets/readiness-entry-gate-v1.js
          node --check courses/mathematics/algebra-1/assets/deep-lesson-engine-v1.js
          node --check courses/mathematics/algebra-1/assets/focused-assessment-v1.js
          node --check courses/mathematics/algebra-1/assets/applied-mission-studio-v1.js
          node --check courses/mathematics/algebra-1/service-worker.js

      - name: Validate Applied Mission Studio
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, sys
          root=Path('courses/mathematics/algebra-1')
          engine=(root/'assets/applied-mission-studio-v1.js').read_text(encoding='utf-8')
          errors=[]
          for token in ['khaemenes-algebra1-applied-missions-v1','khaemenes-algebra1-applied-mission-portfolio-v1','course_progression_authority:false','Applied Mission Studio','Add to Algebra I Portfolio','Export Sealed Evidence']:
              if token not in engine: errors.append('mission engine missing '+token)
          if engine.count('missions') < 13: errors.append('mission engine does not expose the full unit mission catalog')
          loader=(root/'assets/unit-page.js').read_text(encoding='utf-8')
          if 'ref.type==="project"&&unit!==13' not in loader or 'applied-mission-studio-v1.js' not in loader:
              errors.append('project loader does not preserve Unit 13 while enabling Units 01–12 mission studio')
          bridge=(root/'assets/lesson-resource-bridge-v1.js').read_text(encoding='utf-8')
          if '?from=' not in bridge: errors.append('Applied Connection does not preserve lesson provenance')
          u1=(root/'units/unit-01/projects/precision-measurement-audit.html').read_text(encoding='utf-8')
          if 'window.PAGE_REF={"type":"project","unit":1' not in u1 or 'assets/unit-page.js' not in u1:
              errors.append('Unit 01 project is not on the shared mission renderer')
          if errors:
              print('\n'.join('ERROR: '+x for x in errors));sys.exit(1)
          print('PASS: Algebra I Applied Mission Studio contract.')
          PY

      - name: Verify Algebra I access, reader preservation and loader recovery
        run: |
          node --check courses/shared/math-entry-gate.js
          node --check courses/mathematics/algebra-1/assets/unit-page.js
          node courses/mathematics/algebra-1/tools/test-student-access-recovery.mjs

      - name: Verify Algebra I lesson games, tools, and video safeguards
        run: |
          node --check courses/mathematics/algebra-1/assets/algebra1-lesson-companions-v1.js
          node courses/mathematics/algebra-1/tools/test-canonical-lesson-companions-v1.mjs

      - name: Verify immutable attempts in Algebra I Units 02–09
        run: |
          node courses/mathematics/algebra-1/tools/test-locked-retakes-units02-09.mjs

      - name: Verify Units 01–03 offline lesson dependencies and routes
        run: |
          node courses/mathematics/algebra-1/tools/test-units01-03-offline-routes.mjs

      - name: Verify lesson reading and draft recovery
        run: node courses/mathematics/algebra-1/tools/test-lesson-reading-drafts.mjs

      - name: Verify authored foundation lessons
        run: node courses/mathematics/algebra-1/tools/test-foundation-lessons.mjs

      - name: Verify inequalities, functions and linear-model lessons
        run: node courses/mathematics/algebra-1/tools/test-middle-lessons.mjs

      - name: Validate authored systems, exponents and polynomials
        run: node courses/mathematics/algebra-1/tools/test-advanced-lessons.mjs

      - name: Verify complete Units 10–13 authored lessons
        run: node courses/mathematics/algebra-1/tools/test-complete-course-lessons.mjs

      - name: Verify standalone Algebra I Resource Studio
        run: node courses/mathematics/algebra-1/tools/test-resource-studio.mjs

      - name: Verify shared mathematics design standard
        run: node tools/test-math-visual-standard.mjs
