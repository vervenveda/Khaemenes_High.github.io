name: Grade 09 Standalone Schedule Route
on:
  pull_request:
    paths:
      - "grades/grade-09/student-profile/dashboard-layout.js"
      - "grades/grade-09/student-profile/index.html"
      - "tools/validate-grade09-schedule-page-route.mjs"
      - ".github/workflows/grade09-schedule-page-route.yml"
  push:
    paths:
      - "grades/grade-09/student-profile/dashboard-layout.js"
      - "grades/grade-09/student-profile/index.html"
      - "tools/validate-grade09-schedule-page-route.mjs"
      - ".github/workflows/grade09-schedule-page-route.yml"
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify standalone schedule and no Grade 9 modal
        run: node tools/validate-grade09-schedule-page-route.mjs
