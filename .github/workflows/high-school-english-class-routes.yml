name: High School English Class Route Integrity
on:
  push:
    branches: [main]
    paths:
      - 'courses/language-arts/english-*/index.html'
      - 'courses/shared/high-school-eight-class.js'
      - 'courses/shared/high-school-english-continuation.js'
      - 'grades/shared/grade09-blueprint-upper-grade.js'
      - 'grades/grade-1*/student-profile/index.html'
      - 'tools/test-high-school-english-class-routes.mjs'
      - '.github/workflows/high-school-english-class-routes.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  english-class-routes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check grades/shared/grade09-blueprint-upper-grade.js
      - run: node --check courses/shared/high-school-english-continuation.js
      - run: node tools/test-high-school-english-class-routes.mjs
      - run: node tools/validate-no-page-regulator.mjs
