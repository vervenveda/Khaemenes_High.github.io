name: Physics 12 Week 08 Circular Motion and Friction Validation
on:
  push:
    paths:
      - 'courses/science/physics-engineering-12/weeks/week-08/**'
      - 'courses/science/physics-engineering-12/tools/validate-week08.mjs'
      - 'courses/science/physics-engineering-12/tools/smoke-week08.mjs'
      - '.github/workflows/physics12-week08-validation.yml'
  pull_request:
    paths:
      - 'courses/science/physics-engineering-12/weeks/week-08/**'
      - 'courses/science/physics-engineering-12/tools/validate-week08.mjs'
      - 'courses/science/physics-engineering-12/tools/smoke-week08.mjs'
      - '.github/workflows/physics12-week08-validation.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Validate physics explanations, math datasets, lesson links and original student records
        run: node courses/science/physics-engineering-12/tools/validate-week08.mjs
      - name: Smoke test browser local quizzes, friction and circular motion models
        run: node courses/science/physics-engineering-12/tools/smoke-week08.mjs
