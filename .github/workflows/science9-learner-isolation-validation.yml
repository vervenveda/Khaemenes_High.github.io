      - '.github/workflows/science9-learner-isolation-validation.yml'
permissions:
  contents: read
jobs:
  learner-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify learner isolation and mastery
        run: node courses/science/integrated-science-9/tools/test-unit04-learner-scope.mjs
      - name: Verify Unit 01 learner scope
        run: node courses/science/integrated-science-9/tools/validate-unit01-learner-scope.mjs
      - name: Verify Unit 02 learner scope
        run: node courses/science/integrated-science-9/tools/check-unit02-scope.mjs
      - name: Verify Unit 03 learner scope
        run: node courses/science/integrated-science-9/tools/check-unit03-scope.mjs
      - name: Verify cross-unit records and dashboard
        run: node courses/science/integrated-science-9/tools/check-cross-unit-records.mjs
      - name: Verify competing-tab record safeguards
        run: node courses/science/integrated-science-9/tools/check-concurrent-records.mjs
      - name: Exercise two-tab stale-save behavior
        run: node courses/science/integrated-science-9/tools/test-concurrent-save-behavior.mjs
      - name: Verify activity-level concurrency
        run: node courses/science/integrated-science-9/tools/check-activity-concurrency.mjs
      - name: Verify all scored activity stale-save guards
        run: node courses/science/integrated-science-9/tools/check-all-activity-stale-saves.mjs
      - name: Verify Unit 05 progress and mastery safeguards
        run: node courses/science/integrated-science-9/tools/check-unit05-records.mjs
      - name: Verify Unit 06 records and chemistry tools
        run: node courses/science/integrated-science-9/tools/check-unit06-records.mjs
      - name: Verify Unit 07 chemistry records
        run: node courses/science/integrated-science-9/tools/check-unit07-records.mjs
      - name: Verify Unit 08 physics records
        run: node courses/science/integrated-science-9/tools/check-unit08-records.mjs
      - name: Verify Unit 09 electric and wave records
        run: node courses/science/integrated-science-9/tools/check-unit09-records.mjs
      - name: Verify Unit 10 Earth systems learner records
        run: node courses/science/integrated-science-9/tools/check-unit10-records.mjs
      - name: Verify Unit 11 astronomy
        run: node courses/science/integrated-science-9/tools/check-unit11-records.mjs
      - name: Verify Unit 12 capstone records
        run: node courses/science/integrated-science-9/tools/check-unit12-records.mjs
      - name: Verify cross-course readiness and capstone QA
        run: node courses/science/integrated-science-9/tools/check-science9-course-qa.mjs
      - name: Audit Science 9 local resource references
        run: node courses/science/integrated-science-9/tools/audit-local-resource-links.mjs
      - name: Audit science assessment answer-bank structure
        run: node courses/science/integrated-science-9/tools/audit-science9-question-banks.mjs
      - name: Verify balanced Unit 01-03 assessment answer placement
        run: node courses/science/integrated-science-9/tools/check-unit01-03-answer-integrity.mjs
      - name: Verify Unit 04-06 assessment answer placements
        run: node courses/science/integrated-science-9/tools/check-unit04-06-answer-integrity.mjs
      - name: Verify Unit 07-09 assessment content structure
        run: node courses/science/integrated-science-9/tools/check-unit07-09-assessment-quality.mjs
      - name: Verify Unit 10-12 assessment quality
        run: node courses/science/integrated-science-9/tools/check-unit10-12-assessment-quality.mjs
      - name: Verify science runtime syntax
        run: node courses/science/integrated-science-9/tools/validate-course-runtime.mjs
