name: Upper Grade Profile Blueprint Parity
on:
  push:
    paths:
      - "grades/grade-09/student-profile/index.html"
      - "grades/grade-10/student-profile/**"
      - "grades/grade-11/student-profile/**"
      - "grades/grade-12/student-profile/**"
      - "grades/shared/grade09-blueprint-upper-grade.js"
      - "grades/shared/student-achievements-dreams.js"
      - "grades/shared/student-course-progress-bars.js"
      - "grades/shared/student-sticker-box.js"
      - "grades/shared/student-ecosystem-tools.js"
      - "grades/shared/student-learning-journey.js"
      - "grades/shared/upper-grade-explore-parity.js"
      - "courses/shared/high-school-eight-class.js"
      - "tests/upper-grade-profile-blueprint-parity.cjs"
      - ".github/workflows/upper-grade-profile-blueprint-parity.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check upper-grade JavaScript syntax
        run: |
          node --check grades/shared/grade09-blueprint-upper-grade.js
          node --check grades/shared/student-achievements-dreams.js
          node --check grades/shared/student-course-progress-bars.js
          node --check grades/shared/student-sticker-box.js
          node --check grades/shared/student-ecosystem-tools.js
          node --check grades/shared/student-learning-journey.js
          node --check grades/shared/upper-grade-explore-parity.js
          node --check grades/grade-11/student-profile/grade11-look-chooser.js
          node --check grades/grade-12/student-profile/grade12-look-chooser.js
      - name: Verify Grade 09 structural baseline and upper-grade routes
        run: node tests/upper-grade-profile-blueprint-parity.cjs
