name: Science 11 Minimal Landing

on:
  push:
    branches: [main]
    paths:
      - 'courses/science/chemistry-11/index.html'
      - 'courses/science/assets/science-minimal-landing-v1.css'
      - 'courses/science/assets/science-minimal-header-mount-v1.js'
      - 'courses/science/assets/science-landing-class-tools-v1.js'
      - 'tools/validate-science11-minimal-landing.mjs'
      - '.github/workflows/science11-minimal-landing.yml'
  pull_request:
    paths:
      - 'courses/science/chemistry-11/index.html'
      - 'courses/science/assets/science-*'
      - 'tools/validate-science11-minimal-landing.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Science 11 minimal landing contract
        run: node tools/validate-science11-minimal-landing.mjs
      - name: Validate patch formatting
        run: git diff --check
