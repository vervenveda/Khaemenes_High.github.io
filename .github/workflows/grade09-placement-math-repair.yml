name: Grade 09 Placement Mathematics Repair

on:
  push:
    branches:
      - fix/grade09-placement-aware-math-dashboard-20260824
    paths:
      - scripts/apply_grade09_placement_math_dashboard.py
      - scripts/fix_grade09_math_path_precedence.py
      - .github/workflows/grade09-placement-math-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply deterministic dashboard repair
        run: |
          python scripts/apply_grade09_placement_math_dashboard.py
          python scripts/fix_grade09_math_path_precedence.py

      - name: Check JavaScript syntax
        run: |
          node --check grades/grade-09/student-profile/student-course-registry.js
          node --check courses/mathematics/pre-algebra/assets/prealgebra-student-navigation.js

      - name: Validate diff
        run: git diff --check

      - name: Commit repaired student surfaces
        shell: bash
        run: |
          if git diff --quiet -- grades/grade-09/student-profile/index.html grades/grade-09/student-profile/daily-lessons/index.html grades/grade-09/student-profile/student-course-registry.js courses/mathematics/pre-algebra/assets/prealgebra-student-navigation.js; then
            echo "No student-surface changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add grades/grade-09/student-profile/index.html grades/grade-09/student-profile/daily-lessons/index.html grades/grade-09/student-profile/student-course-registry.js courses/mathematics/pre-algebra/assets/prealgebra-student-navigation.js
          git commit -m "Refine Grade 09 mathematics pathway routing"
          git push
