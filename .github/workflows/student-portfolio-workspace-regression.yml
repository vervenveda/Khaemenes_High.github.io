name: Student Portfolio and Homeschool Report
on:
  pull_request:
    paths:
      - "grades/grade-*/student-profile/index.html"
      - "grades/grade-09/student-profile/dashboard-layout.js"
      - "grades/shared/grade09-blueprint-upper-grade.js"
      - "portfolio/**"
      - "tools/validate-student-portfolio-workspace.mjs"
      - "tools/validate-student-portfolio-refresh.mjs"
      - "tools/validate-algebra1-readiness-continuation-publisher.mjs"
      - "courses/shared/algebra1-readiness-continuation-publisher.js"
      - ".github/workflows/student-portfolio-workspace-regression.yml"
  push:
    paths:
      - "grades/grade-*/student-profile/index.html"
      - "grades/grade-09/student-profile/dashboard-layout.js"
      - "grades/shared/grade09-blueprint-upper-grade.js"
      - "portfolio/**"
      - "tools/validate-student-portfolio-workspace.mjs"
      - "tools/validate-student-portfolio-refresh.mjs"
      - "tools/validate-algebra1-readiness-continuation-publisher.mjs"
      - "courses/shared/algebra1-readiness-continuation-publisher.js"
      - ".github/workflows/student-portfolio-workspace-regression.yml"
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate portfolio workspace and learner-scoped homeschool report
        run: |
          node tools/validate-student-portfolio-workspace.mjs
          node tools/validate-student-portfolio-refresh.mjs
          node tools/validate-algebra1-readiness-continuation-publisher.mjs
