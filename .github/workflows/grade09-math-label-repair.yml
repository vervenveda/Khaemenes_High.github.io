name: Grade 09 Mathematics Label Repair

on:
  push:
    branches:
      - fix/grade09-math-placement-labels-20260824
    paths:
      - scripts/repair_grade09_math_labels.py
      - .github/workflows/grade09-math-label-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply deterministic label repair
        run: python scripts/repair_grade09_math_labels.py

      - name: Validate diff
        run: git diff --check

      - name: Commit repaired campus page
        shell: bash
        run: |
          if git diff --quiet -- grades/grade-09/index.html; then
            echo "No campus-page change required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add grades/grade-09/index.html
          git commit -m "Repair Grade 09 mathematics placement labels"
          git push
