name: Grade 12 PE Assessment Diversity
on:
  pull_request:
    paths:
      - "courses/physical-education/grade-12-instruction.json"
      - "tools/validate-pe12-assessment-diversity-v2.mjs"
      - ".github/workflows/pe12-assessment-diversity.yml"
  push:
    branches: [main]
    paths:
      - "courses/physical-education/grade-12-instruction.json"
      - "tools/validate-pe12-assessment-diversity-v2.mjs"
      - ".github/workflows/pe12-assessment-diversity.yml"
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: node tools/validate-pe12-assessment-diversity-v2.mjs
