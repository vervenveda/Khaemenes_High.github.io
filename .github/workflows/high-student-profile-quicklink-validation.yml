name: High School Student Profile Quick Link Validation

on:
  push:
    branches: [ main ]
    paths:
      - 'index.html'
      - 'grades/**/index.html'
      - 'grades/grade-09/student-profile/**'
      - 'grades/shared/upper-grade-seven-class.js'
      - 'grades/shared/upper-grade-profile.css'
      - 'courses/shared/high-school-course-pins.js'
      - 'courses/**/index.html'
      - 'assets/vnv-beta-link.js'
      - 'stos/khaemenes/assets/vnv-beta-link.js'
      - 'courses/shared/course-entry-contract.js'
      - 'tools/validate-high-student-journey.mjs'
      - 'tools/test-high-course-pins.mjs'
      - 'tools/validate-grade09-resume-convenience.mjs'
      - 'tools/validate-grade09-profile-isolation.mjs'
      - 'tools/validate-grade09-schedule-personalization.mjs'
      - 'tools/validate-upper-grade-profile-parity.mjs'
      - 'tools/validate-student-profile-quicklink.mjs'
      - '.github/workflows/high-student-profile-quicklink-validation.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'grades/**/index.html'
      - 'grades/grade-09/student-profile/**'
      - 'grades/shared/upper-grade-seven-class.js'
      - 'grades/shared/upper-grade-profile.css'
      - 'courses/shared/high-school-course-pins.js'
      - 'courses/**/index.html'
      - 'assets/vnv-beta-link.js'
      - 'stos/khaemenes/assets/vnv-beta-link.js'
      - 'courses/shared/course-entry-contract.js'
      - 'tools/validate-high-student-journey.mjs'
      - 'tools/test-high-course-pins.mjs'
      - 'tools/validate-grade09-resume-convenience.mjs'
      - 'tools/validate-grade09-profile-isolation.mjs'
      - 'tools/validate-grade09-schedule-personalization.mjs'
      - 'tools/validate-upper-grade-profile-parity.mjs'
      - 'tools/validate-student-profile-quicklink.mjs'
      - '.github/workflows/high-student-profile-quicklink-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Syntax check shared profile widget
        run: node --check assets/vnv-beta-link.js
      - name: Syntax check High School pin store
        run: node --check courses/shared/high-school-course-pins.js
      - name: Syntax check upper-grade profile engine
        run: node --check grades/shared/upper-grade-seven-class.js
      - name: Syntax check student personalization scripts
        run: |
          node --check grades/grade-09/student-profile/student-quick-pins.js
          node --check grades/grade-09/student-profile/student-schedule-bar.js
          node --check grades/grade-09/student-profile/student-profile-preferences.js
          node --check grades/grade-09/student-profile/seven-class-schedule.js
      - name: Validate profile quick-link coverage
        run: node tools/validate-student-profile-quicklink.mjs
      - name: Validate end-to-end High School student journey
        run: node tools/validate-high-student-journey.mjs
      - name: Validate learner-scoped High School pins
        run: node tools/test-high-course-pins.mjs
      - name: Validate Grade 09 profile isolation
        run: node tools/validate-grade09-profile-isolation.mjs
      - name: Validate Grade 09 schedule personalization
        run: node tools/validate-grade09-schedule-personalization.mjs
      - name: Validate Grade 09 resume convenience
        run: node tools/validate-grade09-resume-convenience.mjs
      - name: Validate upper-grade profile parity
        run: node tools/validate-upper-grade-profile-parity.mjs
