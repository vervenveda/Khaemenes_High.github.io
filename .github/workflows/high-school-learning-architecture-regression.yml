name: High School Learning Architecture Regression

on:
  push:
    branches: [main]
    paths:
      - 'courses/shared/monte-carlo-assessment-v1.js'
      - 'courses/shared/high-school-assessment-adapter-v1.js'
      - 'courses/shared/high-school-learning-context-v1.js'
      - 'courses/shared/high-school-formative-evidence-v1.js'
      - 'scripts/inject-high-school-formative-evidence.mjs'
      - 'courses/shared/high-school-learning-registry.json'
      - 'courses/shared/learner-scope-v1.js'
      - 'courses/language-arts/english-*/**'
      - 'courses/mathematics/pre-algebra/**'
      - 'courses/mathematics/algebra-1/**'
      - 'courses/mathematics/geometry/**'
      - 'courses/mathematics/algebra-2/**'
      - 'courses/science/integrated-science-9/**'
      - 'courses/science/biology-10/**'
      - 'courses/science/chemistry-11/**'
      - 'courses/science/physics-engineering-12/**'
      - 'courses/social-studies/grade-*/**'
      - 'mentor-contract.json'
      - 'tools/validate-high-school-learning-architecture.mjs'
      - '.github/workflows/high-school-learning-architecture-regression.yml'
  pull_request:
    paths:
      - 'courses/shared/**'
      - 'courses/language-arts/english-*/**'
      - 'courses/mathematics/**'
      - 'courses/science/**'
      - 'courses/social-studies/**'
      - 'mentor-contract.json'
      - 'tools/validate-high-school-learning-architecture.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: high-school-learning-architecture-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Validate High School learning architecture
        run: node tools/validate-high-school-learning-architecture.mjs
