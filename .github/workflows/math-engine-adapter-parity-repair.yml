name: Mathematics Engine Adapter Parity Repair

on:
  push:
    paths:
      - "courses/mathematics/tools/repair-math-engine-adapter-parity.mjs"
      - ".github/workflows/math-engine-adapter-parity-repair.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Repair adapter/cache parity
        run: node courses/mathematics/tools/repair-math-engine-adapter-parity.mjs
      - name: Verify exact migration scope
        run: |
          git diff --check
          git status --short
          test -n "$(git status --porcelain)"
          if git diff -- . ':!courses/mathematics/pre-algebra/**' ':!courses/mathematics/algebra-1/**' ':!courses/mathematics/geometry/**' | grep .; then
            echo "Unexpected change outside the three target courses."
            exit 1
          fi
      - name: Commit parity repair
        run: |
          git config user.name "Khaemenes Mathematics CI"
          git config user.email "vervenveda@users.noreply.github.com"
          git add courses/mathematics/pre-algebra courses/mathematics/algebra-1 courses/mathematics/geometry
          git commit -m "fix(math): align v2.3.0 lesson adapter release tokens"
          git push origin HEAD:main
