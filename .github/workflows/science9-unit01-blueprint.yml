name: Science 9 Unit 01 Blueprint Integrity
on:
  push:
    branches: [main]
    paths:
      - 'courses/science/integrated-science-9/units/unit-01/index.html'
      - 'courses/science/integrated-science-9/units/unit-01/unit01-vnv-ka-blueprint-v1.css'
      - 'courses/science/integrated-science-9/units/unit-01/unit01.js'
      - 'tests/science9-unit01-blueprint.test.cjs'
      - '.github/workflows/science9-unit01-blueprint.yml'
  pull_request:
    paths:
      - 'courses/science/integrated-science-9/units/unit-01/index.html'
      - 'courses/science/integrated-science-9/units/unit-01/unit01-vnv-ka-blueprint-v1.css'
      - 'courses/science/integrated-science-9/units/unit-01/unit01.js'
      - 'tests/science9-unit01-blueprint.test.cjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Science 9 Unit 01 layout and existing learner evidence
        run: node tests/science9-unit01-blueprint.test.cjs
