name: Mathematics Shared Games Validation

on:
  pull_request:
    paths:
      - "courses/mathematics/assets/learning-games/**"
      - "courses/mathematics/assets/shared-game-launcher.js"
      - "courses/mathematics/tools/validate-shared-games.mjs"
      - "courses/mathematics/tools/test-game-regressions.mjs"
      - "courses/mathematics/tools/test-game-storage-links.mjs"
      - "courses/mathematics/tools/test-all-game-rounds.mjs"
      - "courses/mathematics/tools/test-algebra-game-routes.mjs"
      - "courses/mathematics/tools/test-algebra1-lesson-specific-games.mjs"
      - "courses/mathematics/tools/test-function-transformation-studio.mjs"
      - "courses/mathematics/tools/test-exponential-logarithm-lab.mjs"
      - "courses/mathematics/tools/test-polynomial-zeros-explorer.mjs"
      - "courses/mathematics/tools/test-matrix-mission-control.mjs"
      - "courses/mathematics/tools/test-sequence-series-studio.mjs"
      - "courses/mathematics/tools/test-complex-plane-lab.mjs"
      - "courses/mathematics/tools/test-statistics-detective.mjs"
      - "courses/mathematics/tools/test-probability-quest.mjs"
      - "courses/mathematics/tools/test-unit-circle-navigator.mjs"
      - "courses/mathematics/tools/test-trigonometric-wave-studio.mjs"
      - "courses/mathematics/tools/test-trigonometric-identity-forge.mjs"
      - "courses/mathematics/tools/test-triangle-law-expedition.mjs"
      - "courses/mathematics/tools/test-algebra2-trig-student-journey.mjs"
      - "courses/mathematics/tools/test-algebra2-deep-trig-lessons.mjs"
      - "courses/mathematics/tools/test-algebra2-trig-resume-flow.mjs"
      - "courses/mathematics/tools/test-algebra2-trig-lesson-depth.mjs"
      - "courses/mathematics/pre-algebra/units/**"
      - "courses/mathematics/algebra-1/units/**"
      - "courses/mathematics/geometry/units/**"
      - "courses/mathematics/algebra-2/units/**"
      - ".github/workflows/math-shared-games-validation.yml"
  push:
    branches: [ main ]
    paths:
      - "courses/mathematics/assets/learning-games/**"
      - "courses/mathematics/assets/shared-game-launcher.js"
      - "courses/mathematics/tools/validate-shared-games.mjs"
      - "courses/mathematics/tools/test-game-regressions.mjs"
      - "courses/mathematics/tools/test-game-storage-links.mjs"
      - "courses/mathematics/tools/test-all-game-rounds.mjs"
      - "courses/mathematics/tools/test-algebra-game-routes.mjs"
      - "courses/mathematics/tools/test-algebra1-lesson-specific-games.mjs"
      - "courses/mathematics/tools/test-function-transformation-studio.mjs"
      - "courses/mathematics/tools/test-exponential-logarithm-lab.mjs"
      - "courses/mathematics/tools/test-polynomial-zeros-explorer.mjs"
      - "courses/mathematics/tools/test-matrix-mission-control.mjs"
      - "courses/mathematics/tools/test-sequence-series-studio.mjs"
      - "courses/mathematics/tools/test-complex-plane-lab.mjs"
      - "courses/mathematics/tools/test-statistics-detective.mjs"
      - "courses/mathematics/tools/test-probability-quest.mjs"
      - "courses/mathematics/tools/test-unit-circle-navigator.mjs"
      - "courses/mathematics/tools/test-trigonometric-wave-studio.mjs"
      - "courses/mathematics/tools/test-trigonometric-identity-forge.mjs"
      - "courses/mathematics/tools/test-triangle-law-expedition.mjs"
      - "courses/mathematics/tools/test-algebra2-trig-student-journey.mjs"
      - "courses/mathematics/tools/test-algebra2-deep-trig-lessons.mjs"
      - "courses/mathematics/tools/test-algebra2-trig-resume-flow.mjs"
      - "courses/mathematics/tools/test-algebra2-trig-lesson-depth.mjs"
      - "courses/mathematics/pre-algebra/units/**"
      - "courses/mathematics/algebra-1/units/**"
      - "courses/mathematics/geometry/units/**"
      - "courses/mathematics/algebra-2/units/**"
      - ".github/workflows/math-shared-games-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Validate canonical shared-game contracts
        run: node courses/mathematics/tools/validate-shared-games.mjs

      - name: Verify repaired game behavior
        run: node courses/mathematics/tools/test-game-regressions.mjs

      - name: Verify shared-game score storage and lesson links
        run: node courses/mathematics/tools/test-game-storage-links.mjs

      - name: Verify every shared game round and review
        run: node courses/mathematics/tools/test-all-game-rounds.mjs

      - name: Validate Function Transformation Studio mathematics
        run: node courses/mathematics/tools/test-function-transformation-studio.mjs

      - name: Verify Exponential and Logarithm Lab mathematics
        run: node courses/mathematics/tools/test-exponential-logarithm-lab.mjs

      - name: Verify Polynomial Zeros Explorer mathematics
        run: node courses/mathematics/tools/test-polynomial-zeros-explorer.mjs

      - name: Validate Matrix Mission Control mathematics
        run: node courses/mathematics/tools/test-matrix-mission-control.mjs

      - name: Validate Sequence and Series Studio mathematics
        run: node courses/mathematics/tools/test-sequence-series-studio.mjs

      - name: Validate Complex Plane Lab mathematics
        run: node courses/mathematics/tools/test-complex-plane-lab.mjs

      - name: Validate Statistics Detective mathematical investigations
        run: node courses/mathematics/tools/test-statistics-detective.mjs

      - name: Validate Probability Quest mathematics and browser behavior
        run: node courses/mathematics/tools/test-probability-quest.mjs

      - name: Validate Unit Circle Navigator exact trigonometry and workshop
        run: node courses/mathematics/tools/test-unit-circle-navigator.mjs

      - name: Validate Trigonometric Wave Studio mathematics and browser behavior
        run: node courses/mathematics/tools/test-trigonometric-wave-studio.mjs

      - name: Validate Trigonometric Identity Forge symbolic and numerical reasoning
        run: node courses/mathematics/tools/test-trigonometric-identity-forge.mjs

      - name: Validate Triangle Law Expedition geometry and navigation
        run: node courses/mathematics/tools/test-triangle-law-expedition.mjs

      - name: Validate Algebra II deep trigonometry and triangle instruction
        run: node courses/mathematics/tools/test-algebra2-deep-trig-lessons.mjs

      - name: Audit Algebra II Units 10–11 lesson and game student journeys
        run: node courses/mathematics/tools/test-algebra2-trig-student-journey.mjs

      - name: Verify Algebra II trigonometry and navigation game round-trip resume
        run: node courses/mathematics/tools/test-algebra2-trig-resume-flow.mjs

      - name: Verify Algebra II Unit 10–11 instructional depth and mathematical accuracy
        run: node courses/mathematics/tools/test-algebra2-trig-lesson-depth.mjs

      - name: Verify Algebra I shared-game launch and return routes
        run: node courses/mathematics/tools/test-algebra-game-routes.mjs

      - name: Validate Algebra I lesson-specific evidence and interval missions
        run: node courses/mathematics/tools/test-algebra1-lesson-specific-games.mjs
