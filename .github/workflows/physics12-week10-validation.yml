name: Physics 12 Week 10 Work and Kinetic Energy Validation
on:
  push:
    paths:
      - 'courses/science/physics-engineering-12/weeks/week-10/**'
      - 'courses/science/physics-engineering-12/tools/validate-week10.mjs'
      - 'courses/science/physics-engineering-12/tools/smoke-week10.mjs'
      - '.github/workflows/physics12-week10-validation.yml'
  pull_request:
    paths:
      - 'courses/science/physics-engineering-12/weeks/week-10/**'
      - 'courses/science/physics-engineering-12/tools/validate-week10.mjs'
      - 'courses/science/physics-engineering-12/tools/smoke-week10.mjs'
      - '.github/workflows/physics12-week10-validation.yml'
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Validate energy physics, questions, datasets, learner records and links
        run: node courses/science/physics-engineering-12/tools/validate-week10.mjs
      - name: Exercise kinetic energy and work simulations and quiz controls
        run: node courses/science/physics-engineering-12/tools/smoke-week10.mjs
