name: Physics 12 Week 07 Newton Laws Studio Validation
on:
  push:
    paths:
      - 'courses/science/physics-engineering-12/weeks/week-07/**'
      - 'courses/science/physics-engineering-12/tools/validate-newton.mjs'
      - 'courses/science/physics-engineering-12/tools/smoke-newton.mjs'
      - '.github/workflows/physics12-newton-validation.yml'
  pull_request:
    paths:
      - 'courses/science/physics-engineering-12/weeks/week-07/**'
      - 'courses/science/physics-engineering-12/tools/validate-newton.mjs'
      - 'courses/science/physics-engineering-12/tools/smoke-newton.mjs'
      - '.github/workflows/physics12-newton-validation.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Verify Newton curriculum, conservation of force-pair vectors, quiz banks and local routes
        run: node courses/science/physics-engineering-12/tools/validate-newton.mjs
