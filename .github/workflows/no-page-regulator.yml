name: No Page Regulator Regression
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/validate-no-page-regulator.mjs\n      - run: node tools/validate-high-main-landings-vnv-shell.mjs\n      - run: node tools/validate-high-subject-landings-vnv-shell.mjs\n      - run: node tools/validate-grade09-assessment-vnv-shell.mjs
