name: Algebra I Browser Regression

on:
  push:
    branches: [main]
    paths:
      - "courses/mathematics/algebra-1/**"
      - "tools/forensic-assessment-audit.mjs"
      - ".github/workflows/algebra1-browser-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  algebra1-browser-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Syntax-check Algebra I regression tools
        run: |
          node --check courses/mathematics/algebra-1/tools/validate-runtime-assessment-banks.mjs
          node --check courses/mathematics/algebra-1/tools/validate-dedicated-misconceptions-v1.mjs
          node --check courses/mathematics/algebra-1/tools/browser-regression-units01-05-09.mjs
          node --check courses/mathematics/algebra-1/tools/browser-regression-units10-13-mastery.mjs
          node --check courses/mathematics/algebra-1/tools/test-locked-evidence-units10-13.mjs
          node --check courses/mathematics/algebra-1/tools/validate-late-unit-abundance.mjs
          node --check courses/mathematics/algebra-1/tools/validate-assessment-depth.mjs

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Validate runtime assessment banks
        run: node courses/mathematics/algebra-1/tools/validate-runtime-assessment-banks.mjs

      - name: Validate late-unit immutable mastery evidence
        run: node courses/mathematics/algebra-1/tools/test-locked-evidence-units10-13.mjs

      - name: Validate late-unit Monte Carlo abundance
        run: node courses/mathematics/algebra-1/tools/validate-late-unit-abundance.mjs

      - name: Validate full assessment depth
        run: node courses/mathematics/algebra-1/tools/validate-assessment-depth.mjs

      - name: Validate dedicated misconception map
        run: node courses/mathematics/algebra-1/tools/validate-dedicated-misconceptions-v1.mjs

      - name: Validate consolidated assessment integration
        run: node tools/forensic-assessment-audit.mjs --json

      - name: Run representative real-browser journey
        run: node courses/mathematics/algebra-1/tools/browser-regression-units01-05-09.mjs

      - name: Run late-unit formal mastery browser journey
        run: node courses/mathematics/algebra-1/tools/browser-regression-units10-13-mastery.mjs
