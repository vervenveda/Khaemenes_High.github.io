name: One-use retired chrome purge
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-use-retired-chrome-purge.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Purge retired regulator references and repair canonical dependencies
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path(".")
          retired = "high-school-global-chrome-v2.js"
          script_tag = re.compile(
              r'<script\b[^>]*\bsrc\s*=\s*(["\'])[^"\']*high-school-global-chrome-v2\.js(?:\?[^"\']*)?\1[^>]*>\s*</script>\s*',
              re.I
          )

          replacements = {
              "../../shared/high-school-class-tools-universal-v1.js":
                  "/Khaemenes_High.github.io/courses/shared/high-school-class-tools-universal-v1.js",
              "../../assets/math-learning-tools-v2.js":
                  "/Khaemenes_High.github.io/courses/mathematics/assets/math-learning-tools-v2.js",
              "../assets/math-learning-tools-v2.js":
                  "/Khaemenes_High.github.io/courses/mathematics/assets/math-learning-tools-v2.js",
              "../../../../assets/vnv-language.js?v=20261118-high-school-bounded-refresh-1":
                  "/Khaemenes_High.github.io/assets/vnv-language.js?v=20261118-high-school-bounded-refresh-1",
              "../../../assets/vnv-language.js?v=20261118-high-school-bounded-refresh-1":
                  "/Khaemenes_High.github.io/assets/vnv-language.js?v=20261118-high-school-bounded-refresh-1",
              "/Khaemenes_High.github.io/courses/mathematics/pre-algebra/assets/algebra1-worker-recovery-v1.js":
                  "/Khaemenes_High.github.io/courses/mathematics/algebra-1/assets/algebra1-worker-recovery-v1.js",
          }

          changed = []
          retired_removed = 0
          for p in root.rglob("*.html"):
              if ".git" in p.parts or "workflow" in p.parts:
                  continue
              text = p.read_text(encoding="utf-8")
              before = text
              text, n = script_tag.subn("", text)
              retired_removed += n
              for old, new in replacements.items():
                  text = text.replace(old, new)
              if text != before:
                  p.write_text(text, encoding="utf-8")
                  changed.append(str(p))

          remaining = []
          for p in root.rglob("*.html"):
              if ".git" in p.parts or "workflow" in p.parts:
                  continue
              text = p.read_text(encoding="utf-8")
              if retired in text:
                  remaining.append(str(p))

          print(f"HTML files changed: {len(changed)}")
          print(f"Retired script tags removed: {retired_removed}")
          print(f"Remaining retired references: {len(remaining)}")
          if remaining:
              print("\n".join(remaining[:100]))
              raise SystemExit(1)
          PY

      - name: Validate sitewide local routes
        run: python3 tools/validate-sitewide-routes.py

      - name: Commit repair
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No repair changes required."
            exit 0
          fi
          git config user.name "Khaemenes repair workflow"
          git config user.email "actions@users.noreply.github.com"
          git add -u
          git commit -m "fix(high): purge retired chrome references and repair local routes"
          git push
