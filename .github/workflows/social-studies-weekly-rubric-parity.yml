name: Social Studies Weekly Rubric Parity

on:
  pull_request:
    paths:
      - "courses/social-studies/**"
      - ".github/workflows/social-studies-weekly-rubric-parity.yml"
  push:
    branches: [main]
    paths:
      - "courses/social-studies/**"
      - ".github/workflows/social-studies-weekly-rubric-parity.yml"

jobs:
  verify-weekly-rubric-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify live and printable weekly learner contract
        shell: python
        run: |
          from pathlib import Path
          import sys

          failures = []
          apps = [
              Path("courses/social-studies/grade-09/app.js"),
              Path("courses/social-studies/grade-10/app.js"),
              Path("courses/social-studies/grade-11/app.js"),
              Path("courses/social-studies/grade-11/personal-finance/app.js"),
              Path("courses/social-studies/grade-12/app.js"),
          ]
          live_markers = [
              'data-weekly-rubric-contract="v1"',
              "Essential Question",
              "Learning Targets",
              "Required Evidence",
              "Success Criteria / Rubric",
              "Unlock Condition",
              "80%",
          ]
          for path in apps:
              text = path.read_text(encoding="utf-8")
              for marker in live_markers:
                  if marker not in text:
                      failures.append(f"{path}: missing live rubric marker {marker!r}")

          roots = [
              (Path("courses/social-studies/grade-09/weeks"),36),
              (Path("courses/social-studies/grade-10/weeks"),36),
              (Path("courses/social-studies/grade-11/weeks"),36),
              (Path("courses/social-studies/grade-11/personal-finance/weeks"),18),
              (Path("courses/social-studies/grade-12/weeks"),36),
          ]
          packets=[]
          for root,expected in roots:
              found=sorted(root.glob("week-*/student-packet.html"))
              if len(found)!=expected:
                  failures.append(f"{root}: expected {expected} canonical packets; found {len(found)}")
              packets.extend(found)

          for path in packets:
              low=path.read_text(encoding="utf-8").lower()
              checks={
                  "essential question":"essential question" in low,
                  "learning target/objective":("learning target" in low or "objective:" in low or "<strong>objective</strong>" in low),
                  "vocabulary":"vocabulary" in low,
                  "required evidence/assignment":("required evidence" in low or "principal assignments" in low or "assignment 1" in low),
                  "rubric/success criteria":("rubric" in low or "success criteria" in low),
                  "constructed response":"constructed response" in low,
                  "80% mastery":("80%" in low or "80 percent" in low),
              }
              for label,ok in checks.items():
                  if not ok: failures.append(f"{path}: missing {label}")

          if len(packets)!=162:
              failures.append(f"Expected 162 canonical Social Studies student packets; found {len(packets)}")

          if failures:
              print("\n".join(f"FAIL: {x}" for x in failures))
              sys.exit(1)
          print(f"PASS: five live engines and {len(packets)} canonical packets satisfy the Social Studies weekly rubric contract.")
