name: English 12 Minimal Landing

on:
  push:
    branches: [main]
    paths:
      - 'courses/language-arts/english-12/index.html'
      - 'courses/language-arts/assets/english-minimal-landing-v1.css'
      - 'courses/language-arts/assets/english-minimal-header-mount-v1.js'
      - 'courses/language-arts/assets/english-landing-class-tools-v1.js'
      - 'tools/validate-english12-minimal-landing.mjs'
      - '.github/workflows/english12-minimal-landing.yml'
  pull_request:
    paths:
      - 'courses/language-arts/english-12/index.html'
      - 'courses/language-arts/assets/english-*'
      - 'tools/validate-english12-minimal-landing.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate English 12 minimal landing contract
        run: node tools/validate-english12-minimal-landing.mjs
      - name: Validate patch formatting
        run: git diff --check
