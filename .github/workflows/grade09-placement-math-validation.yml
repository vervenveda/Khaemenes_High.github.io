name: Grade 09 Algebra I Placement Validation

on:
  pull_request:
    branches: [main]
    paths:
      - grades/grade-09/student-profile/**
      - courses/shared/course-entry-contract.js
      - courses/mathematics/pre-algebra/tools/component-manifest.json
      - courses/mathematics/algebra-1/units/**/unit-map.json
      - scripts/validate_grade09_placement_math_dashboard.mjs
      - scripts/validate_grade09_seven_class_journey.mjs
      - scripts/test_grade09_two_learner_pins.mjs
      - scripts/validate_grade09_translator_gateway.mjs
      - scripts/validate_upper_grade_seven_class_journey.mjs
      - scripts/validate_high_school_return_to_classes.mjs
      - assets/high-school-return-to-classes.js
      - grades/shared/upper-grade-seven-class.js
      - grades/grade-10/**
      - grades/grade-11/**
      - grades/grade-12/**
      - .github/workflows/grade09-placement-math-validation.yml
  push:
    branches:
      - main
    paths:
      - grades/grade-09/student-profile/**
      - courses/shared/course-entry-contract.js
      - courses/mathematics/pre-algebra/tools/component-manifest.json
      - courses/mathematics/algebra-1/units/**/unit-map.json
      - scripts/validate_grade09_placement_math_dashboard.mjs
      - scripts/validate_grade09_seven_class_journey.mjs
      - scripts/validate_grade09_translator_gateway.mjs
      - .github/workflows/grade09-placement-math-validation.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate Grade 09 placement-aware mathematics dashboard
        run: node scripts/validate_grade09_placement_math_dashboard.mjs

      - name: Validate Grade 09 seven-class student journey
        run: node scripts/validate_grade09_seven_class_journey.mjs

      - name: Verify official Grade 09 translation layer
        run: node scripts/validate_grade09_translator_gateway.mjs

      - name: Validate upper-grade seven-class student profiles
        run: node scripts/validate_upper_grade_seven_class_journey.mjs

      - name: Verify two learner class pin and language isolation
        run: node scripts/test_grade09_two_learner_pins.mjs

      - name: Validate return-to-class navigation for Grade 9–12
        run: node scripts/validate_high_school_return_to_classes.mjs

      - name: Check shared JavaScript syntax
        run: |
          node --check grades/grade-09/student-profile/student-course-registry.js

      - name: Check whitespace
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --check "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"
          else
            git diff --check HEAD^..HEAD
          fi
