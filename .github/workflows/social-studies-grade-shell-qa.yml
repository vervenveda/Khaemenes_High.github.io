name: Social Studies Grade Door Shell QA

on:
  pull_request:
    paths:
      - 'courses/social-studies/index.html'
      - 'courses/social-studies/grade-*/index.html'
      - 'courses/social-studies/assets/social-studies-grade-shell-v1.js'
      - 'assets/high-school-subject-landing-shell-v1.css'
      - '.github/workflows/social-studies-grade-shell-qa.yml'
  push:
    branches: [ main ]
    paths:
      - 'courses/social-studies/index.html'
      - 'courses/social-studies/grade-*/index.html'
      - 'courses/social-studies/assets/social-studies-grade-shell-v1.js'
      - 'assets/high-school-subject-landing-shell-v1.css'
      - '.github/workflows/social-studies-grade-shell-qa.yml'

permissions:
  contents: read

jobs:
  grade-door-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check grade shell
        run: node --check courses/social-studies/assets/social-studies-grade-shell-v1.js
      - name: Validate all four grade doors
        shell: python
        run: |
          from pathlib import Path
          import sys

          failures=[]
          for grade in ("09","10","11","12"):
              path=Path(f"courses/social-studies/grade-{grade}/index.html")
              text=path.read_text(encoding="utf-8")
              required=[
                      'social-studies-grade-shell-v1.js',
              'social-studies-canonical-vnv-shell-v1.css'
              ]
              for marker in required:
                  if marker not in text:
                      failures.append(f"Grade {grade}: missing {marker}")
              if 'id="khaemenes-typography-standard"' in text:
                  failures.append(f"Grade {grade}: obsolete 14px typography injection still present")
              if "<style" in text.lower():
                  failures.append(f"Grade {grade}: inline style block returned")
              if ' style="' in text.lower() or " style='" in text.lower():
                  failures.append(f"Grade {grade}: inline style attribute returned")
              if "high-school-subject-landing-shell-v1.css" in text:
                  failures.append(f"Grade {grade}: competing generic subject stylesheet returned")

          department=Path("courses/social-studies/index.html").read_text(encoding="utf-8")
          if "<style" in department.lower():
              failures.append("Department landing: inline style block returned")
          if ' style="' in department.lower() or " style='" in department.lower():
              failures.append("Department landing: inline style attribute returned")
          if "high-school-subject-landing-shell-v1.css" in department:
              failures.append("Department landing: competing generic subject stylesheet returned")

          department_required=[
              "vnv-333-ticker.js",
              "vnv-ticker-autopopulate.js",
              "vnv-header-autopopulate.js",
              "vnv-class-tools-toolbar.js",
              "vnv-ecosystem-toolbar.js",
              "khaemenes-campus-phrases.js",
              "khaemenes-interlingual-core.js",
              "khaemenes-translator-loader.js",
              "vnv-language.js",
              'class="subject-breadcrumbs"',
              'class="subject-about"',
              'class="feature-grid"',
              "Learner Profile",
              "Parent Profile",
              "Enrollment",
              "Khaemenes Academy",
              "<h1>Social Studies</h1>",
              "Course Features"
          ]
          for marker in department_required:
              if marker not in department:
                  failures.append(f"Department landing missing canonical contract marker: {marker}")
          if department.count('class="course-feature"') != 4:
              failures.append("Department landing must retain exactly four symmetrical course-feature cards")
          if 'id="khaemenes-typography-standard"' in department:
              failures.append("Department landing: obsolete typography injector returned")
          if "high-school-class-tools-universal-v1.js" in department:
              failures.append("Department landing: local class tools implementation returned")

          shell=Path("courses/social-studies/assets/social-studies-grade-shell-v1.js").read_text(encoding="utf-8")
          if "createElement(\"style\")" in shell or ".style.textContent" in shell or "function style()" in shell:
              failures.append("Shared Social Studies shell must not inject CSS at runtime")

          canonical_css=Path("courses/social-studies/assets/social-studies-canonical-vnv-shell-v1.css").read_text(encoding="utf-8")
          for marker in [
              "--ss-charcoal:#243038",
              "--ss-cream:#fff8e9",
              "--ss-parchment:#f4f0e7",
              "--ss-radius:7px",
              "font:400 33px",
              "66px",
              "font:400 24px",
              "#vnvClassToolsToggle",
              "#vnvEcosystemUtilityDock"
          ]:
              if marker not in canonical_css:
                  failures.append(f"Canonical Social Studies CSS missing contract marker: {marker}")

          visual_prop = ("background:", "background-color:", "color:", "font:", "font-size:", "font-family:",
                         "font-weight:", "border-radius:", "box-shadow:")
          for grade in ("09","10","11","12"):
              layout=Path(f"courses/social-studies/grade-{grade}/styles.css").read_text(encoding="utf-8").lower()
              for prop in visual_prop:
                  if prop in layout:
                      failures.append(f"Grade {grade} layout stylesheet regained visual property {prop}")

          for marker in [
              "vnv-333-ticker.js",
              "vnv-ticker-autopopulate.js",
              "vnv-header-autopopulate.js",
              "vnv-language.js",
              "vnv-class-tools-toolbar.js",
              "vnv-ecosystem-toolbar.js",
              "khaemenes-campus-phrases.js",
              "khaemenes-interlingual-core.js",
              "khaemenes-translator-loader.js",
              "high-subject-breadcrumbs",
              "ss-shell-intro",
              "ss-feature-grid",
              "Learner Profile",
              "Parent Profile",
              "Enrollment",
              'font:400 33px',
              '66px',
              'font:400 24px',
              'border-radius:7px'
          ]:
              if marker not in shell:
                  failures.append(f"Shared grade shell missing contract marker: {marker}")

          if "high-school-class-tools-universal-v1.js" in shell:
              failures.append("Shared grade shell must not load the repository-local class tools implementation")

          for grade in ("09","10","11","12"):
              text=Path(f"courses/social-studies/grade-{grade}/index.html").read_text(encoding="utf-8")
              if "high-school-class-tools-universal-v1.js" in text:
                  failures.append(f"Grade {grade}: local class tools implementation still loaded")
              if "../../../assets/vnv-language.js" in text:
                  failures.append(f"Grade {grade}: repository-local language loader still loaded")

          for forbidden in ["window.localStorage","localStorage.","window.sessionStorage","sessionStorage.","indexedDB.open(","fetch(","XMLHttpRequest(","document.cookie"]:
              if forbidden in shell:
                  failures.append(f"Grade shell must remain presentation-only: {forbidden}")

          if failures:
              print("\n".join("FAIL: "+item for item in failures))
              sys.exit(1)
          print("PASS: Social Studies Grade 9–12 doors use the canonical shell adapter without mutating academic state.")
