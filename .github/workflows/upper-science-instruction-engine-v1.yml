name: Upper Science Instruction Engine v1
on:
  push:
    branches: [main]
    paths:
      - 'courses/shared/upper-science-instruction-engine-v1.js'
      - 'courses/science/biology-10/weeks/week-01/lessons/day-01.html'
      - 'tools/test-upper-science-instruction-engine-v1.mjs'
      - '.github/workflows/upper-science-instruction-engine-v1.yml'
  pull_request:
    paths:
      - 'courses/shared/upper-science-instruction-engine-v1.js'
      - 'courses/science/biology-10/weeks/week-01/lessons/day-01.html'
      - 'tools/test-upper-science-instruction-engine-v1.mjs'
      - '.github/workflows/upper-science-instruction-engine-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check courses/shared/upper-science-instruction-engine-v1.js
      - run: node tools/test-upper-science-instruction-engine-v1.mjs
