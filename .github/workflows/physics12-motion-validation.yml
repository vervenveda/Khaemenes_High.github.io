name: Physics 12 Weeks 02-03 Motion Studio Validation
on:
  push:
    paths:
      - 'courses/science/physics-engineering-12/shared-motion/**'
      - 'courses/science/physics-engineering-12/weeks/week-02/**'
      - 'courses/science/physics-engineering-12/weeks/week-03/**'
      - '.github/workflows/physics12-motion-validation.yml'
  pull_request:
    paths:
      - 'courses/science/physics-engineering-12/shared-motion/**'
      - 'courses/science/physics-engineering-12/weeks/week-02/**'
      - 'courses/science/physics-engineering-12/weeks/week-03/**'
      - '.github/workflows/physics12-motion-validation.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Check teaching files equations physics datasets links and offline sources
        run: node courses/science/physics-engineering-12/tools/validate-motion.mjs
      - name: Run model equation and interaction smoke tests
        run: node courses/science/physics-engineering-12/tools/smoke-motion.mjs
