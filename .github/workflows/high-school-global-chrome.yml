name: High School Global Header Menu Toolbar

on:
  push:
    branches: [main]
    paths:
      - 'assets/high-school-global-chrome-v2.js'
      - 'tools/high-school-chrome-audit.mjs'
      - '.github/workflows/high-school-global-chrome.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install canonical High School chrome on every HTML page
        run: node tools/high-school-chrome-audit.mjs --write
      - name: Verify full HTML coverage and inventory lower-left/export candidates
        run: node tools/high-school-chrome-audit.mjs --check
      - name: Validate patch
        run: git diff --check
      - name: Commit normalization
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No High School HTML pages required chrome repair."
            exit 0
          fi
          git config user.name "Khaemenes Academy Automation"
          git config user.email "khaemenesacademy@users.noreply.github.com"
          git add -- '*.html' '*.htm' ':!node_modules' ':!.git'
          git commit -m "Standardize High School header menu and toolbar"
          git push
