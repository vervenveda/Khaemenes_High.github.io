name: High School Language Pin Regression
on:
  push:
    branches: [main]
    paths:
      - 'courses/shared/high-school-course-pins.js'
      - 'index.html'
      - 'grades/grade-09/student-profile/student-course-registry.js'
      - 'grades/grade-09/student-profile/seven-class-schedule.js'
      - 'tests/high-language-pin-regression.cjs'
      - '.github/workflows/high-language-pin-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run fictional French and Spanish learner isolation tests
        run: node tests/high-language-pin-regression.cjs
