name: Social Studies Inline Script Boundaries
on:
  push:
    branches: [main]
    paths:
      - "courses/social-studies/grade-10/index.html"
      - "courses/social-studies/grade-11/index.html"
      - "courses/social-studies/grade-12/index.html"
      - "tests/social-studies-inline-report-boundaries.mjs"
      - ".github/workflows/social-studies-inline-script-boundaries.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inline-report-boundaries:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check script parsing and printable-report isolation
        run: node tests/social-studies-inline-report-boundaries.mjs
