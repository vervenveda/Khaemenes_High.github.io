name: Purged retired High School global chrome guard
on:
  push:
    branches:
      - fix/purge-retired-high-school-global-chrome-v2-20261119
    paths:
      - "courses/language-arts/english-*/index.html"
      - "assets/high-navigation-v1.js"
      - "tools/validate-retired-high-school-global-chrome-purge.mjs"
      - ".github/workflows/retired-high-school-global-chrome-purge.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-purge-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Verify repository-wide retired chrome purge and canonical replacement
        run: |
          node --check assets/high-navigation-v1.js
          node tools/validate-retired-high-school-global-chrome-purge.mjs
