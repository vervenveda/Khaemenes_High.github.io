name: Pre-Algebra Component Validation

on:
  pull_request:
    paths:
      - "courses/mathematics/pre-algebra/**"
      - "grades/grade-09/student-profile/**"
      - ".github/workflows/prealgebra-component-validation.yml"
  push:
    paths:
      - "courses/mathematics/pre-algebra/**"
      - "grades/grade-09/student-profile/**"
      - ".github/workflows/prealgebra-component-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Validate Pre-Algebra component hashes
        run: node courses/mathematics/pre-algebra/tools/validate-components.mjs
      - name: Validate Pre-Algebra assessment depth
        run: node courses/mathematics/pre-algebra/tools/validate-assessment-depth.mjs
      - name: Validate Academy mastery gates
        run: node courses/mathematics/pre-algebra/tools/validate-mastery-gates.mjs
      - name: Validate student navigation, theme, pin, and continue paths
        run: node courses/mathematics/pre-algebra/tools/validate-student-navigation.mjs
      - name: Validate Unit 1 daily workroom and mastery handoff
        run: node courses/mathematics/pre-algebra/tools/validate-student-workroom.mjs
      - name: Validate 36-week course navigator and cumulative review center
        run: node courses/mathematics/pre-algebra/tools/validate-course-navigator.mjs
