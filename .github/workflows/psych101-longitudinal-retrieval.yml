name: Psychology 101 Longitudinal Retrieval
on:
  pull_request:
    paths:
      - "electives/grades/grade-09/psych-101/**"
      - "tools/validate-psych101-longitudinal-retrieval-v1.mjs"
      - ".github/workflows/psych101-longitudinal-retrieval.yml"
  push:
    branches: [main]
    paths:
      - "electives/grades/grade-09/psych-101/**"
      - "tools/validate-psych101-longitudinal-retrieval-v1.mjs"
      - ".github/workflows/psych101-longitudinal-retrieval.yml"
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: node tools/validate-psych101-longitudinal-retrieval-v1.mjs
