name: Grade 09 Lesson Continuation Guard
on:
  push:
    branches: [main]
    paths:
      - 'grades/grade-09/student-profile/student-course-registry.js'
      - 'tools/test-grade09-lesson-route-normalization.mjs'
      - '.github/workflows/grade09-lesson-continuation.yml'
  pull_request:
    paths:
      - 'grades/grade-09/student-profile/student-course-registry.js'
      - 'tools/test-grade09-lesson-route-normalization.mjs'
      - '.github/workflows/grade09-lesson-continuation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  grade09-route-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check grades/grade-09/student-profile/student-course-registry.js
      - run: node tools/test-grade09-lesson-route-normalization.mjs
