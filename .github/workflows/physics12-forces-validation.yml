name: Physics 12 Week 06 Force Studio Validation
on:
  push:
    paths:
      - 'courses/science/physics-engineering-12/weeks/week-06/**'
      - 'courses/science/physics-engineering-12/tools/validate-forces.mjs'
      - 'courses/science/physics-engineering-12/tools/smoke-forces.mjs'
      - '.github/workflows/physics12-forces-validation.yml'
  pull_request:
    paths:
      - 'courses/science/physics-engineering-12/weeks/week-06/**'
      - 'courses/science/physics-engineering-12/tools/validate-forces.mjs'
      - 'courses/science/physics-engineering-12/tools/smoke-forces.mjs'
      - '.github/workflows/physics12-forces-validation.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Verify academic content force-vector science student-record preservation and links
        run: node courses/science/physics-engineering-12/tools/validate-forces.mjs
