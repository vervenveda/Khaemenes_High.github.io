name: Grade 09 Dashboard Interaction Guards
on:
  push:
    branches: [main]
    paths:
      - 'grades/grade-09/student-profile/index.html'
      - 'grades/grade-09/student-profile/dashboard-layout.js'
      - 'tests/grade09-dashboard-entry-regression.test.mjs'
      - '.github/workflows/grade09-dashboard-interaction-guards.yml'
  pull_request:
    paths:
      - 'grades/grade-09/student-profile/index.html'
      - 'grades/grade-09/student-profile/dashboard-layout.js'
      - 'tests/grade09-dashboard-entry-regression.test.mjs'
      - '.github/workflows/grade09-dashboard-interaction-guards.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dashboard-guards:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify profile tool handler syntax
        run: node --check grades/grade-09/student-profile/dashboard-layout.js
      - name: Verify daily lesson and toolbar contracts
        run: node --test tests/grade09-dashboard-entry-regression.test.mjs
