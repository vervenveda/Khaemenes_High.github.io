name: Public Entry Route Validation

on:
  pull_request:
    paths:
      - "**/*.html"
      - "**/*.js"
      - "**/*.json"
      - "**/*.webmanifest"
      - "tools/validate-public-entry-routes.mjs"
      - ".github/workflows/public-entry-route-validation.yml"
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate public entry routes
        run: node tools/validate-public-entry-routes.mjs
