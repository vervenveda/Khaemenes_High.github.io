name: High School Profile Toolbar Coverage
on:
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - 'courses/shared/high-school-learning-context-v1.js'
      - 'courses/mathematics/**/assets/lesson-tools.js'
      - 'tools/audit-student-toolbar-coverage.mjs'
      - '.github/workflows/high-profile-toolbar-coverage.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inventory every High School HTML page
        run: node tools/audit-student-toolbar-coverage.mjs
      - name: Upload full uncovered-page report
        uses: actions/upload-artifact@v4
        with:
          name: high-student-toolbar-coverage
          path: reports/student-toolbar-coverage.json
