name: Physics 12 Weeks 04-05 Advanced Science Studio Validation
on:
  push:
    paths:
      - 'courses/science/physics-engineering-12/shared-motion/advanced-lesson.js'
      - 'courses/science/physics-engineering-12/shared-motion/projectile-explorer.html'
      - 'courses/science/physics-engineering-12/shared-motion/model-detective.html'
      - 'courses/science/physics-engineering-12/weeks/week-04/**'
      - 'courses/science/physics-engineering-12/weeks/week-05/**'
      - 'courses/science/physics-engineering-12/tools/validate-advanced.mjs'
      - 'courses/science/physics-engineering-12/tools/smoke-advanced.mjs'
      - '.github/workflows/physics12-advanced-validation.yml'
  pull_request:
    paths:
      - 'courses/science/physics-engineering-12/shared-motion/advanced-lesson.js'
      - 'courses/science/physics-engineering-12/shared-motion/projectile-explorer.html'
      - 'courses/science/physics-engineering-12/shared-motion/model-detective.html'
      - 'courses/science/physics-engineering-12/weeks/week-04/**'
      - 'courses/science/physics-engineering-12/weeks/week-05/**'
      - 'courses/science/physics-engineering-12/tools/validate-advanced.mjs'
      - 'courses/science/physics-engineering-12/tools/smoke-advanced.mjs'
      - '.github/workflows/physics12-advanced-validation.yml'
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Verify Physics lessons scientific CSV data assessment and routes
        run: node courses/science/physics-engineering-12/tools/validate-advanced.mjs
      - name: Exercise quiz, projectile and model detective interactions
        run: node courses/science/physics-engineering-12/tools/smoke-advanced.mjs
