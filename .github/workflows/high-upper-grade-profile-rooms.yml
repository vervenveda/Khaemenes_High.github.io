name: High School Upper-Grade Profile Rooms

on:
  push:
    branches: [main]
    paths:
      - "grades/grade-11/student-profile/**"
      - "grades/grade-12/student-profile/**"
      - "grades/shared/high-profile-room-boundary.js"
      - "tests/high-upper-grade-profile-rooms.cjs"
      - ".github/workflows/high-upper-grade-profile-rooms.yml"
  pull_request:
    paths:
      - "grades/grade-11/student-profile/**"
      - "grades/grade-12/student-profile/**"
      - "grades/shared/high-profile-room-boundary.js"
      - "tests/high-upper-grade-profile-rooms.cjs"
      - ".github/workflows/high-upper-grade-profile-rooms.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  room-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Verify Grades 11 and 12 profile room contracts
        run: node tests/high-upper-grade-profile-rooms.cjs
