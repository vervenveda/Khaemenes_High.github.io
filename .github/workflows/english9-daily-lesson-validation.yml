name: English 9 Daily Lesson Validation
on:
  push:
    branches: [main]
    paths:
      - 'courses/language-arts/english-9/**'
      - '.github/workflows/english9-daily-lesson-validation.yml'
  pull_request:
    paths:
      - 'courses/language-arts/english-9/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  daily-lessons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate individual English 9 lessons
        run: |
          node courses/language-arts/english-9/tests/daily-lesson-regression.mjs
          node courses/language-arts/english-9/tests/daily-lesson-behavior.mjs
          node courses/language-arts/english-9/tests/week02-daily-regression.mjs
          node courses/language-arts/english-9/tests/week03-daily-regression.mjs
          node courses/language-arts/english-9/tests/week03-daily-behavior.mjs
          node courses/language-arts/english-9/tests/week03-review-bridge-regression.mjs
