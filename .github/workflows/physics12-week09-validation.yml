name: Physics 12 Week 09 Gravitation & Orbits Validation
on:
  push:
    paths:
      - 'courses/science/physics-engineering-12/weeks/week-09/**'
      - 'courses/science/physics-engineering-12/tools/validate-week09.mjs'
      - 'courses/science/physics-engineering-12/tools/smoke-week09.mjs'
      - '.github/workflows/physics12-week09-validation.yml'
  pull_request:
    paths:
      - 'courses/science/physics-engineering-12/weeks/week-09/**'
      - 'courses/science/physics-engineering-12/tools/validate-week09.mjs'
      - 'courses/science/physics-engineering-12/tools/smoke-week09.mjs'
      - '.github/workflows/physics12-week09-validation.yml'
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Check scientific formulas, original student records, quiz banks and lesson routes
        run: node courses/science/physics-engineering-12/tools/validate-week09.mjs
      - name: Execute Newtonian orbit and inverse-square labs, quizzes and local records
        run: node courses/science/physics-engineering-12/tools/smoke-week09.mjs
