name: High School Mathematics Lesson Launch Validation

on:
  pull_request:
    paths:
      - 'courses/mathematics/pre-algebra/**'
      - 'courses/mathematics/algebra-1/**'
      - 'courses/mathematics/geometry/**'
      - 'courses/mathematics/algebra-2/**'
      - 'courses/mathematics/tools/validate-prealgebra-algebra1-launch.mjs'
      - 'courses/mathematics/tools/validate-four-course-lesson-launch.mjs'
      - 'tests/math-browser-lesson-smoke.py'
      - 'tests/math-browser-geometry-cdp.mjs'
      - 'courses/mathematics/assets/course-lesson-workflow-v1.js'
      - 'tools/test-geometry-loading-boundary.mjs'
      - 'tools/test-algebra2-historical-mastery.mjs'
      - '.github/workflows/math-launch-day-validation.yml'
  push:
    paths:
      - 'courses/mathematics/pre-algebra/**'
      - 'courses/mathematics/algebra-1/**'
      - 'courses/mathematics/geometry/**'
      - 'courses/mathematics/algebra-2/**'
      - 'courses/mathematics/tools/validate-prealgebra-algebra1-launch.mjs'
      - 'courses/mathematics/tools/validate-four-course-lesson-launch.mjs'
      - 'tests/math-browser-lesson-smoke.py'
      - 'tests/math-browser-geometry-cdp.mjs'
      - 'courses/mathematics/assets/course-lesson-workflow-v1.js'
      - 'tools/test-geometry-loading-boundary.mjs'
      - 'tools/test-algebra2-historical-mastery.mjs'
      - '.github/workflows/math-launch-day-validation.yml'

permissions:
  contents: read

jobs:
  launch-contract:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate Grade 9-12 lesson document launch contract
        run: node courses/mathematics/tools/validate-four-course-lesson-launch.mjs

      - name: Validate Pre-Algebra and Algebra I progression launch contract
        run: node courses/mathematics/tools/validate-prealgebra-algebra1-launch.mjs

      - name: Validate Pre-Algebra component hashes
        run: node courses/mathematics/pre-algebra/tools/validate-components.mjs

      - name: Validate Pre-Algebra assessment depth
        run: node courses/mathematics/pre-algebra/tools/validate-assessment-depth.mjs

      - name: Validate Pre-Algebra Academy mastery gates
        run: node courses/mathematics/pre-algebra/tools/validate-mastery-gates.mjs

      - name: Validate Algebra I whole course
        run: node courses/mathematics/algebra-1/tools/validate-first-draft.mjs

      - name: Validate Algebra I readiness bridge
        run: node courses/mathematics/algebra-1/readiness/validate-transition-contract.mjs

      - name: Validate Algebra I assessment depth
        run: node courses/mathematics/algebra-1/tools/validate-assessment-depth.mjs

      - name: Validate Algebra I strict 80 percent progression gates
        run: node courses/mathematics/algebra-1/tools/validate-strict-mastery-gates.mjs

      - name: Validate Algebra I applied labs
        run: node courses/mathematics/algebra-1/tools/validate-applied-labs.mjs

      - name: Validate Mathematics assessment submission and locking
        run: node tools/test-math-assessment-submission-integrity.mjs

      - name: Validate blank versus zero evaluator scores across courses
        run: node tools/test-math-manual-score-input-integrity.mjs

      - name: Validate Algebra II learner note isolation and recovery
        run: node tools/test-algebra2-note-preservation.mjs

      - name: Validate Algebra II second-half midterm continuity
        run: node tools/test-algebra2-midterm-continuity.mjs

      - name: Validate Geometry and Algebra II course launch JavaScript syntax
        run: |
          node --check courses/mathematics/geometry/assets/app.js
          node --check courses/mathematics/algebra-2/assets/app.js

      - name: Geometry browser protocol and Algebra II historical mastery regression
        run: |
          node tools/test-geometry-loading-boundary.mjs
          node tools/test-algebra2-historical-mastery.mjs
          node --check tests/math-browser-geometry-cdp.mjs

      - name: Verify mathematics lesson loading in isolated Chrome
        run: |
          command -v google-chrome || command -v chromium
          python3 tests/math-browser-lesson-smoke.py

      - name: Validate launch-page inline JavaScript syntax
        run: |
          node <<'NODE'
          const fs=require('fs');
          const vm=require('vm');
          const files=[
            'courses/mathematics/algebra-1/index.html',
            'courses/mathematics/algebra-1/diagnostic/index.html'
          ];
          for(const file of files){
            const html=fs.readFileSync(file,'utf8');
            const scripts=[...html.matchAll(/<script(?![^>]*\bsrc=)[^>]*>([\s\S]*?)<\/script>/gi)].map(m=>m[1]);
            if(!scripts.length)throw new Error(`${file}: no inline scripts found`);
            scripts.forEach((code,index)=>new vm.Script(code,{filename:`${file}#inline-${index+1}`}));
            console.log(`OK ${file}: ${scripts.length} inline script(s) parse`);
          }
          NODE
