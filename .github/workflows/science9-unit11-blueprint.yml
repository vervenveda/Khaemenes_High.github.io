name: Science 9 Unit 11 Blueprint Integrity
on:
  push:
    branches: [main]
    paths:
      - 'courses/science/integrated-science-9/units/unit-11/index.html'
      - 'courses/science/integrated-science-9/units/unit-11/unit11-vnv-ka-blueprint-v1.css'
      - 'courses/science/integrated-science-9/units/unit-11/unit11.js'
      - 'tests/science9-unit11-blueprint.test.cjs'
      - '.github/workflows/science9-unit11-blueprint.yml'
  pull_request:
    paths:
      - 'courses/science/integrated-science-9/units/unit-11/index.html'
      - 'courses/science/integrated-science-9/units/unit-11/unit11-vnv-ka-blueprint-v1.css'
      - 'courses/science/integrated-science-9/units/unit-11/unit11.js'
      - 'tests/science9-unit11-blueprint.test.cjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Unit 11 Science 9 astronomy content, mastery and Academy design
        run: node tests/science9-unit11-blueprint.test.cjs
