name: Guarded Pre-Algebra source cleanup

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply exact source cleanup
        shell: python
        run: |
          from pathlib import Path

          path = Path('courses/mathematics/pre-algebra/index.html')
          text = path.read_text(encoding='utf-8')

          old = '''function standards(){
  let coverage={};APP.weeks.forEach(w=>w.tags.forEach(t=>{coverage[t]??=[];coverage[t].push(w.week)}));
  $("content").innerHTML=`<div class="grid"><div class="card col12"><h3>Repository Sources & Standards Evidence</h3><p>This portal follows the repository course map and connects to the complete unit architecture. Framework tags are useful crosswalk evidence, but they are not a substitute for a jurisdiction-specific adoption review or transcript decision.</p></div><div class="card col6"><h3>Sources</h3><ul>${APP.sources.map(s=>`<li><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.name)}</a><br><span class="small">${esc(s.note)}</span></li>`).join("")}</ul></div><div class="card col6"><h3>Architecture Notes</h3><ul><li>Open-age, level-based course identity.</li><li>Complete unit pages are linked from every week and scope row.</li><li>Completion and mastery are reported separately.</li><li>Answer positions are randomized for portal quizzes and exams.</li><li>Retakes preserve best score and attempt history.</li><li>Local records support JSON, CSV, HTML, and print exports.</li><li>Built-in tools validate inputs and do not replace written reasoning.</li></ul></div><div class="card col12"><h3>Framework Coverage</h3><div class="table-wrap"><table><tr><th>Tag</th><th>Weeks</th></tr>${Object.entries(coverage).sort().map(([tag,weeks])=>`<tr><td>${esc(tag)}</td><td>${weeks.join(", ")}</td></tr>`).join("")}</table></div></div></div>`;
}'''

          new = '''function standards(){
  let coverage={};
  APP.weeks.forEach(w=>w.tags.forEach(tag=>{coverage[tag]??=[];coverage[tag].push(w.week)}));
  $("content").innerHTML=`<div class="grid"><div class="card col12"><h3>Standards &amp; Frameworks</h3><p>The 36-week Pre-Algebra sequence is organized around widely recognized secondary mathematics expectations while maintaining a coherent progression toward Algebra I.</p><p class="section-note">Framework labels are provided as alignment guides. Families and schools may compare them with requirements that apply in their own jurisdiction.</p></div><div class="card col12"><div class="table-wrap"><table><tr><th>Framework Connection</th><th>Course Weeks</th></tr>${Object.entries(coverage).sort(([a],[b])=>a.localeCompare(b)).map(([tag,weeks])=>`<tr><td>${esc(tag)}</td><td>${weeks.join(", ")}</td></tr>`).join("")}</table></div></div></div>`;
}'''

          duplicate_tail = '<script src="assets/prealgebra-archaemenes-upgrade.js"></script>\n</body>\n</html>\n</body>\n</html>\n'
          clean_tail = '<script src="assets/prealgebra-archaemenes-upgrade.js"></script>\n</body>\n</html>\n'

          old_count = text.count(old)
          tail_count = text.count(duplicate_tail)
          already_clean = old_count == 0 and tail_count == 0 and 'Standards &amp; Frameworks' in text and text.endswith('</html>\n')
          if already_clean:
              print('Pre-Algebra source is already clean.')
              raise SystemExit(0)
          if old_count != 1:
              raise SystemExit(f'Expected exactly one legacy standards block, found {old_count}')
          if tail_count != 1:
              raise SystemExit(f'Expected exactly one duplicate closing-tag tail, found {tail_count}')

          text = text.replace(old, new, 1).replace(duplicate_tail, clean_tail, 1)

          if 'Repository Sources & Standards Evidence' in text or '<h3>Architecture Notes</h3>' in text:
              raise SystemExit('Legacy public architecture copy remains')
          if text.count('</html>') != 1 or text.count('</body>') != 1:
              raise SystemExit('Unexpected closing tag count after cleanup')
          if '<script src="assets/prealgebra-archaemenes-upgrade.js"></script>' not in text:
              raise SystemExit('Pre-Algebra hardening script missing')

          path.write_text(text, encoding='utf-8')
      - name: Commit exact cleanup when needed
        run: |
          if git diff --quiet -- courses/mathematics/pre-algebra/index.html; then
            echo "No cleanup commit required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add courses/mathematics/pre-algebra/index.html
          git commit -m "Clean Pre-Algebra public source"
          git push origin HEAD:${{ github.head_ref }}
