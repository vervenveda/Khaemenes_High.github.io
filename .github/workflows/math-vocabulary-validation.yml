name: Mathematics Vocabulary Validation
on:
  push:
    branches: [main]
    paths:
      - 'courses/mathematics/pre-algebra/units/**/vocabulary.json'
      - 'courses/mathematics/algebra-1/units/**/vocabulary.json'
      - 'courses/mathematics/geometry/units/**/vocabulary.json'
      - 'courses/mathematics/algebra-2/units/**/vocabulary.json'
      - 'courses/mathematics/pre-algebra/index.html'
      - 'courses/mathematics/algebra-1/index.html'
      - 'courses/mathematics/geometry/index.html'
      - 'courses/mathematics/algebra-2/index.html'
      - 'courses/mathematics/tools/vocabulary-studio.html'
      - 'courses/shared/learner-scope-v1.js'
      - 'courses/shared/math-lesson-vocabulary-link.js'
      - 'tools/validate-math-lesson-vocabulary.mjs'
      - 'tools/validate-math-vocabulary.mjs'
      - '.github/workflows/math-vocabulary-validation.yml'
  pull_request:
    paths:
      - 'courses/mathematics/pre-algebra/units/**/vocabulary.json'
      - 'courses/mathematics/algebra-1/units/**/vocabulary.json'
      - 'courses/mathematics/geometry/units/**/vocabulary.json'
      - 'courses/mathematics/algebra-2/units/**/vocabulary.json'
      - 'courses/mathematics/pre-algebra/index.html'
      - 'courses/mathematics/algebra-1/index.html'
      - 'courses/mathematics/geometry/index.html'
      - 'courses/mathematics/algebra-2/index.html'
      - 'courses/mathematics/tools/vocabulary-studio.html'
      - 'courses/shared/learner-scope-v1.js'
      - 'courses/shared/math-lesson-vocabulary-link.js'
      - 'tools/validate-math-lesson-vocabulary.mjs'
      - 'tools/validate-math-vocabulary.mjs'
      - '.github/workflows/math-vocabulary-validation.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify mathematics dictionaries and student studio
        run: |
          node tools/validate-math-vocabulary.mjs
          node tools/validate-math-lesson-vocabulary.mjs
