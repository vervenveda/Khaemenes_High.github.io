name: Grade-aware course execution matrix
on:
  push:
    branches: [main]
    paths:
      - 'courses/shared/course-execution-matrix-v1.json'
      - 'tests/test-course-execution-matrix.cjs'
      - 'tests/test-grade-09-12-execution-sweep.cjs'
      - 'tests/test-math-placement-handoff-contract.cjs'
      - 'tests/test-chemistry11-anchor-investigations.cjs'
      - 'tests/test-chemistry11-full-year-lab-audit.cjs'
      - 'tests/test-chemistry11-journal-reload.cjs'
      - 'tests/test-chemistry11-inquiry-ledger.cjs'
      - 'tests/test-chemistry11-review-authority.cjs'
      - 'tests/test-english-week01-original-source-studios.cjs'
      - 'tests/test-english-weeks02-04-original-studios.cjs'
      - 'tests/test-ss12-*.cjs'
      - 'courses/shared/grade-09-12-execution-sweep-v1.json'
      - 'grades/**'
      - 'courses/mathematics/**'
      - 'courses/science/**'
      - 'courses/social-studies/**'
      - 'courses/language-arts/**'
      - 'courses/science/chemistry-11/**'
      - 'courses/social-studies/grade-12/**'
      - 'courses/mathematics/precalculus-trigonometry/**'
      - 'courses/mathematics/calculus-1/**'
      - '.github/workflows/course-execution-matrix.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check course routes, grade and engine contracts
        run: |
          node tests/test-course-execution-matrix.cjs
          node tests/test-grade-09-12-execution-sweep.cjs
          node tests/test-math-placement-handoff-contract.cjs
          node tests/test-chemistry11-anchor-investigations.cjs
          node tests/test-chemistry11-full-year-lab-audit.cjs
          node tests/test-chemistry11-journal-reload.cjs
          node tests/test-chemistry11-inquiry-ledger.cjs
          node tests/test-chemistry11-review-authority.cjs
          node tests/test-english-week01-original-source-studios.cjs
          node tests/test-english-weeks02-04-original-studios.cjs
          node tests/test-ss12-source-assessment-v2.cjs
          node tests/test-ss12-assessment-runtime.cjs
          node tests/test-ss12-graduation-gates.cjs
