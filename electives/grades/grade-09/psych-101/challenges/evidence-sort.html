</head><body><main id="main"><section class="hero"><div class="eyebrow">Optional · Non-graded</div><h1>Evidence Sort</h1><p class="lead">Classify each statement as Observation or Inference. This score is not stored and is never used as evidence about you.</p></section><section class="section"><div id="card" class="card"></div><div class="actions"><button class="btn" data-choice="Observation">Observation</button><button class="btn" data-choice="Inference">Inference</button><a class="btn" href="../lessons/index.html">Return</a></div><div id="feedback" class="feedback"></div></section></main><script>const items=[['The participant selected option B.','Observation'],['The participant was confused.','Inference'],['The graph shows a higher mean in Condition 2.','Observation'],['Condition 2 made everyone more motivated.','Inference'],['The survey response was 4 on a five-point scale.','Observation'],['The respondent has a fixed personality trait.','Inference']];let i=0,score=0;const card=document.getElementById('card'),fb=document.getElementById('feedback');function show(){card.innerHTML=`<h2>${i+1}/${items.length}</h2><p>${items[i][0]}</p>`;}document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{if(b.dataset.choice===items[i][1])score++;i++;if(i<items.length)show();else{card.innerHTML='<h2>Complete</h2>';fb.textContent=`${score}/${items.length} correct. Optional practice only — no mastery record changed.`;}});show();</script></body></html>
