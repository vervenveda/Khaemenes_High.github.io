<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Claim Calibrator — Psychology 101</title><link rel="stylesheet" href="../assets/psych101.css"><link rel="manifest" href="../manifest.webmanifest"><script src="../assets/register-sw.js" defer></script></head><body><main><section class="hero"><div class="eyebrow">Optional · Non-graded</div><h1>Claim Calibrator</h1><p class="lead">Choose the conclusion that best matches the evidence. Nothing is stored.</p></section><section class="section"><div class="card"><p>A small fictional study finds an association between two measured variables. Which claim is strongest?</p><div class="actions"><button class="btn" data-v="0">One variable definitely causes the other.</button><button class="btn" data-v="1">They were associated in this sample; causal direction and generalizability require more evidence.</button><button class="btn" data-v="0">The association describes every person.</button></div></div><div id="f" class="feedback"></div><a class="btn" href="../lessons/index.html">Return</a></section></main><script>document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{document.getElementById('f').textContent=b.dataset.v==='1'?'Strong calibration: evidence first, limits named.':'Too strong for the evidence. Look for causation, person-level, or generalization overclaim.';});</script></body></html>
